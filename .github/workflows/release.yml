name: release

# Fires only when the owner pushes a version tag (e.g. v0.2.0). Verifies the
# single-file importer is in sync and the suite is green, then publishes a
# GitHub Release with the droppable `deckport.py` attached. Inert until a tag
# is pushed — nothing runs on ordinary commits.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify single-file is in sync and tests pass
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tools]"
          python scripts/build_single_file.py --check
          pytest -q
      - name: Build packages (sdist + wheel for the PC-side tools)
        run: |
          pip install build
          python -m build
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deckport.py
            dist/*
          generate_release_notes: true
          body: |
            ## deckport ${{ github.ref_name }}

            Drop **`deckport.py`** on your Steam Deck (Desktop Mode) and run it —
            pure Python standard library, nothing to install. See the README for
            the full PC → Deck flow, and the recipe book for per-game configs.
