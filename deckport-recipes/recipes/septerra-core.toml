caveats       = "You must supply your own copy (available on Steam and GOG). The executable is septerra.exe, not Core.exe. Delete InstallScript.vdf from the install folder so the game launches reliably and videos play; install under default Proton then switch to GE-Proton. Apply the official 1.04 patch (or use the M-HT/SR recompiled binary) for crash fixes. Leave it fullscreen — windowed mode is unreliable. Controller support requires a Steam Input mouse-emulation layout — no native gamepad support."
