[launch]
binary         = "TWFC.exe"   # in Binaries/ subfolder
launch_options = ""
requires_files = []

[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Game:** 2010 High Moon Studios / Activision third-person shooter (UE3).

**DRM:** Delisted Dec 2017 when Activision's Hasbro license lapsed — **bring your own copy**.

**Install:** Real executable is `Binaries/TWFC.exe`. Bundled PhysX redist (in the game's `redist/` folder) **must be present for the game to launch**; `Proton` normally installs it on first run.

**Proton:** Runs well on Deck under `GE-Proton`.

**GFWL:** Uses Games for Windows Live (GFWL) — single-player works without signing in; GFWL overlay/save can prompt, just cancel/skip it.

**Display:** If gaming-mode cutscenes/fullscreen flicker, run the game in windowed mode (`alt+enter` toggles fullscreen; `alt-tab` out and back to clear a stuck cutscene)."""

