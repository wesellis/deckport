[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "gold"
caveats       = """
**Supply your own copy:** Delisted (lapsed Hasbro license) — configuration only, no links.

**Controller:** Native controller input works on Deck out of the box (console-origin third-person shooter), but the game shows **keyboard button prompts** by default; an optional community gamepad-UI mod (GameBanana / Nexus) adds proper controller glyphs.

**GFWL:** Present but campaign plays fine without an account.

**Multiplayer:** Official multiplayer master server was shut down April 2020 (a community server-restore setup exists, Steam copy required); the single-player campaign is the draw.

**ProtonDB:** Tier is *gold* but on a small/low-confidence sample (~6 reports, best-reported platinum, trending gold) — treat as promising-but-unconfirmed until tested.

**Display:** Use windowed mode in gaming mode to avoid fullscreen/cutscene flicker."""
