[about]
developer = "High Moon Studios"
publisher = "Activision"
released  = "2010"
genre     = "Third-person shooter"
modes     = "Single-player, online multiplayer (co-op campaign and competitive; official servers shut down 2020)"
summary   = "**Transformers: War for Cybertron** is a 2010 third-person shooter built on **Unreal Engine 3**, telling an original story of the Autobot/Decepticon civil war on the Transformers' home planet of Cybertron before their arrival on Earth. Developed by High Moon Studios and published by Activision, it was well received for its faithful take on the **Generation 1** fiction and its mix of campaign and **class-based multiplayer**. It was delisted at the end of 2017 after **Activision's Hasbro license lapsed**, and its online multiplayer servers were shut down in 2020, leaving the single-player campaign as the main draw."

