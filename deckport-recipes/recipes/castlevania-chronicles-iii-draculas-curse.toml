**Supply your own copy:** Unofficial fan game (BMC WarMachine), not affiliated with Konami; never sold on Steam, so `steam_appid` stays empty and there's no appid to launch through.

**Proton:** Built in **Clickteam Fusion 2.5**; Fusion games are well-proven on Deck under Proton with good performance and native controller support. Use `GE-Proton` for reliable gamepad input.

**Cosmetic:** Known Fusion gotcha — DirectShow intro/cutscene videos can blackscreen on Proton; **press a button to skip past the movie.**

**Binary:** Executable confirmed as `Castlevania Chronicles III - Dracula's Curse.exe` (the Fusion export is named after the game; matches the community cheat-table process name). It is a portable build — extract and add the `.exe` as a non-Steam game.

**Source:** Free fan game; official builds come from the developer **WarMachine Studios** (Discord / YouTube community / The Inverted Dungeon fan page), not Steam — so `steam_appid` stays empty.
"""
