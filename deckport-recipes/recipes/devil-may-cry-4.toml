[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "gold"
caveats       = """
**Supply your own copy.** deckport links nothing.

**Delisting:** Original DMC4 was delisted from Steam on 2024-01-31, so it is no longer purchasable there (existing owners keep it in their library). This recipe is for the **original** (appid `45700`), not the still-sold Special Edition (appid `329050`).

**Status:** ProtonDB **gold** (18 reports, best reaching platinum); community reports full playthroughs on Proton/Deck, but this specific recipe is **not yet Deck-verified**.

**Cutscenes:** The most common problem is black/silent intro and tutorial FMV videos on stock Valve Proton — fix by switching the title to **GE-Proton**, which bundles the needed media codecs.

**Executable:** Point the prefix at `DevilMayCry4_DX9.exe` (the launcher is `DMC4Launcher.exe`); the DX10 build (`DevilMayCry4_DX10.exe`) can be flaky under Proton.

**DRM:** No Games for Windows Live — 'Games for Windows' here is branding only, so there is no GFWL sign-in to bypass on the Steam copy.

**Controller:** Native controller support; the default Steam Input gamepad layout works.

**Modes:** Single-player only, so no server concerns."""
