caveats       = """
**Supply your own copy.** deckport links nothing.

**Delisted:** Delisted single-player Steam game (appid `338930`); no online component, so nothing to lose from server shutdowns.

**Proton:** ProtonDB platinum (modest report count) and community reports say it runs well on the Steam Deck with no required tweaks. Run with `GE-Proton` or `proton_experimental`.

**Binary:** `TransformerDevastation.exe`.

**Controller:** Native gamepad support — no Steam Input layout needed.

**Display:** Resolution menu is limited; use `1280x720` on the Deck.

**Status:** Still needs a **hands-on confirmation on a Deck** before marking verified."""
