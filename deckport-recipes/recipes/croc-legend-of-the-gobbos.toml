[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Which version:** This recipe targets the **classic 1997 PC build** of Croc: Legend of the Gobbos, not the 2025 Argonaut Games remaster (Steam app 3043940 / GOG Platinum Edition). The cleanest legitimate way to get the classic build today is **GOG**: buying the remaster ("Platinum Edition") also grants the original 1997 PC version, and GOG additionally lists it standalone as "Croc Legend of the Gobbos Classic". Install via the **Heroic Games Launcher** (or add it as a non-Steam game) and run it through Proton.

**Binary — why CrocD3D.exe:** The classic install ships two executables. **Crocrun.exe** is the front-end launcher/configurator, but it requests administrator rights every launch (and can crash with DEP), which makes it unreliable under Proton/Wine. **CrocD3D.exe** is the actual Direct3D game executable; launching it directly skips the admin prompt and is the recommended target on the Deck. Run Crocrun.exe once first (on a PC or via the launcher) to set graphics/audio options, then point the recipe at CrocD3D.exe.

**ProtonDB / Deck status:** ProtonDB tiering on app 3043940 reflects the *remaster*, not this classic build, so treat the classic as **needs-test**. The GOG classic ships pre-configured with **DDrawCompat** (a DirectDraw wrapper) to run on modern systems, which carries over under Proton; the legacy D3D path is lightweight and runs comfortably at the Deck's TDP.

**Recommended fix — Definitive Edition patch:** For the best handheld experience, apply the community **"Croc: Legend of the Gobbos – Definitive Edition"** unofficial patch (by crocguy0688). It adds non-stretched **widescreen / higher resolutions**, **full analog controller support** (like the console versions), native modern Windows/Linux support, and selectable PSX/PC/DEMO soundtracks. Install by extracting it into the game's main folder over the classic files; it integrates with the existing executables.

**Controller:** The unpatched 1997 build has limited/keyboard-centric input and no native analog gamepad support, so use **Steam Input** to map a controller (or use the Big Picture / Deck input mapper). The Definitive Edition patch restores proper analog controller support and is the better route if you want native gamepad handling.

**Proton:** Use **GE-Proton**. A recent GE build handles the legacy DirectDraw/Direct3D path and the patch's modern code well. If you see a black screen or the launcher hangs, switch which executable Heroic/Steam targets (CrocD3D.exe vs Crocrun.exe) and retry.
"""

