caveats       = """
**Classic build, not the remaster:** This recipe is for the original 1997 PC version. Get it legitimately via GOG — the remaster purchase ("Platinum Edition") includes the classic, and GOG also lists "Croc Legend of the Gobbos Classic" standalone. Install through Heroic or add as a non-Steam game.

**Launch CrocD3D.exe, not Crocrun.exe:** Crocrun.exe is the launcher and demands admin rights every run (and can hit DEP crashes), which is flaky under Proton. Configure once via Crocrun.exe, then launch **CrocD3D.exe** directly.

**Apply the Definitive Edition patch for widescreen + controller:** The unpatched build is 4:3 with limited gamepad support. The community Definitive Edition patch adds widescreen, higher resolution and native analog controller support; without it, map the controller via Steam Input.

**Status is needs-test:** ProtonDB tier on app 3043940 reflects the 2025 remaster, not this classic build, so this is unverified on Deck for the original.
"""
