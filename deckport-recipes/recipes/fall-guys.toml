[launch]
binary         = "FallGuys_client.exe"
launch_options = ""
requires_files = []

[proton]
version    = "proton_experimental"
winetricks = []
notes      = """
**Delisting:** Fall Guys was delisted from Steam in June 2022 and is now free-to-play exclusively via the Epic Games Store.

**Install:** On Steam Deck, install `Heroic Games Launcher` from Discover (Desktop Mode), log in to your Epic Games account, then install Fall Guys through Heroic.

**Proton:** In the game settings within Heroic, **force `Proton Experimental`** as the compatibility tool. `GE-Proton` is an alternative if Experimental has issues.

**Anti-Cheat:** Easy Anti-Cheat (`EAC`) is Proton-compatible for this title, but setup is fiddly and game updates have intermittently broken it (reports of the EAC runtime not initializing). If you hit an "Anti-cheat not initialized" error, in Heroic's settings use **Run EXE on Prefix** to run `EpicOnlineServices/EpicOnlineServicesInstaller.exe` and `EasyAntiCheat/EasyAntiCheat_Setup.exe` from the install folder, and toggle the **EasyAntiCheat Runtime** option (uncheck/recheck) in Heroic's settings.

**Gaming Mode:** Add Heroic to Steam as a non-Steam game to launch from Gaming Mode.
"""

[about]
developer = "Mediatonic (acquired by Epic Games)"
publisher = "Epic Games"
released  = "2020-08-04 (Steam); went free-to-play on Epic 2022-06-21"
genre     = "Party battle royale, Platformer"
modes     = "Multiplayer (up to 60 players)"
summary   = """
**Fall Guys** is a massively multiplayer **party battle royale** where up to **60 players** compete through rounds of escalating chaos until one jellybean-shaped contestant is crowned winner. Developed by **Mediatonic** and originally released on Steam in August 2020, it was a massive hit and one of **PlayStation Plus**'s most downloaded games.

**Epic Games** acquired Mediatonic in 2021, then moved the game to the **Epic Games Store** as a **free-to-play** title in June 2022, **delisting it from Steam**. Despite the platform switch, Fall Guys remains popular with frequent seasonal content and cosmetic updates. Proton compatibility via **Heroic Games Launcher** makes it accessible on Steam Deck.
"""

