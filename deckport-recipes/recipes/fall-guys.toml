caveats       = """
**Not on Steam:** No longer on Steam — must install via `Heroic Games Launcher` (Epic Games account required, free game).

**Proton:** Force `Proton Experimental` in Heroic's game settings.

**Anti-Cheat:** `EAC` is Proton-compatible but finicky — updates have broken it before. If it won't initialize, run the `EpicOnlineServicesInstaller.exe` / `EasyAntiCheat_Setup.exe` on the prefix via Heroic and toggle the EasyAntiCheat Runtime option.

**Gaming Mode:** Add Heroic as a non-Steam game to reach Gaming Mode.

**Controller:** If gamepad input breaks after a Heroic update, check for `Flatpak` runtime regressions — `Heroic 2.18.0` had a revert for this.
"""
