**Delisted:** Delisted from Steam (`appid 310810`) in March 2022 after the Rock Pocket/Sierra publishing deal expired; existing owners keep library access.

**Proton:** Steam Deck Verified with ProtonDB platinum, so it should run out of the box on the Deck with stock/`GE-Proton`.

