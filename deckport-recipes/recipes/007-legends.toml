[game]
title       = "007 Legends"
slug        = "007-legends"
aliases     = ["James Bond 007 Legends"]
type        = "proton"
engine      = "other"
steam_appid = "211670"        # was on Steam (app 211670), now delisted
sgdb_id     = ""

[launch]
binary         = "Bond2012PC.exe"
launch_options = ""
requires_files = []

[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Game:** Eurocom's 2012 James Bond FPS (Unreal Engine 3), delisted when the Bond game licence moved on. The launcher executable is `Bond2012PC.exe` (confirmed via PCGamingWiki / file databases).

**Proton:** Community reports it runs under `Proton 8.0+`/`GE-Proton`; older Proton builds were borked, so **use a recent `GE-Proton`**.

**GFWL:** Game uses Games for Windows Live (GFWL), whose Marketplace/online sign-in has been dead since 2022. Install the offline GFWL redistributable, then apply an `xliveless`-style local-replacement fix (drop the replacement `xlive.dll` alongside the game) to launch offline and skip the dead sign-in overlay; **otherwise the GFWL login prompt can stall on first launch**. PCGamingWiki's GFWL page documents the legitimate fix.

**Controller:** No native controller support and very strong, non-disable-able mouse acceleration — you must build a Steam Input gamepad layout (gyro + right trackpad as mouse). There is no in-game FOV slider either (per WSGF).
"""

