publisher = "Activision"
released  = "November 2012 (PC)"
genre     = "First-person shooter"
modes     = "Single-player; 4-player split-screen + online (servers dead)"
summary   = """
**007 Legends** is a James Bond shooter that runs 007 through one mission from each film era — Goldfinger, On Her Majesty's Secret Service, Moonraker, Licence to Kill and Die Another Day, with **Skyfall** added as DLC — all framed as a dying flashback while Bond sinks into a river after Eve's errant sniper shot.

Built on **Unreal Engine 3** by **Eurocom**, the studio behind the 2010 **GoldenEye 007** remake; it reuses that game's feel but was critically panned and was one of the last projects before the studio closed. **Daniel Craig's** likeness is used for Bond across every era.
"""

[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "silver"
caveats       = """
**Supply your own copy:** Delisted commercial game (licence expired).

**Launcher:** `Bond2012PC.exe` is the game executable.

**GFWL:** Needs the offline GFWL redistributable plus an `xliveless`-style local-replacement fix to launch reliably and skip the dead sign-in; use a recent `GE-Proton`.

**Controller:** No native controller support and very strong mouse acceleration — bind a Steam Input gamepad layout (gyro + right trackpad as mouse) for a playable FPS control scheme.

**Display:** No in-game FOV slider (per WSGF); a community config tweak is the only way to widen it.

**Note:** deckport links nothing.
"""
