caveats       = "Supply your own retail copy — this 1996 PC port was never on Steam/GOG, so there is no ProtonDB entry (tier is a conservative estimate, not a real report). Launch DAYTONA.EXE, not DAYTONAUSA.EXE. Run ddx_d3d.exe once to enable the Direct3D renderer, then place dgVoodoo2's DDraw.dll and D3DImm.dll in the game directory. Fixed 640x480 / 16-bit, no widescreen. In-game music requires the disc mounted as drive A:, which generally won't work cleanly under Proton."
