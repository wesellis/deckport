[proton]
version    = "proton_experimental"
winetricks = []
notes      = """
**Overview:** Monolith / SEGA 2006 first-person psychological horror (LithTech Jupiter EX engine).

**DRM:** Delisted from Steam — **bring your own copy**. Launch `Condemned.exe` from the game's root folder.

**Proton:** Confirmed strong on Deck — officially Deck-**Playable** and ProtonDB **Platinum**. `proton_experimental` or `GE-Proton` both work.

**Essential fixes (unpack into the game folder):** ThirteenAG's **Condemned Widescreen Fix** adds real widescreen and fixes the stretched menu / low framerate. Pair it with the **Missing Steam Files Fix** — the Steam release ships a smaller archive with missing and reversed sound effects.

**Controller:** The base game has **no native gamepad support**. ThirteenAG's fix adds full gamepad support (via Xidi), **but on Steam Deck specifically, rebinding keys through the fix can crash** (a WINEDLLOVERRIDE quirk) — so the reliable route on Deck is a **Steam Input** layout. A community "Simple Steam Deck Configuration" profile (Xbox-360 style) works well; set the analog axes in-game after applying it.
"""

[about]
developer = "Monolith Productions"
publisher = "Sega"
released  = "2006"
genre     = "First-person survival horror"
modes     = "Single-player"
summary   = """
**Condemned: Criminal Origins** is a first-person **survival horror** game built on Monolith's **LithTech Jupiter EX engine**, first released on Xbox 360 in 2005 and on PC in 2006. Players take the role of FBI agent **Ethan Thomas** investigating a string of serial killings, with brutal, **melee-focused close-quarters combat** against deranged enemies in decaying urban environments.

It is widely regarded as one of the standout survival horror titles of the mid-2000s, praised for its oppressive atmosphere, sound design, and improvised weapon combat. It was **delisted from Steam in October 2025**, following Warner Bros. Games' closure of Monolith Productions earlier that year.
"""

