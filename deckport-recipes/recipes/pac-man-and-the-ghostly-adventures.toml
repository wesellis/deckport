caveats       = """
**Supply your own copy.** deckport links nothing.

**DRM:** Delisted from Steam (appid `239720`, removed `2020-07-09`) but remains in the library of prior owners; **requires Steam DRM**, so it must be launched through Steam.

**Proton:** Valve rates it **Steam Deck Playable** and ProtonDB reports trend **Platinum** (small sample); runs under Proton (`GE-Proton` / Experimental both fine).

**Controller:** Native XInput support — the Deck gamepad works without a Steam Input layout. If a controller misbehaves (reported with Xbox One pads), toggle the per-game Steam Input / generic-controller setting.

**Modes:** Single-player only — no servers to worry about.

**Binary:** `PacMan.exe` (confirmed process name) under `Binaries/Win32`.
"""

[about]
developer = "Vicious Cycle Software (Monkey Bar Games)"
publisher = "Namco Bandai Games"
released  = "2013"
genre     = "3D platformer"
modes     = "Single-player campaign with a local multiplayer ghost-chase mode"
summary   = """
**Pac-Man and the Ghostly Adventures** is a 2013 **3D platformer** based on the Namco Bandai **animated TV series** of the same name, in which a teenage Pac explores Pac-World across themed levels using **berry-based power-ups**. Built on **Unreal Engine 3** and released for Windows alongside the Xbox 360, PlayStation 3 and Wii U versions, it features a **Pac-Man Vs.-style mode** where players take control of the four ghosts to chase Pac through a maze.

The game drew mixed reviews, praised for its polish and presentation but criticized for shallow, repetitive platforming. It was **removed from Steam in 2020**, leaving it unavailable for new buyers while remaining playable for prior owners.
"""
