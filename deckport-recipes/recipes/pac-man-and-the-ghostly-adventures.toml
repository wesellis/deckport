[game]
title       = "Pac-Man and the Ghostly Adventures"
slug        = "pac-man-and-the-ghostly-adventures"
aliases     = []
type        = "proton"
engine      = "other"
steam_appid = "239720"
sgdb_id     = ""

[launch]
binary         = "PacMan.exe"   # confirmed process name; lives under the install's Binaries/Win32 folder (UE3 layout)
launch_options = ""
requires_files = []

[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**DRM:** Delisted Steam game (appid `239720`, removed `2020-07-09`); **requires Steam DRM**, so launch through Steam with your owned copy.

**Proton:** Unreal Engine 3 platformer. Valve marks it **Steam Deck Playable** and ProtonDB reports rate it **Platinum** — it runs clean out of the box. Use `GE-Proton` (or `proton_experimental`) — both work.

**Controller:** Game has **native XInput controller support** (Xbox 360 / XInput pads work without config), so the Deck's built-in gamepad works out of the box. Note: some users report an Xbox One controller only worked after toggling off Steam's generic-controller (Steam Input) setting — if input drops, flip the per-game controller setting.

**Install:** The `PacMan.exe` process lives under the install's `Binaries/Win32` folder (UE3 layout). deckport only configures the prefix; it never bundles or links the game files.
"""

