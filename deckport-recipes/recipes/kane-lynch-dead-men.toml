[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "silver"
caveats       = """
**Supply your own copy:** Delisted Steam game (appid `8080`). deckport links nothing.

**Status:** Community confirms it runs on Steam Deck via `Proton 8` after the GFWL bypass.

**GFWL:** **You MUST disable Games for Windows LIVE** (extract the GFWL-disable files into the game folder) or it won't launch.

**Proton:** Pin `Proton 8.0-5` — `Proton 9` has graphical glitches and `Proton 10`/`11` fail to start.

**Chapter-4 bug:** Cap to ~30 fps at the start of chapter 4 to dodge a known game-breaking bug.

**Multiplayer:** The original online co-op/multiplayer relies on GFWL servers that are gone — treat it as single-player.

**Controller:** XInput-based but recognition can be flaky and keyboard+mouse can't be mixed with a pad — keep Steam Input on (Xbox 360 / Gamepad template) for reliable Deck controls.

**Binary:** Launch exe is `kaneandlynch.exe` in the install root (the same exe that errors on missing `xlive.dll` until GFWL is handled)."""
