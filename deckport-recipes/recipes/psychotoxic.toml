[about]
developer = "Nuclearvision Entertainment"
publisher = "Vidis (Germany/Austria/Russia); Whiptail Interactive (North America)"
released  = "2004 (Europe), 2005 (North America)"
genre     = "First-person shooter"
modes     = "Single-player"
summary   = "**Psychotoxic** is a **first-person shooter** in which players control Angela 'Angie' Prophet, a **half-angel** woman who battles a devil-worshipping cult to stop the **Fourth Horseman** from triggering an apocalypse. Originally to be published by **CDV** before that deal collapsed, it shipped in a rough, unfinished state and was widely panned by critics as one of the era's worst shooters. The poor reception and weak sales contributed to developer **Nuclearvision Entertainment** shutting down in 2009, and the game was **never released on Steam** or other digital storefronts, leaving it a long-obscure cult oddity."

