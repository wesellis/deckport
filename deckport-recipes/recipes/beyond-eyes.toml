[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "platinum"
caveats       = """
**Supply your own copy.** deckport links nothing.

**Delisted:** Not for sale — retired Sept 2021 after Team17 publishing deal ended; prior owners keep it.

**Proton:** ProtonDB platinum and a Unity game, so it should run cleanly on the Deck with `GE-Proton`; no DRM/online dependency.

**Controller:** Native gamepad support (Xbox 360/Xbox-style bindings, not rebindable in-game). The game maps camera rotation to the analog triggers, which are very sensitive — players widely report constant camera spin / unwanted movement from slight trigger pressure. A custom Steam Input layout (or remapping the triggers to a deadzone-friendly binding) is the practical fix if look-rotation drifts.

**Binary:** Name (`Beyond Eyes.exe`) inferred from a standard Unity build; confirm against your install."""
