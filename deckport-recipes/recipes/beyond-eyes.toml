[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Delisted:** Steam game (appid `356050`) — retired Sept 2021 after the publishing deal with Team17 ended; still in libraries of prior owners but **no longer for sale**.

**Proton:** Unity engine title, runs essentially out of the box on the Deck — ProtonDB rates it platinum. `GE-Proton` (or `proton_experimental`) works.

**DRM:** No DRM/GFWL, no `winetricks`, no launch options needed. It's a short narrative walking game with no online component.

**Controller:** Works natively (Xbox-style gamepad); if the recipe ever ships without detected pad input, a default Steam Input gamepad/keyboard layout covers it.

**Install:** deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "Tiger & Squid"
publisher = "Team17"
released  = "2015"
genre     = "Narrative adventure / walking simulator"
modes     = "Single-player"
summary   = "**Beyond Eyes** is a 2015 **narrative adventure** from Dutch indie studio Tiger & Squid in which you guide Rae, a young blind girl, through serene suburban environments in search of her lost cat, Nani. Because Rae cannot see, the world is revealed as a dream-like **pastel watercolor** landscape that morphs into view as she explores it through her other senses. It was published by Team17 and praised for its evocative art and emotional tone, though some reviewers found its deliberately slow walking pace a drawback. The game was **retired from sale** in September 2021 after the publishing arrangement ended."

