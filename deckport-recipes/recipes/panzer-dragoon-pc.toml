[proton]
version    = "GE-Proton"
winetricks = []
notes      = "Add PANZERDG.EXE as a non-Steam game. Use GE-Proton. The 1996/97 PC port renders purely in software at 640x480 and does not require a 3D accelerator. If the game crashes on launch or picks the wrong resolution, set the mode explicitly in panzerdg.ini by adding a [Screen] section with VMode=640*480*16. dgVoodoo2 is OPTIONAL and can help wrap the game's DirectDraw fullscreen if you hit blank-screen or scaling issues — place dgVoodoo2 DLLs in the game directory. No widescreen; fixed 640x480 resolution. NOTE: The 2020 Panzer Dragoon Remake (Steam App ID 715890) is a full remake available on Steam and is the recommended way to play this game on Deck."

[about]
developer = "Sega"
publisher = "Sega"
released  = "1996"
genre     = "Rail Shooter"
modes     = "Single-player"
summary   = "Panzer Dragoon is the 1996 PC port of the classic Sega Saturn on-rails shooter, in which the player rides a dragon through a post-apocalyptic world, battling bio-engineered creatures and enemy forces. The game uses an auto-scrolling rail system where players rotate their camera 360 degrees to shoot down enemies. A 2020 full remake (Steam App ID 715890) is available and is the recommended modern option for Steam Deck players."

