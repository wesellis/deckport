[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Game:** Original Super Lucky's Tale (Steam appid `847360`), delisted Aug 2020 when New Super Lucky's Tale launched; owners can still install it from their library. Unity engine title, single-player 3D platformer, no online component. ProtonDB overall tier gold (recent reports trend higher, but confidence is only moderate on a small report count — gold is the honest call).

**Proton:** A 2018-era Proton report (`Proton 3.76`) showed missing-character/flickering rendering, but that is long obsolete — **use `GE-Proton` (or recent `proton_experimental`)** for clean DXVK rendering on the Deck's AMD GPU.

**DRM:** No GFWL/SecuROM/Denuvo DRM.

**Controller:** Native Xbox-style controller support, so the Deck's built-in pad works out of the box; non-Xbox pads (e.g. DualShock 4) need a Steam Input layout, which the Deck provides automatically.

**Install:** deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "Playful Studios"
publisher = "Microsoft Studios"
released  = "2017"
genre     = "3D platformer"
modes     = "Single-player"
summary   = "**Super Lucky's Tale** is a 2017 **Unity**-engine **3D platformer** starring Lucky the fox, who travels the Book of Ages to stop the villain Jinx and his Kitty Litter henchmen. Developed by Playful Studios and published by Microsoft, it launched as an **Xbox One X** title and is a follow-up to the Oculus Rift VR game **Lucky's Tale**. The original Steam release was **delisted in August 2020** when the expanded remaster New Super Lucky's Tale arrived; existing owners can still install the original from their libraries."

