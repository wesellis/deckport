[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "gold"
caveats       = """
**Supply your own copy:** Owners can reinstall from their Steam library; deckport links nothing.

**Delisted:** Delisted in Aug 2020 (original Super Lucky's Tale, not the New Super Lucky's Tale remaster, appid `1038300`, which is still sold and Deck Verified). ProtonDB tier gold.

**Proton:** Set Proton to `GE-Proton` (or recent `proton_experimental`) — the only negative report on file is a 2018 `Proton 3.76` rendering glitch that modern Proton resolves.

**Online:** Single-player only, no servers to worry about.

**Controller:** Native controller support means the Deck's gamepad works without extra config; some users note the original ignores certain analog-trigger inputs (e.g. dig-on-hold) and only fully supports Xbox-layout pads, so prefer the Deck's default Xbox-style input.

**NEEDS-TEST:** binary `SLT.exe` and exact `GE-Proton` build not yet confirmed on a physical Deck."""
