[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Game:** Delisted Steam shmup by Flat Software (`appid 207380`, removed from sale 2023-01-06; eXceed Trilogy delisting). ProtonDB platinum.

**Proton:** Community confirms it runs near-flawlessly on `Proton 5.13-6`; `GE-Proton` (or `proton_experimental` as a fallback) works just as well on the Deck.

**DRM:** No GFWL/SecuROM DRM.

**Controller:** Native keyboard + XInput controller support, so the Deck gamepad works out of the box; if the in-game controller mapping feels off, force the Deck's built-in keyboard/mouse Steam Input layout.

**Quirk:** Known minor quirk: the on-screen virtual keyboard for high-score name entry **may not accept input under Proton** — focus the physical/Deck keyboard for that one screen.

**Install:** deckport only configures the prefix; it never bundles or links the game files.
"""

[about]
developer = "Tennen-sozai (formerly FLAT)"
publisher = "Nyu Media"
released  = "2012 (Steam release; remake of the 2006 doujin original)"
genre     = "Vertical-scrolling danmaku (bullet hell) shoot 'em up"
modes     = "Single-player"
summary   = "**eXceed 2nd - Vampire REX** is the second entry in the **eXceed trilogy**, a Japanese doujin **bullet-hell** shoot 'em up series by the circle Tennen-sozai (originally FLAT). It centers on a single playable character, the vampire **Ria File**, and was localized into English by Nyu Media for its Steam release. The series is regarded as an underrated example of XP-era doujin **danmaku** design. It was delisted from Steam in January 2023 after the publisher **lost contact with the developer**, though existing owners retain library access."

