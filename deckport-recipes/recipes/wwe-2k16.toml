icon  = "auto"

[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "gold"
caveats       = """
**Supply your own copy:** Delisted annual sports title (no longer sold on Steam — only 2K23/2K24/Battlegrounds remain); configuration only, no links.

**Online:** Servers were shut down in 2017, so this is a single-player / local-multiplayer experience only.

**Fix:** If it won't launch, run the bundled VC++ 2012 redist (`_CommonRedist/vcredist/2012/vcredist_x64.exe`) — the installer skips it.

**Controller:** Deck controller works natively as an Xbox pad; no Steam Input layout needed.

**Licensing:** Wrestler-likeness licensing makes this a rights-heavy entry even as documentation.
"""

