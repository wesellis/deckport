caveats       = "Official Sega free release, now delisted from Steam (live for ~one day in Oct 2020); supply your own copy. Steam DRM-wrapped — must be launched through Steam (appid 1368460). Very short: one level, one playable character (Ax Battler), ~15-30 minutes — it is a 2012 prototype, not a finished game, with rough mechanics by design. ProtonDB reports platinum (runs near-native). Controller works, but the game's own input/rebind menu is buggy and may not detect a pad — use Steam Input to apply a gamepad layout if buttons don't register. Note: separate fan games Golden Axe Myth and Golden Axe Returns also exist and are different, larger-scope projects."
