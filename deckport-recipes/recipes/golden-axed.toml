[proton]
version    = "GE-Proton"
winetricks = []
notes      = "Runs essentially out of the box with standard Proton (whitelisted from Proton 5.13; ProtonDB reports it as platinum). GE-Proton also fine. Steam DRM-wrapped — launch through Steam (steam_appid 1368460), not the bare exe. A controller works, but the in-game input/rebind menu is buggy and does not detect some pads; if buttons aren't read, set the controller to a gamepad layout via Steam Input (Big Picture / Deck controller settings) rather than relying on the game's own binding screen. Unity title. Released free by Sega in October 2020 for the Sega 60th anniversary (alongside Streets of Kamurocho) and delisted from Steam the next day; supply your own copy. Short prototype/vertical-slice (~15-30 minutes) — not a full game. One playable character (Ax Battler / a modernized barbarian) in this build; the never-released reboot was to feature the classic trio."

[about]
developer = "Sega Studios Australia"
publisher = "Sega"
released  = "2020"
genre     = "Beat-em-up"
modes     = "Single-player"
summary   = "Golden Axed is an official Sega prototype of a never-released Golden Axe reboot (internally 'Golden Axe Reborn'), built in roughly two weeks in 2012 by Sega Studios Australia and made public for free in October 2020 for Sega's 60th anniversary. The build is a single short level with one playable barbarian (Ax Battler) hacking through enemies toward Death Adder's throne room — a vertical slice of about 15-30 minutes, released alongside Streets of Kamurocho. Sega delisted it from Steam one day after release, so it is no longer available to download from the store."

