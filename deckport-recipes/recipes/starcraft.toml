caveats       = """
FREE — official Blizzard free download since 2017 via the Battle.net desktop app (the original game patched to 1.18, including the Brood War expansion). There is no Steam release and no Steam app ID, so there is no single ProtonDB tier for it; rate the Battle.net launcher experience instead.

Battle.net launcher: requires GE-Proton (use GE-Proton 9-23 or newer for the launcher self-update fix). After installing, repoint the Steam shortcut to 'Battle.net Launcher.exe', not the installer.

Controls: keyboard/mouse RTS — no native gamepad. Best docked with a keyboard, or use a Steam Input layout (right trackpad as mouse).

A paid StarCraft Remastered upgrade is available via Battle.net for HD graphics and widescreen, but the base game is fully free."""
