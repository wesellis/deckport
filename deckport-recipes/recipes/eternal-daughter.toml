caveats       = "Completely free freeware — download from Derek Yu's site (derekyu.com) or the Internet Archive; the original blackeyesoftware.com site is now defunct. Not a Steam title, so there is no ProtonDB entry (protondb_tier left empty). Built in Clickteam Multimedia Fusion; the executable is 'Eternal Daughter.exe' (with a space) and ships with Cncs232.dll — these old MMF games generally run fine under Proton but should be tested on the Deck. No native gamepad support — keyboard-only, so use a Steam Input controller layout to map controller buttons to keyboard inputs. Created by Derek Yu and Jon Perry; Derek Yu later made Spelunky. One of the earliest polished Metroidvania indie games, predating Cave Story."
