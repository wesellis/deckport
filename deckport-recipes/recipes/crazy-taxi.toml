caveats       = "Supply your own copy — delisted from Steam in December 2024 as part of Sega's Dreamcast Collection delisting (existing owners keep access). Stock build reads analog input digitally; install SilentPatch (CookiePLMonster) for proper analog steering, or expect on/off controls. The original Offspring/Bad Religion soundtrack is NOT in the Steam version and cannot be restored (licensing); the Dreamcast Restoration mod only restores the original brand logos and locations. This is the 2011 Steam re-release of the original Crazy Taxi (App 71230) — separate from Crazy Taxi 3 (different game)."
