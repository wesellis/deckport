caveats       = "You must supply your own legally obtained copy — this game has no current digital storefront release, and it is a CD-based title (a community no-disc fix exists to run it without the original disc). The PC version renders entirely in software with no Direct3D/3Dfx path, so DirectX wrappers like dgVoodoo2 are NOT the fix — the actual issue is the game running far too fast on modern CPUs, which needs a frame limiter (target 60 FPS). Configure Steam Input to map your controller to the game's inputs. ProtonDB tier is left pending: there is no Steam release and insufficient modern Proton/Steam Deck reports to assign a real tier."
