[game]
title       = "The Simpsons: Hit & Run"
slug        = "simpsons-hit-and-run"
aliases     = ["Simpsons Hit and Run", "Hit and Run", "SHAR"]
type        = "proton"
engine      = "other"
steam_appid = ""
sgdb_id     = ""

[launch]
binary         = "Lucas' Simpsons Hit & Run Mod Launcher.exe"   # launch via the Mod Launcher; base game exe is "Simpsons.exe"
launch_options = ""
requires_files = []

[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Game:** 2003 Radical Entertainment open-world game (a GTA-style Simpsons romp).

**DRM:** Never re-released digitally and long out of print — **bring your own copy**.

**Proton:** Runs well on Deck under recent stable Proton (`Proton 9.0+` / `GE-Proton` both work).

**Install:** **Strongly recommended** — add `Lucas' Simpsons Hit & Run Mod Launcher.exe` to Steam instead of the base exe — point Proton at it.

**Controller:** In the launcher's Hacks, enable `XInput` for full Steam Deck gamepad support.

**Display:** Enable `Modern Resolution Support`/Widescreen for 16:10.

**Cosmetic:** Enable the `Direct3D 9` renderer plus `Anti-Aliasing` (MSAA) for cleaner visuals.

**Note:** Base game runs without the launcher but defaults to 4:3 and uses keyboard/mouse; the launcher is what makes it a clean controller + widescreen experience on Deck.
"""

[about]
developer = "Radical Entertainment"
publisher = "Vivendi Universal Games"
released  = "2003"
genre     = "Action-adventure, open-world driving and platforming"
modes     = "Single-player"
summary   = "**The Simpsons: Hit & Run** is a 2003 **open-world action** game built around **Springfield**, often described as a family-friendly riff on **Grand Theft Auto**. Players control members of the Simpson family and Apu across **seven story levels**, driving missions, races, and collectible hunts in a faithfully recreated cartoon world. Developed by **Radical Entertainment** and published by Vivendi Universal Games, it was widely praised and is frequently cited as the best Simpsons game ever made. It was never re-released on modern digital storefronts and has long been **out of print**, so it survives mainly through its dedicated **modding community**."

