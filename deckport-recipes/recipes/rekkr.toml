[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = ""
caveats       = """
**Completely standalone:** `REKKRSA.iwad` IS the game, no Doom or other IWAD required. Download the free standalone zip from manbitesshark.org and drop `REKKRSA.iwad` into `~/.var/app/org.zdoom.GZDoom/.config/gzdoom`.

**Launch:** Pass it via `-iwad` (not `-file`) since it is an IWAD, not a mod PK3.

**Separate commercial release:** `REKKR: Sunken Land` is a separate paid game (Steam/GOG/itch.io), not DLC for this free IWAD — it ships its own bundled GZDoom and adds a fourth canonical story episode.

**Controller:** Use `GZDeck` (github.com/flegald/GZDeck) for a Game Mode-friendly launcher; it needs `--no-sandbox` as a launch argument when added as a non-Steam game.

**Alternative:** Also playable in `Chocolate Doom` for a more faithful retro experience."""
