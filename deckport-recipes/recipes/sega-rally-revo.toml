[game]
title       = "Sega Rally Revo"
slug        = "sega-rally-revo"
aliases     = ["Sega Rally", "Sega Rally Revo PC"]
type        = "proton"
engine      = "other"
steam_appid = "4790"
sgdb_id     = ""

[launch]
binary         = "SEGARallylauncher.exe"   # launcher in SEGA/SEGA Rally; sets resolution, then starts SEGA Rally_SSE1.exe
launch_options = ""
requires_files = []

[proton]
version    = "GE-Proton"
winetricks = ["d3dx9_35"]
notes      = """
**Overview:** Sega Racing Studio's 2007 rally racer (Steam appid `4790`), delisted.

**DRM:** This is a **Games for Windows – LIVE (GFWL)** title that *also* shipped with SafeDisc disc protection — so there are two hurdles, not one. GFWL is dead and the SafeDisc check fails under Proton, so the stock build will not launch as-is. The community fix is to apply the publisher's later **DRM-free / NoDVD update** plus a GFWL-disabler so the game boots offline without the dead LIVE service. (Earlier note here claiming "not GFWL" was wrong — GFWL is present.)

**Install:** Add it as a non-Steam game (or via the SEGA Rally entry) and force `GE-Proton`. Install `d3dx9_35` into the prefix with `protontricks` (the launcher and renderer need the legacy D3DX9 runtime).

**Display:** Launch `SEGARallylauncher.exe` first, set resolution to `1280x800` (Deck) or `1280x720`, then start the race. The launcher lives in `SEGA/SEGA Rally`; if it crashes, run `SEGA Rally_SSE1.exe` directly.

**Compatibility:** Once it launches, reports describe it running well on Deck/Deck OLED (good frame pacing); one known quirk is missing audio on the SEGA intro logo.
"""

