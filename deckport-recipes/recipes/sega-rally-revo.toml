caveats       = """
**Supply your own copy:** Delisted commercial game.

**DRM:** Two blockers, not one — this is a **GFWL** title that also shipped with **SafeDisc** disc protection. The dead LIVE service and the disc check both stop the stock build from launching under Proton, so you need the publisher's **DRM-free / NoDVD update** plus a GFWL-disabler so it boots offline. (Do not trust older notes that said "not GFWL".)

**Proton:** Force `GE-Proton` and `protontricks d3dx9_35`.

**Display:** Set resolution in `SEGARallylauncher.exe` (`1280x800` on Deck) — the launcher may not detect the Deck panel automatically. If the launcher itself crashes, run `SEGA Rally_SSE1.exe` in the `SEGA/SEGA Rally` folder directly.

**Controller:** Gamepad input works in community reports ("controls well"); if the GFWL-era pad handling acts up, apply a Steam Input gamepad layout and verify mapping in the in-game settings.

**Status:** `protondb` tier estimated from community reports — runs once the DRM is dealt with, so kept at `silver` pending an on-Deck test pass. deckport links nothing.
"""
