caveats       = """
**Supply your own copy:** Requires a legitimately owned copy of Tony Hawk's Underground 2 (THUG2) — available on GOG or from original disc.

**Install:** Install THUG2 under the same Proton prefix first, then apply the THUG Pro patch. `dotnet46` via `protontricks` is mandatory.

**Launch:** Always launch via `THUGProLauncher.exe`, not the bare exe.

**Display:** Black screen on startup for ~60 seconds is normal.

**Controller:** Debug mode (`CTRL+ALT+D` in `Gamepad Binding`) prevents update-check hang on each boot."""
