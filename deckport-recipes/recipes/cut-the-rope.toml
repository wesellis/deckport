**Supply your own copy.** deckport links nothing.

**DRM:** Delisted from Steam (sales paused Feb 6 2023); single-player puzzle game with no online dependency, so it stays fully playable offline.

**Proton:** ProtonDB platinum — runs out-of-the-box on Proton/Deck.

**Controller:** No native controller support, so you must set up a Steam Input mouse layout (right trackpad/gyro = cursor, `R2` = left-click) to play comfortably on the Deck.

**Binary:** Binary name (`CutTheRope.exe`) should be confirmed against your own install."""
