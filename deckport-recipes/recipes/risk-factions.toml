notes      = """
**Game:** Stainless Games' 2011 digital take on the Risk board game (EA), delisted 2020-10-05 (Steam appid `47800`). Turn-based strategy with a tongue-in-cheek comic campaign and AI/local play.

**Proton:** DirectX 9 Steamworks title; runs under Proton — `GE-Proton` is the safe pick, `proton_experimental` also works.

**Display:** if the mouse cursor sticks in the top-left corner under fullscreen, **switch the game to WINDOWED mode** (community-confirmed fix) and Gaming Mode will still present it full-screen.

**Controller:** the built-in controller support drives menus and the campaign fine; if you prefer pointer control, add a Steam Input gamepad-with-mouse layout.

**Languages:** pass `-language -german` / `-french` / `-spanish` in launch options to switch from English.
"""

[about]
developer = "Stainless Games"
publisher = "Electronic Arts"
released  = "2011"
genre     = "Turn-based strategy"
modes     = "Single-player, local and online multiplayer"
summary   = "**Risk: Factions** is a digital adaptation of Hasbro's **Risk** board game developed by **Stainless Games** and published by **Electronic Arts**. Beyond the classic ruleset, it adds a tongue-in-cheek **'Factions' mode** with new maps, special territories, and five cartoonish armies (humans, cats, robots, zombies, and yeti) tied to a comic single-player campaign. It first launched on **Xbox Live Arcade** in 2010 and came to PC via Steam in 2011, earning generally favorable reviews. The PC version was **delisted in 2020 after EA's Hasbro license expired**."

