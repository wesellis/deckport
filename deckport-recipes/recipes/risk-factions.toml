**Supply your own copy:** delisted commercial game.

**Input:** turn-based strategy, so no twitch-input concerns.

**Known quirk:** the mouse can get stuck in the top-left corner in fullscreen — **switch the game to windowed mode** (community-reported fix), or just play with a controller, which works well.

**Controller:** built-in controller support is fine; a Steam Input gamepad-with-mouse layout covers any pointer-only screens.

**Binary:** confirmed (`Risk Factions.exe`).

**ProtonDB:** reported **Platinum** on app `47800` (small sample, ~6 reports / low confidence) — re-check on next pass. Steamworks-only DRM; no GFWL/SecuROM blockers.
