contributor   = ""
protondb_tier = "pending"
caveats       = "You must supply your own legally obtained copy; this original Virtual-On has no current digital storefront release, so there is no Steam appid or ProtonDB rating (tier left pending). This is the original 1995/1997 Cyber Troopers Virtual-On: Operation Moongate, NOT the sequel Virtual-On: Oratorio Tangram (Steam App 427680). REQUIRED: edit VON.INI [Processor] to disable ProcessorCheck/PentiumCheck/MMXCheck/IntelCheck or the game will not start; VO_SPEED fixes the slow-motion timing bug and VO_PATCH improves audio. The standard PC build is software/MMX rendered, so dgVoodoo2 is optional (mainly for the Japanese PowerVR build), not required. Twin-stick controls need a custom Steam Input or key-mapper layout: left stick movement, right stick turret, triggers for weapons. Note the original game refuses to run on 64-bit Windows, so behavior under 64-bit Proton is untested."
