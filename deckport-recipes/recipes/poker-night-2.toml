notes      = """
**Game:** Delisted Steam game (`appid 234710`), Telltale Engine. Binary is `PokerNight2.exe`.

**Proton:** ProtonDB Platinum — runs out of the box on Deck with `GE-Proton` (`proton_experimental` also works).

**DirectX:** Proton ships the DirectX 9 / MSVC 2010 libs the game needs, so no extra winetricks are usually required.

**Fix:** If it crashes right after the 'Click anywhere to continue' intro, **delete the stale save** `pnati2.save` under the prefix's `Documents/Telltale Games/Poker Night 2/` folder and relaunch.

**Install:** deckport only configures the prefix; it never bundles the game files."""

