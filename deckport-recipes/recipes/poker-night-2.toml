summary   = """
**Poker Night 2** is a 2013 poker game from **Telltale Games** and the sequel to **Poker Night at the Inventory**. The unseen player competes in **Texas hold 'em** and **Omaha hold 'em** against four crossover characters: Sam from Sam & Max, Brock Samson from The Venture Bros., Ash Williams from The Evil Dead, and Claptrap from Borderlands, with **GLaDOS** from Portal as the dealer.

The PC version drew generally favorable reviews, with critics praising the **voice acting** and the banter between the licensed personalities. It was pulled from sale in September 2018 after the **digital distribution agreement for its licensed properties expired**."""

[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "platinum"
caveats       = """
**Supply your own copy:** deckport links nothing.

**Proton:** ProtonDB Platinum (`appid 234710`, delisted). Binary is `PokerNight2.exe`.

**Fix:** Crash after the intro 'Click anywhere to continue' = **delete the old** `pnati2.save` in `Documents/Telltale Games/Poker Night 2/` inside the prefix, then relaunch.

**DLL:** If you hit a missing-DLL error (`d3dx9_41.dll` / `MSVCP100.dll`), Proton's built-in DirectX/MSVC libs normally cover it.

**Controller:** Works via native gamepad support; otherwise a `Steam Input` mouse/click layout makes this card game fully playable on Deck."""
