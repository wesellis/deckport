caveats       = """
**Supply your own copy:** Requires a legally dumped Kameo: Elements of Power Xbox 360 ISO, extracted into `assets/` with `extract-xiso`. **The recomp ships NO game assets, code, or data.**

**Version:** `v0.2.1` (June 2026) — early/active project, expect rough edges and missing features. Check GitHub Releases for newer stable/nightly builds.

**Binary:** Use the Linux build (`kameorepowered-v0.2.1-linux-x64.tar.gz`); the executable inside is `kameorepowered` — confirm the exact name after extracting.

**Native Linux:** Runs on the Steam Deck without Proton; add the extracted executable as a non-Steam game.

**Framework:** Built on the `ReXGlue SDK` Xbox 360 static recompilation toolkit (translates PowerPC code to native C++) — repo at github.com/rexglue/rexglue-sdk."""
