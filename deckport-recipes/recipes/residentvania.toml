caveats       = """
**Supply your own copy:** Free fan game (not Capcom/Konami), itch.io only — **never on Steam**, so add as a Non-Steam shortcut.

**Install:** Add via `Add a Game > Non-Steam` after extracting `Re8.zip`; force a recent Proton/`GE-Proton` in Compatibility.

**ProtonDB:** No official ProtonDB entry; tier expected gold/platinum since it's a vanilla GameMaker Windows export with no DRM.

**Binary:** Exact `.exe` name inside the zip is unconfirmed (likely `Re8.exe`).

**Controller:** Don't rely on native pad support — the itch.io page advertises an Xbox mapping but at least one user reported no controller (Xbox or PS4) registered, and the dev never confirmed it. Use a Steam Input keyboard layout (`WASD`/`Space`/`K`/`L`).

**Length:** Very short (~5-10 min)."""
