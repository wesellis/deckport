caveats       = "Not a Steam title and not run via Proton, so there is no ProtonDB rating — it's a native Linux ELF binary. Requires a Mystical Ninja Starring Goemon (USA) .z64 N64 ROM — browse to it on first launch (US ROM only; the game is not an emulator and won't accept other ROMs). Vulkan renderer runs on Steam Deck RDNA2 GPU. 60fps and 16:9 widescreen supported. Native gamepad support; gyro aiming needs Gyro Behavior set to 'As Mouse' in Steam controller settings."
