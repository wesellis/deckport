notes      = "Native Linux binary — no Proton needed. Uses the RT64 renderer with Vulkan backend, which runs well on Steam Deck's RDNA2 GPU. Grab the Goemon64Recompiled-Linux-X64 build (or the Flatpak) from the Releases page; the executable is named Goemon64Recompiled. In Desktop Mode, right-click it and 'Add to Steam', then return to Gaming Mode. On first launch, browse to your Mystical Ninja Starring Goemon (USA) .z64 N64 ROM file. Runs at 60fps with 16:9 widescreen. Native gamepad support (deadzone + gyro options); for gyro aiming set Controller Settings > Gyro Behavior to 'As Mouse'. Download from GitHub: github.com/klorfmorf/Goemon64Recomp. Built on the N64Recomp framework by Mr-Wiseguy."

