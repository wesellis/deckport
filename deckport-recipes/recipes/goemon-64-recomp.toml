summary   = "Goemon 64: Recompiled is a native PC port of Mystical Ninja Starring Goemon (N64, 1997) built using the N64Recomp framework by Mr-Wiseguy. First released in early 2025 (latest dev build v0.2.0-dev, January 2026), it delivers a native Linux binary with Vulkan rendering via RT64, 60fps gameplay, 16:9 widescreen, and full controller support. On first run the game prompts for a Mystical Ninja Starring Goemon (USA) N64 ROM file. No emulator or Proton layer is required."

