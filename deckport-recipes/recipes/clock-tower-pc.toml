[proton]
version    = "GE-Proton"
winetricks = []
notes      = "Add CT32.EXE as a non-Steam game and set Proton version to GE-Proton. CT32.EXE is the main executable of the 1997 Windows 95 port (the original shipped in Japanese only). The Windows port is Japanese-language by default — apply Silanda's improved English translation patch (romhacking.net entry 3135) to your own copy before launch. This is a mouse-driven point-and-click game: configure the Steam Deck's right trackpad as a mouse for comfortable play. The old DirectDraw fullscreen can misbehave under Wine/Proton; if fullscreen breaks, run windowed or use a wrapper like DxWnd. Note: Clock Tower: Rewind (Steam App 2794770) is the official 2024 remaster (WayForward / Limited Run / Sunsoft) with modern controls and widescreen; consider that release first if you want a Deck-optimized experience. This recipe covers the original Windows 95 PC port of the 1995 Super Famicom game."

[about]
developer = "Human Entertainment"
publisher = "Human Entertainment"
released  = "1997 (Windows 95 port; SNES original 1995)"
genre     = "Point-and-click survival horror"
modes     = "Single-player"
summary   = "Clock Tower is a point-and-click survival horror game originally developed by Human Entertainment for the Super Famicom in 1995, later ported to Windows 95 (released March 1997). Players control Jennifer Simpson, a teenage orphan stalked through a sprawling mansion by the Scissorman, a relentless killer armed with giant scissors. The game is driven entirely by mouse input, with gameplay focused on hiding, fleeing, and uncovering the mansion's dark secrets. The Windows port adds a CGI intro and revised music but is otherwise close to the original. It is the founding entry of the Clock Tower series and a landmark in the survival horror genre."

