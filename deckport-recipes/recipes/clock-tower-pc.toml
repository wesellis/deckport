caveats       = "Supply your own legally obtained copy of the game. The original 1997 Windows 95 port is not on Steam, so there is no ProtonDB rating for it — tier is unknown pending testing. The port ships in Japanese; the standard fix is Silanda's improved English translation patch (romhacking.net entry 3135), applied to your own copy. Main executable is CT32.EXE. DirectDraw fullscreen can break under Proton — run windowed or use DxWnd if needed. Clock Tower: Rewind (Steam App 2794770) is the official 2024 remaster with native widescreen and modern controller support — strongly consider that first. The game is entirely mouse-driven; use the right trackpad for mouse navigation on Deck."
