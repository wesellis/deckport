[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Delisted:** Delisted Steam game (`appid 108200`, removed Oct 3 2023 to make way for a new separate release under `appid 2477010` — the Classic Edition is no longer sold).

**Game:** Days of Wonder / Asmodee digital adaptation of the board game; the install folder (`steamapps/common/Ticket to Ride`) ships `Ticket to Ride.exe` (note the spaces in both the folder and the exe name). ProtonDB tier `gold` (strong confidence, ~40 reports) and community discussions confirm the Windows build runs on Linux/Proton with no special tricks.

**Proton:** **Runs out of the box** on `GE-Proton` (`proton_experimental` also works); no DRM/GFWL, no widescreen patch needed.

**Controller:** This is a point-and-click board game with **no native gamepad support** — drive it with the Deck's touchscreen, or apply a Steam Input layout that maps the right trackpad to the mouse and a button to left-click (the `Mouse Only` / desktop-style community template works well)."""

[about]
developer = "Days of Wonder"
publisher = "Days of Wonder / Asmodee Digital"
released  = "2012"
genre     = "Digital board game, Strategy"
modes     = "Single-player, local pass-and-play, online multiplayer"
summary   = "**Ticket to Ride** is the official digital adaptation of **Alan R. Moon's** award-winning **railway-themed board game**, in which players collect train-car cards to claim railway routes across a map and complete secret **destination tickets**. This was the long-running Days of Wonder / Asmodee Digital version sold on Steam, supporting single-player matches against AI, local pass-and-play, and **online multiplayer** with cross-play to mobile editions. It was **delisted on October 3, 2023**, when publisher Asmodee replaced it with a separately-sold, rebuilt edition (a different Steam product), leaving the original Classic Edition no longer available for purchase. The original release remains a faithful, well-regarded conversion of one of the best-selling modern board games."

