caveats       = """
**No ProtonDB page:** The original 2001/2002 PC release was a retail disc product and was **never sold on Steam**, so there is no Steam AppID or ProtonDB rating for it (the Steam AppID 2124490 is the unrelated **2024 remake**). Community reports for the Enhanced Edition on Deck are positive — it runs well under `Proton 7.0-4` — but tier is left **unrated** rather than claiming a Gold/Platinum it can't be measured at.

**Supply your own copy:** Needs the base Silent Hill 2 (2001) PC game — North American "Restless Dreams" or European "Director's Cut" both work — bring your own copy; the Enhanced Edition is a free community package layered on top, and this targets the original PC release, **not the 2024 remake**.

**Setup:** Configure with `SH2EEconfig.exe`, launch the Enhanced `sh2pc.exe` under `Proton 7.0-4`.

**Controller:** Enhanced Edition adds improved controller support (works on Deck's built-in controls; a Steam Input gamepad/keyboard layout covers any gaps).

**Performance:** Watch for occasional stutter/frame drops — mitigate with the Direct3D 11 renderer (in `SH2EEconfig.exe`), window mode, and FSR/lossless scaling.

**Note:** deckport links nothing.
"""
