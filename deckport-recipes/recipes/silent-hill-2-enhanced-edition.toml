[proton]
version    = "Proton 7.0-4"
winetricks = []
notes      = """
**Overview:** The community Enhanced Edition for the PC version of Silent Hill 2: Director's Cut — a full audio/visual overhaul: HD resolutions, widescreen fixes, 60 FPS, restored fog/shadows/post-processing and better controller support, on top of the original 2001 PC release (**NOT the 2024 remake**).

**Install:** Install the original unmodified SH2 PC game first, then run the Enhanced Edition Setup Tool (`SH2EEsetup.exe`).

**DRM:** The original 2001/2002 PC release ships with SecuROM disc-check DRM and the stock `sh2pc.exe` should not be launched directly on modern systems. Installing the Enhanced Edition replaces it with the project's Enhanced Executable (`sh2pc.exe`), which is the version you add to Steam — so the SecuROM disc check is no longer the launch path.

**Proton:** Add the Enhanced `sh2pc.exe` to Steam as a non-Steam game and **force `Proton 7.0-4`** (community-confirmed known-good; newer Proton/Experimental has also worked, but `7.0-4` is the safe default).

**Config:** Run `SH2EEconfig.exe` to set resolution/options. Community reports it runs brilliantly on Deck.

**Display:** In `SH2EEconfig.exe` the renderer can be set to Direct3D 11 or Direct3D 12 — DX11 is the safer default under Proton, DX12 also works for some; some users pair window mode + FSR/lossless scaling to smooth occasional stutter. (These are config options, not Steam launch flags — leave `launch_options` empty.)
"""

[about]
developer = "Team Silent / Creature Labs (PC port); Enhanced Edition by the SH2 Enhanced Edition community team"
publisher = "Konami"
released  = "2002 (PC); Enhanced Edition community mod, ongoing releases (1.0 in 2021)"
genre     = "Survival horror"
modes     = "Single-player"
summary   = "**Silent Hill 2** is a **survival horror** game originally developed by **Team Silent** and published by Konami, with the PC version (a port of the **Director's Cut / Restless Dreams** content) handled by Creature Labs. The **Enhanced Edition** is a free fan-made compilation of mods that overhauls the dated PC release, restoring the original PlayStation 2 **fog**, audio quality and post-processing while adding **widescreen** and HD resolution support, 60 FPS, upscaled FMVs, improved controller support and a large number of bug fixes. It is notable as the definitive way to experience the 2001 classic on modern hardware, and is layered on top of an unmodified copy of the original PC game rather than the **2024 remake**."

