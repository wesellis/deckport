summary   = "**X-Men Origins: Wolverine** is a 2009 third-person action game by Raven Software, released as a tie-in to the film of the same name and built on **Unreal Engine 3**. The PC, Xbox 360 and PlayStation 3 versions shipped as the **'Uncaged Edition'**, featuring heightened violence and gore that drew comparisons to God of War, and the game was generally well received as one of the better movie tie-ins of its era. It is no longer sold because the **licensed movie-tie-in rights expired**."

