[proton]
version    = "GE-Proton"
winetricks = ["xna40", "dotnet40", "dotnet35"]
notes      = """
**Game:** Delisted turret-defense game by Cadenza Interactive (Steam appid `45000`; removed from sale 2024-12-31, existing owners keep access).

**Fix:** This is an **XNA Game Studio (XNA 4.0)** title built on the .NET runtime. The key step is installing the **XNA 4.0 redistributable into the prefix** — `xna40` (pull `dotnet40` first if winetricks asks, and `dotnet35` if an older-runtime prompt blocks the install). Without the XNA redist the game throws a missing-framework error on launch.

**Proton:** `GE-Proton` handles the XNA/.NET stack more reliably than stock `proton_experimental`; **if you hit a black screen on launch, fall back to a `7.0-x` Proton.**

**Controller:** Game has Partial Controller Support natively, so the gamepad works for core play; map any keyboard-only menu actions with a Steam Input layout.

**Multiplayer:** Multiplayer/Wars modes relied on the developer's now-defunct servers — **treat this as a single-player/Survival recipe.**

**Install:** deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "Cadenza Interactive"
publisher = "Cadenza Interactive"
released  = "2010"
genre     = "Tower defense / strategy"
modes     = "Single-player, online co-op and competitive multiplayer (up to 8 players)"
summary   = "**Sol Survivor** is an indie **tower-defense** game from American studio **Cadenza Interactive**, released on Xbox 360 (Xbox Live Indie Games) in 2009 and on Windows via Steam in March 2010. It sets itself apart from typical tower defense with an interactive **orbital 'support' mechanic**, letting players rain down lasers, missiles, EMPs or nukes to back up their stationary turrets against waves of alien creeps. It was well received for its loadout customization, free-form turret placement, and **co-op campaign and survival modes** where one player builds while another handles support. It is notable today as a **delisted** title: Cadenza Interactive wound down and the game was removed from sale, so it survives mainly with players who bought it before delisting."

