[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "platinum"
caveats       = """
**Supply your own copy.** deckport links nothing.

**DRM:** **Denuvo** anti-tamper, plus delisted (**HITMAN 1 & 2** merged into **HITMAN: World of Assassination**) — not for sale new. Denuvo does not stop Proton; the offline single-player campaign runs fine.

**Status:** ProtonDB **platinum** (best reported; recent reports trend gold) and Deck users report it running well, but this exact recipe is **not yet hands-on verified**.

**Controller:** Works once a Windows Proton version is forced (the native Linux input path can leave the gamepad option greyed out, so forcing Proton pulls the Windows build that reads the Deck pad correctly).

**Launcher:** If the launcher hangs, the `-skip_launcher` launch option boots the game directly.

**Online:** Online co-op/Ghost Mode servers may be retired; the **single-player campaign** is the target."""
