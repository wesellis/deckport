[game]
title       = "HITMAN 2"
slug        = "hitman-2"
aliases     = []
type        = "proton"
engine      = "other"
steam_appid = "863550"
sgdb_id     = ""

[launch]
binary         = "Retail/HITMAN2.exe"   # DX11 build; DX12 build is dx12Retail/HITMAN2.exe (launcher is Launcher.exe at the install root)
launch_options = "-skip_launcher"
requires_files = []

[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**DRM:** **Denuvo** anti-tamper. Also a delisted Steam game (appid `863550`) — **HITMAN 1 & 2** were folded into **HITMAN: World of Assassination** and pulled from sale, so it is not purchasable new. Denuvo does not block Proton: the single-player campaign runs offline; the known limitation is reaching the IOI online servers. ProtonDB rates it **platinum** overall (best reported), though recent reports trend **gold**, and Deck users confirm it plays well.

**Proton:** **Force a Windows Proton version** (`GE-Proton`, or `Proton 7.0-x` — community reports `7.0-1` specifically) under `Properties > Compatibility`; this also makes Steam pull the Windows build whose input layer sees the Deck gamepad.

**Launcher:** Use the `-skip_launcher` launch option to bypass the IOI launcher and boot straight into the game.

**Binary:** `Retail/HITMAN2.exe` (DX11); `dx12Retail/HITMAN2.exe` is the DX12 build (**DX11 is the more reliable default** under Proton).

**Install:** deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "IO Interactive"
publisher = "Warner Bros. Interactive Entertainment"
released  = "2018"
genre     = "Stealth"
modes     = "Single-player, online co-op (Sniper Assassin) and competitive Ghost Mode"
summary   = "**HITMAN 2** is a 2018 stealth game by IO Interactive, the seventh entry in the long-running **Hitman series** and the second chapter of the **World of Assassination** trilogy. Built on the studio's **Glacier engine**, it sends Agent 47 through large, intricately simulated **sandbox levels** where players improvise creative assassinations using disguises, the environment, and emergent AI. It was praised for its level design and replayability. The standalone release was later **delisted** and folded into **HITMAN: World of Assassination**, so it is no longer sold as a separate product."

