[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "silver"
caveats       = """
**Supply your own copy:** deckport links nothing.

**DRM:** Delisted from Steam on 2 Oct 2024 (succeeded by Monopoly 2024) — no longer for sale.

**Uplay:** Ubisoft Connect (Uplay) dependency is the main hurdle — you **must install Ubisoft Connect into the Proton prefix** and let it link the digital license on first launch, otherwise the game will not start.

**Proton:** Community reports confirm it runs on Linux/Proton (ProtonDB silver); `proton_experimental` or `GE-Proton` recommended, with esync/fsync disabled if it hangs.

**Multiplayer:** Online multiplayer was flaky even at launch and may be dead — local/AI play is the safe path.

**Controller:** Natively supported (console-style pad UI).
"""
