[game]
title       = "Monopoly Plus"
slug        = "monopoly-plus"
aliases     = []
type        = "proton"
engine      = "other"
steam_appid = "562810"
sgdb_id     = ""

[launch]
binary         = "Monopoly.exe"   # Ubisoft Connect title; exe lives under the game install dir
launch_options = "PROTON_NO_ESYNC=1 PROTON_NO_FSYNC=1 %command%"
requires_files = []

[proton]
version    = "proton_experimental"
winetricks = []
notes      = """
**DRM:** Delisted Steam game (appid `562810`) — removed from sale 2 Oct 2024 after Monopoly (2024) shipped, so it is no longer purchasable through Steam.

**Uplay:** This is a Ubisoft Connect (Uplay) title, so the Steam Proton prefix **must also have Ubisoft Connect installed**: launching from Steam pushes the digital license to your linked Ubisoft account on first run, then Ubisoft Connect starts the game.

**Proton:** Use `proton_experimental` (or `GE-Proton`); experimental tends to handle the Ubisoft Connect handshake best on SteamOS.

**Fix:** If the game hangs at launch, the esync/fsync-off launch options above (`PROTON_NO_ESYNC=1 PROTON_NO_FSYNC=1 %command%`) usually clear it.

**Controller:** Works out of the box — the game ships a console-style gamepad UI, no Steam Input keyboard layout needed.

**Install:** deckport only configures the prefix; it never bundles or links the game files.
"""

[about]
developer = "Asobo Studio"
publisher = "Ubisoft"
released  = "2014"
genre     = "Board game / Strategy"
modes     = "Single-player (vs AI), local multiplayer, online multiplayer (up to 6 players)"
summary   = "**Monopoly Plus** is a digital adaptation of Hasbro's classic Monopoly board game, developed by Asobo Studio and published by Ubisoft. It features a 3D animated **'Living Board'** where the city comes to life as players buy property and build, supporting up to six players via AI, local, and online play. A successor to **Monopoly Streets**, it was **delisted** from Steam and other PC storefronts in early October 2024 following the release of the newer **Monopoly (2024)**, and is no longer purchasable."

