caveats       = """
**Supply your own copy:** Delisted from Steam on Oct 6 2022 (no longer for sale); deckport links nothing.

**Proton:** ProtonDB Gold (best-reported Platinum, trending Gold) with community reports of local/offline play running flawlessly under Proton, so it should be smooth on the Deck.

**Controller:** Native controller game on Windows. Usually works under Proton, but a few reports note the gamepad not registering — if so, force Steam Input on with a Gamepad layout.

**Online:** The Amazon GameSparks backend shut down Nov 30 2022, so **stock online matchmaking is gone and auto region-select fails** — offline / local multiplayer works fine, and Liquid Bit's `beta` branch (Dec 13 2022) is the path to custom online + spectator.

**Verify:** Binary expected as `Killer Queen Black.exe` (Unity product name / install-folder convention); not yet independently confirmed against the install. Still needs a hands-on Deck verification pass.
"""
