summary   = "**The Punisher** is a 2005 **third-person shooter** based on the Marvel Comics antihero, developed by **Volition** and published by **THQ** for Windows, PlayStation 2 and Xbox. Players control Frank Castle through linear combat missions, using a system of human shields, quick kills and signature **interrogation 'hot spots'** where enemies are coerced through death threats and torture. It is remembered for its extreme, over-the-top violence (which forced an edited black-and-white censor filter on the most graphic executions) and its faithful, ruthless portrayal of the character. The PC version was **never released on Steam** and is no longer commercially available."

[meta]
