caveats       = """
**Paid game:** on Steam (AppID 211740) and ~$7 on GOG.

**ProtonDB:** Gold trending (Platinum best-reported, ~53 reports) — runs well with GE-Proton once patched.

**Patch required:** Install T2Fix (Xanfre, ~v1.27d on ModDB / GitHub). It bundles NewDark + the official 1.19 patch, adding widescreen, bug fixes and quality-of-life improvements. If the installer EXE misbehaves under Proton, extract its files manually instead.

**Overlay:** Disable the Steam overlay — causes flickering on DarkEngine games.

**Controller:** No native gamepad support. Apply a community Steam Input layout for keyboard/mouse emulation.

**Install location:** Install outside Program Files to avoid permission issues."""
