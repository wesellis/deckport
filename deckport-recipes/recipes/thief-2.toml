version    = "GE-Proton"
winetricks = []
notes      = """
**Game:** Thief II: The Metal Age (2000, Looking Glass Studios / Eidos) — stealth masterpiece. Sold on **Steam** (AppID 211740) and on **GOG** (~$7 on sale).

**Install:** The simplest route on Deck is the **Steam** version run through **GE-Proton**. The GOG copy works too via **Heroic Launcher** with **GE-Proton**.

**Patch:** Install **T2Fix** (the community comprehensive patch by **Xanfre**, current ~v1.27d on ModDB / GitHub). It bundles **NewDark** plus the official 1.19 patch, adding bug fixes and widescreen/high-res support. If the Inno-Setup installer EXE misbehaves under Proton, extract its files manually instead. Do **not** install Thief 2 inside a protected folder (Program Files) and do not set any Windows compatibility modes on the executable.

**Overlay:** **Disable the Steam overlay** for Thief II — the DarkEngine renderer causes flickering with the overlay enabled. Right-click the game in Steam → Properties → uncheck "Enable the Steam Overlay while in-game."

**Controller:** No native gamepad support — use a Steam Input keyboard/mouse mapping layout. Community profiles exist for the Deck."""

