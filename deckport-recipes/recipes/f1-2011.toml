**Supply your own copy:** deckport links nothing.

**Key fix:** **Games for Windows Live** must be installed (run `gfwlivesetup.exe` from the `GFWL` subfolder in Win7 compat mode) or stubbed (`xlive.dll` + `xlive.ini` bypass) or **the game won't start**.

**Proton:** ProtonDB silver — community reports it running under Proton once GFWL is dealt with. Use `GE-Proton` for the best GFWL behavior; run `xact` if audio is missing. Binary is `F1_2011.exe`.

**Online:** Online/Live features and leaderboards are dead (GFWL servers shut down) — single-player and local play only.

**Controller:** Works natively.

**Status:** Needs a hands-on Deck confirmation.
"""
