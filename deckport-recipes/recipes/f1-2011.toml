developer = "Codemasters Birmingham"
publisher = "Codemasters"
released  = "2011"
genre     = "Racing simulation"
modes     = "Single-player, online and split-screen multiplayer, co-op championship"
summary   = "**F1 2011** is the official racing simulation of the 2011 **Formula One** season, built on Codemasters' **EGO 2.0** engine as the sequel to **F1 2010**. It features a five-season **career mode** along with time trial, split-screen, and an online co-operative championship for up to sixteen players. The game was well received by critics for its handling and presentation. It was **delisted** from digital storefronts in 2021, likely due to **expired Formula One licensing**."

[proton]
version    = "GE-Proton"
winetricks = ["xact"]
notes      = """
**Game:** Delisted Steam game (`appid 44360`), a Codemasters racing title. ProtonDB tier: silver.

**GFWL:** The main blocker is **Games for Windows Live** (GFWL): **the game won't launch until GFWL is handled.** Install the bundled GFWL client by running `gfwlivesetup.exe` from the game's `GFWL` subfolder (set it to Windows 7 compatibility), or use the `xlive.dll` + `xlive.ini` stub bypass dropped into the `F1_2011.exe` directory.

**Proton:** Best path on Deck is `GE-Proton`, which has the best GFWL handling.

**Audio:** Run `xact` via `winetricks` if audio is missing.

**Controller:** Works natively — F1 2011 has built-in gamepad support, so the Deck controls work without a Steam Input hack. You do have to enable it in-game (My F1 → Driving Control → set the control profile to gamepad/controller); a gamepad Steam Input template still works as a fallback.

**Install:** deckport only configures the prefix; it never bundles or links the game files.
"""

