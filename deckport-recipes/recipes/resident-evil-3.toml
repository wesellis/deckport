icon  = "auto"

[about]
developer = "Capcom"
publisher = "Capcom"
released  = "1999"
genre     = "Survival horror"
modes     = "Single-player"
summary   = "**Resident Evil 3: Nemesis** is the third main installment in Capcom's **survival horror** series, following Jill Valentine's escape from a zombie-overrun Raccoon City as she is relentlessly hunted by the bio-weapon **Nemesis**. Built on the same engine as its predecessors, it uses 3D character models over **pre-rendered backgrounds** with fixed camera angles. Originally a PlayStation hit in 1999, it was later ported to Windows and received critical acclaim. This recipe targets the classic 1999 PC release enhanced by the community **Seamless HD Project** mod, built on Gemini's Classic REbirth."

