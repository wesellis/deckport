[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "platinum"
caveats       = """
**Supply your own copy:** Delisted (removed from Steam 2023-02-08), so **only owners with a prior purchase / grey-market key can run it**. deckport links nothing.

**Proton:** ProtonDB tier is platinum but on a low report count, and Valve rates it Steam Deck **Playable** (not Verified) — encouraging, but not heavily confirmed, so this recipe still needs a hands-on Deck pass.

**Controller:** native gamepad support is limited; it's a menu-and-orders strategy game with a planning phase rather than real-time flight, so a Steam Input mouse/keyboard layout (trackpad as mouse) plays it comfortably — set that as the controller layout.

**Servers:** Single-player / hot-seat focused; no live servers to worry about.

**Binary:** Binary name (`FlightCommand.exe`) is a best-guess — **verify against your install root**."""
