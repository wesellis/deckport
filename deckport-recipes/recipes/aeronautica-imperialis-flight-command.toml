[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Game:** Delisted Steam game (appid `610160`), removed from sale 2023-02-08 by Binary Planets. Unity title, simultaneous turn-based tactical air combat (Warhammer 40k).

**Proton:** ProtonDB lists **platinum**, but on a *low* report count, so treat it as "should run well" rather than a heavily-confirmed result. No DRM, GFWL, or winetricks reported as needed. `GE-Proton` or `proton_experimental` are both reasonable — pick one and let it build the prefix.

**DRM:** No DirectX/SecuROM hacks required.

**Install:** deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "Binary Planets"
publisher = "Green Man Gaming Publishing"
released  = "2020"
genre     = "Turn-based tactics"
modes     = "Single-player"
summary   = "**Aeronautica Imperialis: Flight Command** is a turn-based tactical air-combat game set in the **Warhammer 40,000** universe, adapting Games Workshop's Aeronautica Imperialis tabletop wargame. Both sides issue orders simultaneously under a **WEGO system**, then watch small squadron engagements of roughly three to eight aircraft play out, with movement handled via a drag-and-drop interface. It offers standalone scenarios plus the **Rynn's World Air Superiority** campaign, in which players level up Imperial Navy pilots across randomly generated missions. Critical reception was mixed, with reviewers recommending it mainly to dedicated Warhammer 40,000 fans."

