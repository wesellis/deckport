[proton]
version    = ""
winetricks = []
notes      = """
**Platform:** **Native Linux** — no Proton needed.

**Install:** The official recommended install on Steam Deck is the Flatpak (`org.kartkrew.RingRacers`) available on Flathub and installable via Discover in Desktop Mode. After install, **add it as a non-Steam game** in Gaming Mode.

**Controller:** Full controller/gamepad support is built in.

**Addons:** Addon files (custom tracks, characters) live at `~/.var/app/org.kartkrew.RingRacers/.ringracers/addons/` — enable hidden files in Dolphin to access.

**DRM:** No owned data files required.
"""

[about]
developer = "Kart Krew Dev"
publisher = "Kart Krew Dev (free fan project)"
released  = "2024 (launched at v2.0 on Apr 24, 2024; v2.1 added Linux/Flatpak Apr 26, 2024; latest v2.4 Nov 2025)"
genre     = "Kart racing, fan game"
modes     = "Single-player, Online multiplayer"
summary   = """
**Dr. Robotnik's Ring Racers** is a free, fan-made **kart racing** game and spiritual successor to **SRB2Kart**, developed by Kart Krew Dev on the same modified **Doom Legacy engine** that powers Sonic Robo Blast 2. The game launched at **v2.0** on April 24, 2024 (there was no v1.0 release) to widespread enthusiasm, featuring a massive roster of Sonic-franchise characters, a deep progression system, and 200+ circuits.

**Linux support** via a native Flatpak arrived shortly after launch in **v2.1** (April 26, 2024), making it a first-class citizen on Steam Deck. The game has since been updated through v2.4 (November 2025). Online multiplayer is fully supported with a built-in server browser, and an active modding scene continues to add new content.
"""

