[proton]
version    = "GE-Proton"
winetricks = []
notes      = "Use GE-Proton for best compatibility. The Steam 2011 release runs well as-is, but in the in-game launcher you must switch the controller input from Keyboard to Gamepad or your controller will be ignored. For widescreen (16:9) and a smoother frame rate, run the SADX Mod Installer (SA Mod Manager / X-Hax sadx-mod-loader); it downgrades the 2011 build to the moddable 2004 version and the loader/manager needs the .NET runtime and VC++ 2022 (x86), which winetricks can supply. Vanilla runs at 4:3 and can dip from 60 to 40 FPS on the 2014 build."

[about]
developer = "Sonic Team"
publisher = "Sega"
released  = "2003"
genre     = "Platformer / Action-Adventure"
modes     = "Single-player"
summary   = "Sonic Adventure DX: Director's Cut is the PC port of the 1998 Dreamcast platformer, following Sonic and five other characters across a large open-ish hub world. Players explore Station Square and beyond while defeating Dr. Eggman's schemes. The 2011 release is sold on Steam (app 71250). The community SADX Mod Installer adds widescreen and frame-rate fixes for a smoother modern experience."

