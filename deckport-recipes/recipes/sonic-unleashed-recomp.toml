caveats       = """
**Supply your own copy:** The recomp is the engine only — it requires you to provide your own legally-owned Sonic Unleashed (Xbox 360) game files plus DLC, supplied during its first-run setup.

**Proton:** Use the native Linux build / Flatpak for the Deck (type `native`, no Proton); a Windows build also exists if you'd rather use Proton.

**Install:** Run the installer in **Desktop Mode** — the file picker can be missing in Game Mode. Binary is `UnleashedRecomp`; add it as a non-Steam game.

**Controller:** Works natively (Steam Input detects the pad type); if you play docked with an external controller the first-run file picker can be awkward with Steam Input disabled.

**Display:** For best framerate, pin the GPU clock to max in the performance menu.

**Storage:** `~6 GiB` without DLC, `~10 GiB` with.
"""
