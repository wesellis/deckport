[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Delisted:** Delisted Steam game (appid `47870`, removed 2020-10-05 alongside the Remastered).

**Launch:** Main exe is `NFS11.exe` — **point the launcher at it, not `Launcher.exe`**, to skip the EA/Origin shell.

**Proton:** Stock Steam Proton versions often refuse to launch it on Deck — **install `GE-Proton` via ProtonUp-Qt and select it per-game** (`GE-Proton 9-25` confirmed working by the community); `proton_experimental` may also work after a Steam Deck update.

**DRM:** Uses Solidshield activation DRM plus Origin/EA online activation (not GFWL, not SecuROM). The Steam build wraps this in Steam DRM; expect a one-time online activation on first launch.

**Display:** Runs ~60 fps on Deck; **capping the refresh to 50 Hz** smooths the occasional dip.

**Install:** deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "Criterion Games"
publisher = "Electronic Arts"
released  = "2010"
genre     = "Arcade racing"
modes     = "Single-player, online multiplayer"
summary   = "**Need for Speed: Hot Pursuit** is a 2010 **arcade racing** game developed by **Criterion Games**, the **Burnout** studio, and published by Electronic Arts. It reboots the classic Hot Pursuit formula with high-speed cop-versus-racer chases through the open roads of fictional Seacrest County, using takedowns, spike strips and roadblocks. The game introduced **Autolog**, an early social system that tracked friends' times and recommended challenges. Critically acclaimed at launch, it was delisted from Steam on 2020-10-05 when the **Hot Pursuit Remastered** version released."

