verified_on   = ""
contributor   = ""
protondb_tier = "gold"
caveats       = """
**Supply your own copy.** deckport links nothing.

**Status:** Community reports the delisted 2003 NovaLogic game running on Linux/Proton at gold; this specific recipe still needs a Deck confirmation.

**Don't confuse:** Not the 2024 free-to-play Delta Force (`appid 2507950`, `ACE` anti-cheat) — that's a different game and still for sale.

**Multiplayer:** NovaWorld multiplayer servers are dead, so this is effectively single-player/campaign only.

**Controller:** No native controller support — bind a Steam Input keyboard/mouse layout (community DFBHD Deck layouts exist) to play with the gamepad.

**Display:** Engine is 4:3 native — apply a widescreen/FOV wrapper byte-edit for proper 16:10 output.

**DirectPlay:** On Windows this game needs Legacy DirectPlay; under Proton wine provides that, so no extra step."""
