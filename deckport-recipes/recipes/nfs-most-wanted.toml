[about]
developer = "EA Black Box"
publisher = "Electronic Arts"
released  = "2005"
genre     = "Racing"
modes     = "Single-player, multiplayer"
summary   = """
**Need for Speed: Most Wanted (2005)** is an open-world arcade racer set in the fictional city of Rockport, developed by **EA Black Box**. It blends the **Underground** series' street racing and car customization with a **Blacklist** career mode in which the player works up a roster of 15 rival drivers, and it reintroduced high-stakes **police pursuits** to the series.

Widely regarded as a high point of the franchise, it was a major critical and commercial success, selling over 18 million copies. The 2005 original was **never sold on Steam** and is no longer offered for new digital purchase, so it remains a fan-favorite that players run from their own copies."""

[launch]
binary         = "speed.exe"
launch_options = ""
requires_files = []

[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Game:** 2005 EA Black Box racer (the original Most Wanted; delisted — **bring your own copy**). Note the Steam appid `1262560` is the unrelated **2012 Criterion reboot**, so this recipe carries no appid.

**Disc check:** The retail release uses **SafeDisc** copy protection, whose disc check no longer functions on modern Windows (and therefore under Proton). Apply EA's **official v1.3 patch** and run the resulting patched `speed.exe`; that is the standard legitimate fix for an owned copy.

**Install:** Add `speed.exe` as a non-Steam game and force `GE-Proton` (`Proton Experimental` also reported working).

**Mod loader / controller:** ThirteenAG's Widescreen Fix loads through a proxy `dinput8.dll` placed next to `speed.exe`. Tell Proton to load it by setting the launch option `WINEDLLOVERRIDES="dinput8=n,b" %command%` (native, then builtin); otherwise the fix — and its improved **XInput** gamepad support — will not load.

**Binary choice:** `speed.exe` is the main launcher; the v1.3 patch updates it in place.

**Community fixes:** ThirteenAG's Widescreen Fix (adds XInput gamepad support, FOV/HUD fixes), NFSMW Unlimiter, Extra Options, HD Reflections, Zolika's Limit Adjuster.

Reported to run about as well as on Windows once set up."""

