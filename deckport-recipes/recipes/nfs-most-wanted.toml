contributor   = ""
protondb_tier = "silver"
caveats       = """
**No official ProtonDB rating:** The 2005 original was never on Steam, so there is no ProtonDB entry for it (appid `1262560` rates the unrelated 2012 reboot). Community reports say it runs well, but it needs manual setup, so this is tracked as Silver rather than borrowing the reboot's tier.

**Supply your own copy:** The 2005 original (not the 2012 Criterion reboot); never sold on Steam, so no appid. Configuration only, no links.

**DRM:** Retail copies use SafeDisc, whose disc check fails on modern systems. The official v1.3 patch's executable is the standard fix for an owned copy.

**Controller:** Vanilla DirectInput pad detection is unreliable; the recommended path is the ThirteenAG Widescreen Fix's XInput gamepad support plus a Steam Input layout. Enable Gamepad in the in-game Controller settings as well.

**Display:** If the window drops to windowed mode on focus loss, re-set the resolution in `Options` to restore fullscreen.

**Cosmetic:** ThirteenAG Widescreen Fix is recommended for the Deck's 16:10 output; Unlimiter + Limit Adjuster fix vanilla framerate/physics quirks."""
