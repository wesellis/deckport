[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Delisted:** Delisted Steam game (`appid 853140`), removed Jan 2022 when the Warhammer license expired; Membraine Studios has since ceased operations.

**Engine:** Unity engine (PlayMaker state machine).

**Proton:** ProtonDB gold — community reports it running cleanly on Linux/Proton, so it plays on the Deck. Use `GE-Proton` (or `proton_experimental`); **no DRM/GFWL workarounds needed**.

**Controller:** It is a 3D turn-based strategy game, so input is mouse-driven — bind a Steam Input mouse/trackpad-and-keyboard layout on the Deck (right trackpad as mouse, `A` = left click). **No native gamepad scheme.**

**Install:** deckport only configures the prefix; it never bundles or links the game files.
"""

[about]
developer = "Membraine Studios"
publisher = "Membraine Studios"
released  = "2018"
genre     = "3D turn-based strategy"
modes     = "Single-player"
summary   = "**Adeptus Titanicus: Dominus** is a **3D turn-based strategy** game adapting Games Workshop's classic **Titan Legions / Adeptus Titanicus** tabletop wargame, in which players command **god-machine Titans** in the **Warhammer 40,000** universe. It was developed and published by **Membraine Studios**, a small Australian indie team, launching into Steam Early Access in 2018. The game was delisted from Steam in January 2022 after the studio's **Warhammer license expired**, and was pulled from GOG in March 2022 when Membraine Studios ceased operations, leaving it unavailable for sale on any storefront."

