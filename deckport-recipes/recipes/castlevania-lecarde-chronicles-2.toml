verified_on   = ""
contributor   = ""
protondb_tier = ""
caveats       = """
**Free fan game:** Not affiliated with **Konami**; never sold on Steam, so no Steam appid. Download the official `Game.Binary.zip` for free from the developer's GitHub releases (`katriellucas/lecarde-2`).

**Two builds:** The download contains two exes — the normal-mode `Lecarde Chronicles 2.exe` and a **Ring of Fury** harder-mode build whose name ends in `c`. Point the launch at the normal-mode exe unless you want Ring of Fury.

**Proton:** Clickteam Fusion 2.5 build — runs through Proton on Deck with no special fixes; use `GE-Proton` or `proton_experimental`.

**Controller:** Native support (DS4 D-pad, fully remappable), so **no Steam Input layout needed**.

**ProtonDB:** No ProtonDB entry exists (it's a Non-Steam title), so the tier is left blank; runnability is inferred from the Clickteam Fusion 2.5 / Proton track record rather than a verified per-title report. deckport links nothing."""
