[proton]
version    = "GE-Proton"
winetricks = []
notes      = "The original 1999 Nocturne was never re-released digitally (the Steam title app 1374860 is an unrelated modern game), so install your own copy and add Nocturne.exe as a non-Steam game, set to GE-Proton. The game's old DirectDraw/Direct3D renderer needs a wrapper to launch and to reach Deck-friendly resolutions: use dgVoodoo 2, most easily via the community 'Nocturne Windows 10 Fix' (https://github.com/silentgameplays/Nocturne-Fix-Windows-10), which drops preconfigured dgVoodoo files into the game folder and raises the internal resolution (note: ThirteenAG's WidescreenFixesPack does NOT cover Nocturne). Retail discs used SafeDisc copy protection (SECDRV.SYS), which neither modern Windows nor Wine load — apply the community no-disc/launch patch so the exe starts. The game is keyboard+mouse only, so configure a Steam Input gamepad layout or use the right trackpad for mouse-style aiming."

[about]
developer = "Terminal Reality"
publisher = "Gathering of Developers"
released  = "1999"
genre     = "Survival horror / action-adventure"
modes     = "Single-player"
summary   = "Nocturne is a third-person survival horror game developed by Terminal Reality and published by Gathering of Developers in 1999. Players control a government agent known as The Stranger, battling werewolves, vampires, and other supernatural creatures across four episodes set in the 1930s. The game features a cinematic fixed-camera perspective and a dark, pulpy horror atmosphere. It is a cult classic of the late-1990s PC horror genre."

