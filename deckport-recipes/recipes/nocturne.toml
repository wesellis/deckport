caveats       = "Supply your own legally obtained copy; the original 1999 game has no digital re-release and therefore no ProtonDB rating. Retail discs use SafeDisc (SECDRV.SYS) DRM that modern Windows and Wine refuse to load, so a community no-disc/launch patch is needed for the exe to start. The old DirectDraw/Direct3D renderer needs dgVoodoo 2 (most easily via the community Nocturne Windows 10 Fix) to launch reliably and to reach Deck-friendly resolutions — ThirteenAG's WidescreenFixesPack does NOT support this game. Keyboard+mouse only: configure a Steam Input gamepad layout or use the right trackpad and on-screen keyboard."
