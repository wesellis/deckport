requires_files = ["Super Smash Bros. Melee GameCube disc image — v1.02, NTSC-U (DOL-GALE-0-02) or NTSC-J (DOL-GALJ-0-02); the 20XX Hack Pack also works. PAL is incompatible (desyncs)."]

