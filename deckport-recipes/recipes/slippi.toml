summary   = "**Slippi** is a fork of the **Dolphin** GameCube emulator that adds **rollback netcode** to **Super Smash Bros. Melee**, enabling online play against players worldwide. It is the dominant platform for competitive and casual Melee online play. A native Linux `AppImage` is available from `slippi.gg`. The Competitive Smash Decker tool (`github.com/the-outcaster/competitive-smash-decker`) automates the full Steam Deck setup including Slippi installation, controller configuration, and Melee ISO verification. An official Deck guide is available at theoutcastersnotebook.com. Requires a Melee v1.02 ISO (NTSC-U or NTSC-J)."

