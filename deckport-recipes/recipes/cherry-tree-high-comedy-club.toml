[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "platinum"
caveats       = """
**Supply your own copy.** Not yet hands-on verified on a Deck. **deckport** links nothing.

**Delisted:** Nyu Media closed; removed from sale July 2022 — passes the not-for-sale rule.

**DRM:** Singleplayer visual novel, no DRM, no servers — should just work under Proton.

**Install:** Confirm the real `.exe` from your install (RPG Maker XP default = `Game.exe`).

**Controller:** Steam lists only Partial Controller Support, but it is a click-through VN, so apply a Steam Input keyboard/mouse layout (D-pad + A/B mapped to mouse + Enter) for full Deck playability.

**Display:** No true widescreen — the fixed-resolution window pillar/letterboxes on the Deck (cosmetic).
"""
