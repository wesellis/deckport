contributor   = ""
protondb_tier = ""
caveats       = """
**Supply your own copy:** Never on Steam (retail-only 2003 title); film/Atari license expired; configuration only, no links.

**No ProtonDB rating:** Not a Steam title, so `protondb_tier` is left empty; run as a non-Steam shortcut under `GE-Proton` or via Lutris/Wine.

**Patch + widescreen fix:** Install an official patch (`1.52` latest, or `1.2`) and pick the matching ThirteenAG Widescreen Fix build.

**DRM:** Retail disc uses **SafeDisc**; its driver isn't loaded under Proton/Wine, so the disc check is usually a non-issue with your own disc image.

**Controller:** A gamepad active alongside the Widescreen Fix can cause screen distortion — use a `Steam Input` keyboard/mouse layout instead.

**Launch:** Via `MatrixOptions.exe`."""
