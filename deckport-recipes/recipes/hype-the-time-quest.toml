caveats       = "Supply your own copy. Not sold on Steam or GOG, so there is no Steam appid and no ProtonDB rating — treat compatibility as unverified. The retail disc uses SafeDisc copy protection (encrypted .icd); the shipped executable will not start on modern Windows or under Proton, so a clean community build of the binaries is required to run it at all. Launch via MaiDFXvr_bleu.exe (3dfx/Glide, recommended with nGlide over Vulkan) or MaiD3Dvr_bleu.exe (Direct3D, needs dgVoodoo2/DDrawCompat). Apply the Hype: The Time Quest Widescreen & FPS fix for correct Steam Deck resolution (16:9) and unlocked framerate. No native gamepad support in the 1999 build — create a Steam Input layout to map controller inputs to keyboard/mouse; right trackpad recommended for mouse/camera control."
