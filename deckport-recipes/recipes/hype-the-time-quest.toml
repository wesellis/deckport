[proton]
version    = "GE-Proton"
winetricks = []
notes      = "Run with GE-Proton. This is a 1999 disc-based title. Note: the retail CD-ROM uses SafeDisc copy protection — the shipped MaiDFXvr_bleu.exe is just the SafeDisc shell and the real game is in an encrypted .icd file that will not launch on modern Windows or under Proton; the community installers (e.g. SuiMachine's Hype installer) provide a clean, runnable build of the executables. The two real launch executables are MaiDFXvr_bleu.exe (3dfx/Glide renderer, recommended — pair it with the nGlide wrapper, which works well over Vulkan) and MaiD3Dvr_bleu.exe (Direct3D renderer, needs a wrapper such as dgVoodoo2 or DDrawCompat to avoid glitches). Apply the Hype: The Time Quest Widescreen & FPS fix from PCGamingWiki / the Rayman Pirate-Community to get proper 16:9 resolution and unlocked framerate on the Steam Deck display. The game has no native gamepad support — create a Steam Input layout mapping the controller to keyboard/mouse, and use the right trackpad for mouse-look and camera control. The game is often called the French answer to The Legend of Zelda: Ocarina of Time."

[about]
developer = "Ubi Soft Montreal"
publisher = "Ubi Soft"
released  = "1999"
genre     = "Action-adventure"
modes     = "Single-player"
summary   = "Hype: The Time Quest is a third-person fantasy action-adventure game developed by Ubi Soft Montreal and published by Ubi Soft in 1999. The player controls Hype, a brave knight who is cursed and flung back in time, and must fight his way forward through four historical eras to defeat the evil sorcerer Barnak. Often described as the French equivalent of The Legend of Zelda: Ocarina of Time, the game features puzzle-solving, melee combat, and time-travel mechanics. It was well-received in Europe and has a devoted cult following."

