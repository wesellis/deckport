caveats       = "Supply your own legally obtained copy of the game (never officially re-released digitally; disc only). This is NOT the 2019 Bloober Team Blair Witch game (Steam App 1149640). This is Volume I of the 2000 PC anthology trilogy (I: Rustin Parr, II: Coffin Rock, III: Elly Kedward). The executable is nocturne.exe (Nocturne engine). Old DirectDraw/3dfx-era title — expect to need a DirectDraw wrapper (dgVoodoo2 / DDrawCompat); the community Windows 10/11 fix bundles a ready setup. Mouse and keyboard primary; use trackpads and Steam Input virtual keyboard on Deck. GE-Proton required."
