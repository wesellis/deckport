[game]
title       = "Race Driver: GRID"
slug        = "race-driver-grid"
aliases     = ["GRID", "Race Driver Grid 2008"]
type        = "proton"
engine      = "other"
steam_appid = "12750"      # GRID / Race Driver: GRID 2008 (appid 44310 is F1 2010, not this game)
sgdb_id     = "1406"        # https://www.steamgriddb.com/game/1406 (GRID 2008)

[about]
developer = "Codemasters"
publisher = "Codemasters"
released  = "2008"
genre     = "Racing (simcade)"
modes     = "Single-player, multiplayer"
summary   = """
**Race Driver: GRID** is a 2008 racing game developed and published by Codemasters, and the first entry in the **GRID** sub-series of the long-running **TOCA Race Driver** line. It was the first Codemasters title built on their **EGO engine** and spans disciplines from touring cars and muscle cars to Le Mans-style endurance and drift events, with a damage model and a **Flashback** rewind feature.

It was well received, winning a **BAFTA** in the Sports category and earning a Racing Game of the Year nomination at the Interactive Achievement Awards. The game was **delisted from sale in late 2016**; its single-player career remains fully playable while the original online multiplayer servers are no longer active."""

[launch]
binary         = "grid.exe"   # confirmed game executable
launch_options = ""
requires_files = []

[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Game:** Codemasters' 2008 racer (the first GRID, Steam appid `12750`), delisted end of 2016.

**DRM:** This title does **NOT** use GFWL, so no GFWL service is needed for single-player. The original retail/Steam build shipped with SecuROM; on the delisted Steam copy this is handled by Steam's own wrapper. If you run an offline DVD/disc copy instead, prefer the v1.3-patched build (the publisher's own update that removed the disc-DRM layer).

**Proton:** Runs well under Proton — use a recent `GE-Proton` or `proton_experimental`.

**Fix:** On modern multi-core CPUs the engine can crash or stutter; a community **6/8-thread CPU fix** (and matching resolution fix) resolves this.

**Display:** Widescreen/FOV can be corrected with the PCGamingWiki FOV utility.

**Controller:** Gamepad works (partial native controller support); the Steam Deck controls map cleanly with the default Steam Input gamepad profile."""

