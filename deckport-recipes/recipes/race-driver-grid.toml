[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "gold"
caveats       = """
**Supply your own copy:** Delisted commercial game (appid `12750`).

**DRM:** No GFWL service is involved. The retail/Steam build used SecuROM disc-DRM; the Steam copy launches through Steam's wrapper, so no extra shim is required for single-player.

**Fix:** On 6+ core / high-thread-count CPUs (incl. the Deck) apply the community **6/8-thread CPU fix** plus the resolution fix to avoid crashes/stutter; use the FOV utility for correct `16:10` widescreen.

**Controller:** Controller support is partial-native and the default Steam Input gamepad layout covers the rest, so input works on Deck.

**Links:** deckport links nothing."""
