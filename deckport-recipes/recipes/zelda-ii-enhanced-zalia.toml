**Free fan game:** Not Nintendo, never sold on Steam — distributed only as a free portable Windows zip on the creator's itch.io page (title **ZIIAOL** by HoverBat). Built in `GameMaker Studio 1.4`. No ProtonDB entry exists since it is not a Steam title.

**Install:** It is a portable build, not an installer — extract the zip and run `ZALiA.exe` from the extracted folder (add that exe as a non-Steam game). Try stock Proton first; GMS 1.4 games usually run without tweaks. No special winetricks confirmed.

**Controller:** Native `XInput` controller support with an in-game mapping menu (builds beyond 1.0.0.2), so the Deck gamepad should work without a Steam Input layout.

**Binary best-guess:** The exe name `ZALiA.exe` is inferred from the GMS 1.4 project name (`ZALiA.project.gmx`) and the zip naming (`ZALiA_x.x.x.x.zip`); confirm against the actual extracted files."""
