[game]
title       = "Need for Speed: Shift 2 Unleashed"
slug        = "nfs-shift-2-unleashed"
aliases     = ["NFS Shift 2", "Shift 2 Unleashed", "Shift 2"]
type        = "proton"
engine      = "other"
steam_appid = "47920"
sgdb_id     = "12120"        # https://www.steamgriddb.com/game/12120 (Shift 2 Unleashed)

[launch]
binary         = "shift2u.exe"
launch_options = ""
requires_files = []

[proton]
version    = "GE-Proton"
winetricks = ["physx"]
notes      = """
**Game:** 2011 Slightly Mad Studios / EA sim-style racer (Steam appid `47920`, delisted 2021-05-31). Main exe is `shift2u.exe`.

**Proton:** Runs under Proton; `GE-Proton` recommended for the PhysX/older-EA stack.

**DRM:** Game shipped with **TAGES SolidShield** DRM tied to EA online activation servers that are now defunct — **a clean offline-capable executable is required or the game will fail activation**; this is a copy/DRM issue, not a Proton issue.

**Install:** Install bundled PhysX (`9.10.0513`), DirectX, and `vcredist_x86` redistributables into the prefix (`protontricks physx d3dx9 vcrun2008`).

**Fix:** If it fails to launch, `GE-Proton` plus those redists usually resolves it.

**Controller:** Gamepad support works for driving and menu navigation, so the Deck's built-in controls are usable without a custom Steam Input layout. Note two quirks reported by players: the menus keep showing **keyboard** button prompts even on a pad, and the pad has noticeable **input lag/sensitivity** out of the box — both are cosmetic/tunable, not blockers (lag is improved by setting `DampeningEnabled` to `0` in `vehicleset_pc_custom_pad.xml` and reselecting the in-game *Custom* control scheme).
"""

