[about]
developer = "Slightly Mad Studios"
publisher = "Electronic Arts"
released  = "2011"
genre     = "Racing (simulation)"
modes     = "Single-player, online multiplayer"
summary   = """
**Shift 2 Unleashed** (also branded **Need for Speed: Shift 2 Unleashed**) is the seventeenth **Need for Speed** title and a direct sequel to **Need for Speed: Shift**, built by **Slightly Mad Studios**. It is a **simulation-leaning** racer noted for its cockpit-mounted **helmet camera** and visceral first-person crash effects, covering road, circuit, and drift events with licensed cars and real-world tracks.

The game was **removed from Steam on 2021-05-31** and its online services were retired on 2021-08-31, but offline single-player remains playable. Its **TAGES SolidShield** DRM and former EA online activation can complicate launching a stock retail copy.
"""

[art]
cover = "auto"
hero  = "auto"
logo  = "auto"
icon  = "auto"

[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "gold"
caveats       = """
**Supply your own copy:** Delisted 2021-05-31 (Steam appid `47920`) — config only, no links.

**DRM:** The original DRM (**TAGES SolidShield**) phoned home to EA activation servers that no longer exist, so a stock retail/Steam install may refuse to launch on Deck; **a copy that does not require online re-activation is needed**.

**Proton:** Use `GE-Proton`.

**Install:** Install PhysX `9.10.0513`, DirectX, and `vcredist_x86` into the prefix; add `shift2u.exe` to a clean launch (compatibility tweaks like 'run as admin' are Windows-only and not needed under Proton).

**Controller:** Gamepad works for menus and driving without a custom Steam Input layout, but menus show keyboard prompts and the pad has input lag until you set `DampeningEnabled=0` in `vehicleset_pc_custom_pad.xml`.

**Tier:** Estimated gold pending Deck retest.
"""
