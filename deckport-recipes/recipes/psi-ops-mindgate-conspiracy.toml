**Supply your own copy:** Never released on Steam or GOG. The PC version was made freeware by Midway in 2008 — supply your own legally-obtained copy of the game files.

**60fps cap is mandatory:** The engine is framerate-tied. Running *above* 60fps breaks ladders, jumping, and movement. Cap to 60fps via ThirteenAG's d3d9 wrapper (`FPSLimit=60`), the Deck's per-game frame limit, or in-game Vsync. 30fps is not required.

**Install the Widescreen Fix:** ThirteenAG's WidescreenFixesPack Psi-Ops fix corrects resolution, aspect ratio, HUD, FOV, and FMVs, and bundles the d3d9 frame limiter. Copy its files next to `PsiOps.exe`.

**Controller layout:** Default Steam Deck button mapping may not work correctly. Apply a community Steam Input layout for Psi-Ops or create a manual mapping.

**No Steam app ID:** Added as a non-Steam shortcut only; no Steam cloud saves or overlay features.
"""
