winetricks = []
notes      = """
**Overview:** Psi-Ops: The Mindgate Conspiracy is a 2004 third-person action game by **Midway Games** in which players use telekinetic and mind-control powers to fight through military enemies. The PC version was released in 2004 and has never appeared on Steam or GOG.

**Legal status:** In 2008, Midway made the PC version available as a **free freeware download** bundled with optional adware (which is no longer active). The game is therefore freely and legally distributable; supply your own copy of the game files.

**Adding to Steam:** In Desktop Mode, add `PsiOps.exe` as a Non-Steam Game in Steam. Under *Properties → Compatibility*, force **GE-Proton** (install via ProtonUp-Qt if not already present).

**Framerate cap — critical:** The Psi-Ops engine is **framerate-dependent**. Running **above 60fps** causes bugs — ladders can kill the player, jumping may not register, and the character ghosts when moving. **Cap the framerate to 60fps.** The cleanest fix is ThirteenAG's d3d9 wrapper (`d3d9.dll` + `d3d9.ini` with `FPSLimit=60`) included with the Widescreen Fix below; alternatively use the Steam Deck's built-in per-game frame limiter (Performance overlay → Frame Limit → 60) or enable in-game Vsync. 60fps is the target — 30fps is not required and the game is fully playable at 60.

**Essential mod — Widescreen Fix:** Install ThirteenAG's **WidescreenFixesPack** Psi-Ops fix (copy the files next to `PsiOps.exe`). It corrects resolution, aspect ratio, HUD, field of view, and FMV cutscenes for 16:9, and its bundled d3d9 wrapper handles the 60fps limit. Set the desired resolution in `PsiOpsTheMindgateConspiracy.WidescreenFix.ini`.

**Controller mapping:** The game was originally designed for Xbox/PS2 controllers but the PC version's controller detection may not automatically map the Deck inputs correctly. Apply a **community Steam Deck controller layout** from Steam Input (search in the community layouts for "Psi-Ops" — several configurations have been shared). Alternatively, create a manual layout mapping the game's keyboard bindings to Deck buttons.

**Graphics settings:** Without the Widescreen Fix the game is limited to 4:3 resolutions (e.g. 1024×768 or 1280×1024). With the Widescreen Fix installed you can set the Deck's native 1280×800. GE-Proton handles the Direct3D 9 rendering without additional winetricks.

**Stability:** The game may crash on level transitions or after extended sessions under certain Proton versions. If instability occurs, try the previous GE-Proton release.

**Confirmed playthrough:** Community members including the YouTube series *"Barry Plays Psi-Ops"* have confirmed a full playthrough is achievable on Steam Deck hardware.
"""

