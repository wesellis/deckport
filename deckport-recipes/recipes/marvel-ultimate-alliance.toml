**Supply your own copy:** Delisted commercial Steam game (DRM) — supply your own copy. `deckport` links nothing for downloading it.

**Controller:** Expect to set the Gamepad template + fix the phantom Player 2 (see proton notes); not plug-and-play.

**Binary:** `MUA.exe` confirmed from the Steam install folder; Proton version still needs an on-Deck test.
"""

[about]
developer = "Raven Software (PC port by Beenox)"
publisher = "Activision"
released  = "2006"
genre     = "Action role-playing"
modes     = "Single-player, local co-op (up to 4 players)"
summary   = """
**Marvel: Ultimate Alliance** is a 2006 **action role-playing game** in which players assemble a team of four Marvel superheroes from a large roster and battle through a story spanning the Marvel Universe. It was the third and final Marvel title from **Raven Software**, following **X-Men Legends** and its sequel, and shares their **squad-based, isometric brawler-RPG** gameplay.

The original release was well received and spawned a long-running **series**. A **2016 remaster** returned the game to Steam, but both it and the sequel were **delisted in 2018** after Activision's Marvel publishing license expired.
"""
