sgdb_id     = ""

[launch]
binary         = "MUA.exe"
launch_options = ""
requires_files = []

[proton]
version    = "proton_experimental"
winetricks = []
notes      = """
**About:** The 2006 action-RPG (Raven Software; Beenox PC port) — the first in the series, before Ultimate Alliance 2. This recipe targets the 2016 Steam remaster (Zoë Mode, appid 433300); installs to `steamapps/common/Marvel - Ultimate Alliance/` with `MUA.exe` in the root.

**DRM:** Steam DRM; delisted in 2018 (the 2016 re-release was pulled too). Supply your own copy.

**ProtonDB:** **Gold**. Use `proton_experimental` — it clears up the audio crackling some reports see on default Proton. (WineGE-8-26 also works for those using Lutris.)

**Controller:** Native gamepad, but Steam Input bindings are flaky. Switch the controller config to the default **Gamepad** template ("Zoë Mode Official Layout"). Press **Start** at the main menu to activate the pad. The game may register a phantom second controller — open in-game Options right after launch and set **Player 2** input to **Keyboard** so pressing Start doesn't add an extra player.

**Display:** Game defaults to a low resolution (800x600 / 1280x720); raise it to `1280x720` in Video Options and enable **V-Sync** to stop battery drain from an uncapped framerate.

**Cosmetic:** Minor stutter the first time each cutscene loads; smooth otherwise.

**Install method:** Normal Steam install of an owned copy — no extra files needed for the base game.
"""

