[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "gold"
caveats       = """
**Supply your own copy:** Delisted from Steam 2022-12-14 (whole Unreal series; GOG followed 2022-12-23). In late 2024 OldUnreal received Epic's permission to distribute an official free installer for Unreal Gold, so an existing library copy or that authorized free release is fine.

**Status:** Community reports confirm it runs on Deck via Proton (gold), but this specific recipe has not been Deck-verified yet — left at `needs-test`.

**Display:** If you hit a black screen on AMD, install the OldUnreal 227 patch and switch the renderer to `OpenGL` or `Direct3D 9`.

**Controller:** No native controller support; uses a Steam Input keyboard/mouse layout on Deck.

**Multiplayer:** Multiplayer master server is gone, but LAN/direct-IP and singleplayer (incl. Return to Na Pali) work.

**Install:** deckport links nothing.
"""
