[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Delisted:** Delisted Steam game (`appid 639170`; pulled `2019-04-29` after Telltale's closure + Minecraft IP license expiry — not returning to sale).

**Proton:** Telltale's late-era engine runs cleanly under Proton; it was whitelisted by Valve (reporter just pressed Play, no tweaks) and ProtonDB rates it platinum, so **no DRM/launcher workarounds are needed**. Use `GE-Proton` (or `proton_experimental` as a fallback). Note the platinum tier is low-confidence (few reports).

**DRM:** No GFWL/SecuROM.

**Controller:** Native gamepad support works on Deck — **connect/enable the controller BEFORE launching**; if the right stick or a QTE fails to register, fall back to a Steam Input gamepad/Steam-Deck-controller layout.

**Saves:** Proton gives each game its own prefix, so if you want Season One choices imported, manually copy the Season One save into this game's prefix."""

[about]
developer = "Telltale Games"
publisher = "Telltale Games"
released  = "2017"
genre     = "Episodic graphic adventure"
modes     = "Single-player"
summary   = """
**Minecraft: Story Mode - Season Two** is a five-episode narrative adventure developed by **Telltale Games** in collaboration with **Mojang**, set in the blocky world of Minecraft. Players return as the customizable hero **Jesse** (selectable as male or female), making **branching dialogue and crafting choices** that shape the story across the season, in Telltale's signature choice-driven episodic format.

The first episode launched in July 2017 and the game met generally mixed-to-positive reception. It was delisted following Telltale's 2018 closure and the **expiry of the Minecraft license**, making the season no longer available for sale."""

