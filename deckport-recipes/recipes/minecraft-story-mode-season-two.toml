verified_on   = ""
contributor   = ""
protondb_tier = "platinum"
caveats       = """
**Supply your own copy.** Delisted single-player Telltale title (`appid 639170`) — no servers needed, fully offline. deckport links nothing.

**Proton:** ProtonDB platinum; community confirms it runs on Linux/Proton, so it should play on the Deck with `GE-Proton`.

**Binary:** Launcher exe is `Minecraft2.exe` (Season One ships `MinecraftStoryMode.exe`). If Steam reports it missing, verify game files — a known partial-download bug leaves only `_CommonRedist` with no exe.

**Controller:** Native controller support works but is finicky — enable the pad before launch and use a Steam Input layout if a QTE/right-stick input is missed.

**Saves:** Saves are per-prefix under Proton; copy Season One saves over manually if you want choice carryover."""
