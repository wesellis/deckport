[about]
developer = "Tigon Studios and Midway Studios - Newcastle"
publisher = "Ubisoft (with Midway Games)"
released  = "2009"
genre     = "Open-world action driving"
modes     = "Single-player"
summary   = """
**Wheelman** is a 2009 **open-world action-driving** game starring and co-created by **Vin Diesel**, set in a fictionalized **Barcelona** where the player works as an undercover getaway driver caught between rival gangs. Most missions revolve around vehicular action and stunt driving, with some on-foot third-person shooting and a signature **'air-jack'** move for hijacking cars mid-chase.

Reviews were mixed-to-average, with critics praising its over-the-top car chases while faulting a thin story and lack of multiplayer; it has since gained a small **cult following**. The PC version was **delisted in 2012** following **Midway's bankruptcy** and expired in-game car-license contracts."""

