[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Game:** 2009 Tigon/Midway open-world driving-action game starring Vin Diesel (Steam appid `21920`, delisted 2012 after Midway's bankruptcy and expired in-game car licenses).

**DRM:** The PC port ships with Games for Windows - LIVE and SecuROM; **GFWL sign-in is the main blocker under Proton**.

**Proton:** Use `GE-Proton` for better GFWL handling.

**Fix:** Apply the community xliveless `xlive.dll` replacement to bypass GFWL and run fully offline. **Drop the replacement `xlive.dll` next to `Wheelman.exe` in the install dir.** With that in place the game launches and plays.

**Controller:** The port has **no native XInput/gamepad support** - it expects keyboard + mouse, and there's no in-game key rebinding. Players on Windows use x360ce/xpadder to fake a pad; on the Deck, use **Steam Input** with a keyboard/mouse-style controller layout. Plan on tweaking the per-game controller mapping rather than expecting it to "just work."

**Note:** The port has **no in-game video options and no key rebinding**."""

