caveats       = """
**Supply your own copy:** Delisted from Steam in 2012 (Midway bankruptcy + expired car-license contracts).

**GFWL:** Main hurdle is Games for Windows - LIVE; bypass with the xliveless `xlive.dll` replacement to play offline under Proton (`GE-Proton` recommended).

**DRM:** SecuROM DRM is also present.

**Controller:** **No native gamepad support** - use Steam Input with a keyboard/mouse-style layout (the port has **no in-game video options and no key rebinding**).

**ProtonDB:** Very few reports (low confidence); treat tier as unconfirmed and test before trusting it.

**Note:** No verified Deck run yet - test before trusting."""
