caveats       = """
**Supply your own copy.** deckport links nothing.

**Game:** Single-player 2D Metroidvania (**Woblyware**), a **GameMaker** title delisted from Steam on **Aug 8, 2024** after the studio shut down. Lightweight, with built-in XInput controller support and **no `GFWL`/online dependency** beyond the standard Steam wrapper, so it plays well on the Deck under Proton (ProtonDB **silver**, small report sample).

**Install:** Binary `Omega Strike.exe` is from the known install layout — **verify against yours**.

**Availability:** At least one community comment claimed the Steam build may still have been buyable for a window after the console delisting, so **double-check current store availability** before relying on the 'not for sale' assumption.

**Offline:** No servers to worry about (offline single-player).
"""
