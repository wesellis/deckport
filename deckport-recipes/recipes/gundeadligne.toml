caveats       = """
**Supply your own copy.** deckport links nothing.

**Delisted:** Removed at the developer's request (July 2019), so it is **no longer for sale**.

**Proton:** ProtonDB gold; multiple community reports run it on `Proton 7.0-5+`/`GE-Proton`, so it should play on the Deck.

**Display:** Tiny-window-on-fullscreen-res — fix in `gundead.ini` via `Resize=-1` + `Width`/`Height` set to native res.

**Controller:** Double-binding (one pad seen as P1 and P2) — set Steam Input Per-Game Settings to `Force Off`.

**Offline:** Single-player offline shmup, no servers to worry about.

**Status:** Specific Deck recipe still **NEEDS-TEST**."""
