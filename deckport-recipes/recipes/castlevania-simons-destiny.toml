[game]
title       = "Castlevania: Simon's Destiny"
slug        = "castlevania-simons-destiny"
aliases     = ["Simon's Destiny", "Simons Destiny GZDoom", "Castlevania GZDoom fan game"]
type        = "native"
engine      = "gzdoom"
steam_appid = ""
sgdb_id     = ""

[launch]
binary         = "flatpak"
launch_options = "run org.zdoom.GZDoom -iwad ~/.var/app/org.zdoom.GZDoom/.config/gzdoom/Castlevania.ipk3"
requires_files = ["Castlevania.ipk3"]

[proton]
version    = ""
winetricks = []
notes      = """
**Overview:** Non-commercial Castlevania fangame in first-person `GZDoom` by Batandy (Andrea Gori) — **completely standalone**, free on itch.io (batandy.itch.io/simonsdestiny). No Doom or Castlevania files needed; the download (currently V1.4) ships a self-contained IWAD, `Castlevania.ipk3`.

**Install:** Install the GZDoom Flatpak (`org.zdoom.GZDoom`) via Discover in Desktop Mode. Download Simon's Destiny from itch.io, extract it, and place `Castlevania.ipk3` in `~/.var/app/org.zdoom.GZDoom/.config/gzdoom/`.

**Launch:** Because `Castlevania.ipk3` is a standalone IWAD, launch it with `-iwad ~/.var/app/org.zdoom.GZDoom/.config/gzdoom/Castlevania.ipk3` (or just pick "Castlevania: Simon's Destiny" from the GZDoom IWAD picker on first run). Add as a non-Steam shortcut with those launch options. Set the renderer to Hardware (OpenGL).

**Content:** Six levels recreating the NES Castlevania in 3D with Simon's whip and all classic enemies."""

[about]
developer = "Batandy / Andrea Gori (batandy.itch.io)"
publisher = "Independently released (free, itch.io)"
released  = "2017 (current V1.4)"
genre     = "First-person action (Castlevania fan game, standalone GZDoom)"
modes     = "Single-player"
summary   = "**Castlevania: Simon's Destiny** is a non-commercial first-person **fan game** built on **GZDoom** by developer Batandy that faithfully recreates the NES original **Castlevania** in 3D. It features six levels mirroring the classic stages, Simon Belmont's iconic **whip**, a full roster of classic enemies, and original visual and audio work designed to evoke the **1986 game**. Completely standalone and free, it requires no Doom or Castlevania files. Batandy has released several other GZDoom fangames including **GZ PT** (a GZDoom recreation of P.T.) using the same standalone pk3 approach."

