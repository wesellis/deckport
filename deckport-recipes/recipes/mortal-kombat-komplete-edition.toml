summary   = "The 2013 PC port of NetherRealm Studios' 2011 **Mortal Kombat** (the ninth main entry, MK9), built on **Unreal Engine 3**. The **Komplete Edition** bundles the base game with all downloadable content, including the four DLC fighters (Skarlet, Kenshi, Rain, and guest character **Freddy Krueger**) plus extra costumes and Klassic skins. It rebooted the **series** with a return to **2D-plane fighting** and was widely praised for revitalizing the franchise. The game has been **delisted** from sale, in part due to **expired licensing for guest content**."

