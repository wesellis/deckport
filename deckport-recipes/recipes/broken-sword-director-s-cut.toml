[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "platinum"
caveats       = """
**Supply your own copy.** deckport links nothing.

**Delisted:** Removed from Steam Nov 2024 in favor of the 'Reforged' remake; this is the original 2009 Director's Cut (appid `57640`).

**Proton:** ProtonDB platinum and previously Steam Deck Verified, so community reports confirm it runs on Deck under `proton_experimental`. Launcher is `bs1dc.exe`.

**Fix:** If the game won't start, install **OpenAL** (`openal` winetricks verb, or run `oalinst.exe` from the install folder inside the prefix). If it launches but has no sound, set a Steam launch option such as `--sounddevice "Generic Hardware"`.

**Controller:** Single-player point-and-click; right trackpad as mouse with the default Verified layout is plenty, no controller hack required."""
