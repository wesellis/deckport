[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Delisted:** Delisted Steam game (appid `907600`, removed `2025-01-24` when the publishing deal ended; owners keep it in their library). Unity `2020.3.44f1` 2D shoot'em-up.

**Proton:** ProtonDB rates it **platinum** (small sample — only a handful of reports) and it runs out of the box on Proton — `GE-Proton` or `proton_experimental` both work, **no winetricks needed**.

**DRM:** Windows build requires Steam DRM, so **launch it through Steam** (the wrapper) rather than the bare `.exe`.

**Controller:** Native controller support is full, so no Steam Input layout is required; a controller is also **mandatory for the local co-op mode**.
"""

[about]
developer = "Sunnyside Games"
publisher = "Noodlecake Studios"
released  = "2020"
genre     = "Action"
modes     = "Single-player, local multiplayer"
summary   = "**Towaga: Among Shadows** is a stylized **2D action** game where the player stays planted in a fixed spot and aims a beam of light to vaporize incoming waves of shadow creatures, with ability and upgrade systems layered on top. It follows the masked hero Chimu using the power of light against the villain Metnal across a phase-based **story mode**, plus a **survival mode** and a simple **local co-op** brawler where two players fly around and blast each other. Developed by **Sunnyside Games** and published on PC and consoles by **Noodlecake Studios**, it is an expanded follow-up to the earlier mobile title **Towaga**, praised for its **hand-drawn art** and music. The PC version was **delisted from Steam in 2025** after its publishing agreement ended."

