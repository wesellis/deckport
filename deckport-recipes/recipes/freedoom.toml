[game]
title       = "Freedoom"
slug        = "freedoom"
aliases     = ["Freedoom Phase 1", "Freedoom Phase 2", "FreeDM", "freedoom1.wad", "freedoom2.wad"]
type        = "native"
engine      = "other"
steam_appid = ""
sgdb_id     = "5273735"

[launch]
binary         = "gzdoom"
launch_options = "-iwad freedoom1.wad"
requires_files = ["freedoom1.wad"]

[proton]
version    = ""
winetricks = []
notes      = """
**Engine:** Native Linux via `GZDoom` (Flatpak: `org.zdoom.GZDoom` on Flathub/Discover).

**Install:** Download Freedoom WADs from freedoom.github.io and place them at `~/.var/app/org.zdoom.GZDoom/.config/gzdoom/` (the Flatpak config path). `GZDoom` **auto-detects IWAD files at launch**.

**Launcher:** Alternatively use `GZDeck` (github.com/flegald/GZDeck), a launcher built specifically for `GZDoom` on Steam Deck that simplifies mod/IWAD launching and adds the `--no-sandbox` launch argument **required by the Flatpak**. (Note: GZDeck is no longer actively maintained, but still works; community forks exist.)

**Non-Steam game:** For adding to Steam as a non-Steam game, set launch options to: `--no-sandbox -iwad freedoom1.wad` (or `freedoom2.wad` / `freedm.wad`).

**Alternative:** RetroDECK also bundles `GZDoom` and supports Freedoom WADs.

**WADs:** Phase 1 replaces Doom 1, Phase 2 replaces Doom 2, FreeDM is a deathmatch-focused standalone WAD.
"""

[about]
developer = "Freedoom contributors (open source community)"
publisher = "Free/open source — CC BY"
released  = "2001 (ongoing)"
genre     = "First-person shooter"
modes     = "Single-player, Multiplayer (via source ports)"
summary   = "**Freedoom** is a completely free and open-source set of **DOOM-engine** game data created entirely by community volunteers, licensed under **Creative Commons**. It provides two full single-player campaigns (Phase 1 and Phase 2) and a deathmatch-focused WAD (FreeDM), all designed to be fully compatible with any **DOOM source port**. Because Freedoom replaces the commercial **id Software IWADs**, players can experience the full DOOM engine experience without owning the original games. It also acts as a base for the vast library of community-made DOOM maps and mods, most of which run against Freedoom without modification."

