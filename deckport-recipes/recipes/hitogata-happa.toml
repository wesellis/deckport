verified_on   = ""
contributor   = ""
protondb_tier = "silver"
caveats       = """
**Supply your own copy.** Delisted from Steam 2019-07-31 (developer request) — not currently for sale on that store. deckport links nothing.

**Proton:** ProtonDB silver — runs under Proton (`GE-Proton` / `experimental`), no DRM blockers, single-player only so no server concerns.

**Controller:** Native `XInput` support means the Deck gamepad works without a Steam Input layout; remaining keys are editable in `happa.ini`.

**Binary:** `happa.exe` is the expected Platine Dispositif build name — confirm against your install.

**NEEDS-TEST:** not yet confirmed end-to-end on Deck hardware."""
