**Supply your own copy:** Delisted commercial game (off Steam since 2017-07-17).

**Proton:** UE3 title, runs under Proton (`GE-Proton`).

**Fix:** Apply the **THHD Launcher v1.02 + Community Patch** (skejt23, KaMeR) for widescreen/resolution and control fixes, and **launch via the community `Launcher.exe`** in `Binaries\\Win32`.

**Controller:** XInput-based. If the pad isn't detected, set **Steam Input = Disabled** for the game; no custom layout needed.

**ProtonDB:** Tier is **gold** but based on only a handful of low-confidence reports (some note .NET install hiccups on newer Proton); treat as needs-test rather than guaranteed.
