[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Game:** Delisted Steam game (`appid 421020`).

**Proton:** Run the WINDOWS build through Proton on the Deck — `GE-Proton` (or a recent `proton_experimental`) is the known-good path; community reports a locked 60 FPS on Ultra with only a couple harmless startup warning messages.

**Fix:** **Prefer the Windows/Proton version over the bundled native Linux build** — the native build has stability problems and dislikes Xbox-style controllers, whereas the Windows-through-Proton version is plug-and-play for the Deck's gamepad.

**DRM:** No GFWL/SecuROM/DRM steps needed.

**Online:** Online multiplayer servers were historically flaky but a Proton networking fix addressed DiRT 4's server-connect issue; treat single-player/career as the supported experience.

**Install:** deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "Codemasters"
publisher = "Codemasters"
released  = "2017"
genre     = "Racing (rally)"
modes     = "Single-player, online multiplayer"
summary   = "**DiRT 4** is a rally and rallycross racing game developed and published by Codemasters, released for PC in June 2017 as part of the long-running **Colin McRae/DiRT series**. Its standout feature is the **'Your Stage'** system, a procedural generator that builds near-limitless rally routes from a few parameters. It was generally well received for its driving model and content, offering both an accessible arcade handling option and a more demanding simulation mode. The game was later delisted from Steam, reportedly due to **expiring licensing agreements**."

