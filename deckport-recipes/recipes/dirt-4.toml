caveats       = """
**Supply your own copy.** deckport links nothing.

**Status:** Delisted Steam game (`appid 421020`), ProtonDB gold. Community reports confirm it runs on Deck via the Windows build under Proton at locked 60 FPS Ultra.

**Proton:** Use `GE-Proton` (or recent `proton_experimental`); avoid the native Linux build (less stable, poor controller support) — the Windows/Proton path gives plug-and-play gamepad.

**DRM:** No DRM/GFWL workaround required.

**Online:** Online play depended on servers that may no longer be reliable, so plan on single-player/career.

**Binary:** Binary set to `dirt4.exe`; double-check against your install layout."""
