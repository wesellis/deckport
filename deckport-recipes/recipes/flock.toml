[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "platinum"
caveats       = """
**Supply your own copy.** deckport links nothing.

**Delisting:** delisted Capcom puzzler (appid `21640`) — removed from Steam in 2022 over a key-generation exploit, briefly relisted in 2023, and delisted again in May 2024 due to SecuROM DRM / key issues — **not for sale now**.

**Known risk:** the original **SecuROM DRM** is the most likely thing to block launch on the Deck — prefer a `GE-Proton` build, which copes with SecuROM better than stock Proton.

**Controller:** native gamepad support, so Deck controls work without a custom Steam Input layout.

**ProtonDB confidence:** the `platinum` tier rests on only a handful of reports (low confidence on ProtonDB), so treat it as promising rather than proven — expect to validate the SecuROM launch yourself.

**Status:** rated `platinum` on ProtonDB but not yet verified on this exact recipe, hence `needs-test`. Single-player, so no dead-server concerns."""
