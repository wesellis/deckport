[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Game:** `Flock!` (Capcom, 2009) — herd-the-sheep puzzler, delisted from Steam (appid `21640`).

**Install:** default install path is the game root `\\Flock.exe` (originally `C:\\Program Files\\Capcom\\FLOCK!\\Flock.exe`).

**DRM:** the big Deck concern is the **SecuROM DRM** on the original release. **If the DRM blocks launch, that is the most likely failure point.**

**Proton:** `GE-Proton` handles SecuROM better than stock Proton, so **use a `GE-Proton` build** (fall back to `proton_experimental`).

**Controller:** native Xbox-360-era gamepad support means the Steam Deck controls map out of the box; no Steam Input keyboard layout needed.

**Files:** deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "Proper Games (with A.C.R.O.N.Y.M. Games)"
publisher = "Capcom"
released  = "2009"
genre     = "Puzzle"
modes     = "Single-player, local co-op"
summary   = """
**Flock!** is a **physics-based puzzle game** in which the player pilots a UFO to herd farm animals (sheep, cows, chickens, pigs) across 55 levels back to the mothership while avoiding hazards and predators. It was developed by **Proper Games** and published by **Capcom**, releasing in 2009 for Windows, PlayStation Network and Xbox Live Arcade.

The PC release shipped with a **level editor** and earned generally favorable reviews, but it was later **delisted from Steam over key/DRM issues**, leaving it no longer for sale."""

