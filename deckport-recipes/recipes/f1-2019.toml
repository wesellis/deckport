summary   = "**F1 2019** is the official Formula One racing simulator developed and published by **Codemasters**, released in June 2019 as part of their long-running annual **F1 series** built on the **EGO engine**. It was the first entry to feature the **Formula 2 championship** and added a story-driven career mode alongside the series' signature realistic racing, classic cars, and time-trial modes. It was generally well received for its handling and presentation. Following **Electronic Arts' acquisition of Codemasters**, the game was removed from sale on Steam in March 2022 after the underlying licensing arrangements lapsed."

[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "platinum"
caveats       = """
**Supply your own copy:** deckport links nothing.

**Status:** ProtonDB platinum; community reports it running well on Linux/Proton, so it should play on the Deck (still needs a hands-on confirm).

**Display:** Launch the DX11 exe (`f1_2019.exe`) rather than the DX12 one for stability on AMD.

**Controller:** Native gamepad support means the Deck controller works with no Steam Input layout. (Wheels are hit-or-miss under Proton; the pad is fine.)

**DRM:** Uses Denuvo — runs under Proton, but activate it online once before counting on offline play (hardware-activation limit).

**Multiplayer:** Online multiplayer servers for this title may be retired — treat it as single-player/time-trial only."""
