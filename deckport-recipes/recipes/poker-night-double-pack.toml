verified_on   = ""
contributor   = ""
protondb_tier = "gold"
caveats       = """
**Supply your own copy:** Delisted (Telltale closure / licensed guest characters) — configuration only, no links.

**Two games:** Two separate games in the pack (appids `31280` + `234710`) — point the importer at whichever exe you want: `PokerNight2.exe` for Poker Night 2, and `CelebrityPoker.exe` for Poker Night at the Inventory (the PN1 exe keeps its original "Celebrity Poker" working title).

**Fix:** Black-screen-after-Telltale-logo is a **corrupt save, not a Proton fault** — delete the save under `Documents/Telltale Games/<game>` in the prefix.

**Proton:** Older OpenGL engine — prefer `GE-Proton` if `proton_experimental` black-screens.

**Controller:** Native controller support works on Deck."""

