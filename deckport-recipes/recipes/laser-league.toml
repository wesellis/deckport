[launch]
binary         = "LaserLeague.exe"   # Unreal Engine 4 title; top-level launcher. UE4 shipping exe lives at LaserLeague/Binaries/Win64/ — confirm exact casing in your install folder
launch_options = ""
requires_files = []

[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Game:** Laser League: World Arena (delisted Steam appid `570460`), a fast 1-3v3 neon arena game built on Unreal Engine 4.

**Proton:** Use `GE-Proton` (`Proton Experimental` also works). ProtonDB rates it **gold** (best reports reach platinum).

**Online:** Online servers shut down July 6 2023, but **local/offline play still works**. On launch the game tries to load your online profile and fails; when prompted to retry, **choose No** and it opens to the offline menus. Note: ranking, challenges and cosmetic-unlock progression are gone (server-side); only local matches remain. Some owners have had to restore a working offline build via a Steam Console depot download to get past the connection screen — see the linked Steam guide.

**Controller:** Controller support is central to the design and the Deck gamepad works out of the box; no Steam Input layout is needed for one pad. If you connect **multiple controllers** and hit input glitches, switch the in-game **Controller API to "Direct"** in settings to fix it.

**Modes:** Drop into Local Game mode for solo/AI or hot-seat couch play (offline local match supports up to 2 players; campaign is online-only and now unavailable).

**Install:** deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "Roll7"
publisher  = "505 Games"
released   = "2018"
genre      = "Futuristic sports / action arena"
modes      = "Single-player, local multiplayer, online multiplayer"
summary    = """
**Laser League** is a fast-paced futuristic team sports game from **Roll7**, the British studio known for the **OlliOlli** series, published by 505 Games and built on **Unreal Engine 4**. Players claim **control nodes** that energize laser barriers across a neon arena, aiming to fry the opposing team while dodging the beams.

It launched in May 2018 and was relaunched in December 2021 as the free-to-play **Laser League: World Arena**. The online servers were shut down on July 6, 2023, leaving local and offline play, and the title was **delisted from Steam**."""

