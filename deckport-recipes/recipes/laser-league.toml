[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "gold"
caveats       = """
**Supply your own copy.** deckport links nothing.

**Online:** **ONLINE MULTIPLAYER IS DEAD** — the World Arena servers were shut down July 6 2023, so only offline / local-couch play remains (ranking, challenges and cosmetic unlocks are gone with the servers). On launch the game fails to fetch your online profile; **pick No** when asked to retry to reach the offline menus. If your install hangs on the connection screen, owners have restored a working offline build via a Steam Console depot download (see linked guide).

**Proton:** ProtonDB **gold** (best reports platinum); runs on Proton (`GE-Proton` or `Experimental`).

**Controller:** Local play is controller-driven and the Deck pad works natively (no Steam Input layout required). With **multiple controllers**, set the in-game **Controller API to "Direct"** if you see input glitches; extra players each need their own pad.

**Binary:** This is an **Unreal Engine 4** game (not Unity). `LaserLeague.exe` is the expected top-level launcher; the shipping exe sits under `LaserLeague/Binaries/Win64/`. Confirm the exact name/casing in your install."""
