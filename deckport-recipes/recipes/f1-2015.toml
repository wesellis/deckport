**Supply your own copy:** Delisted Steam game (appid `286570`); deckport links nothing.

**Compatibility:** ProtonDB gold. Community reports confirm it runs well on Linux/Proton/Deck via DXVK/Vulkan — the Proton-on-Windows-build path beats Feral's native Linux port (native ~17 FPS vs Proton 30 FPS / 60 in menus).

**Controller:** Native gamepad support, so Deck controls work without a custom layout.

**Quirk:** Graphics default to Low preset / 800x600 on every launch unless you write-protect the `hardware_settings` config.

**Binary:** Set to `F1_2015.exe` (confirm against your install)."""
