[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Overview:** Delisted Steam game (appid `280460`) — a lightweight 2D arcade twin-stick shooter with local co-op. **ProtonDB rates it platinum** and it shipped with a native Linux/Mac build, so it runs effortlessly on the Deck.

**Proton:** Use stock Proton (`GE-Proton` or `proton_experimental` both work) and just hit Install/Play. **No launch options required.**

**Native:** If you own the native Linux build it will launch directly without Proton at all.

**DRM:** No DRM, GFWL, or `winetricks` needed.

**Install:** Confirm the binary name against your install — the Windows build ships as `Pulstar.exe`."""

[about]
developer = "Concave Studio / Colorful Media / Emagica"
publisher = "Indietopia Games"
released  = "2014"
genre     = "Action, Indie, Twin-stick shooter"
modes     = "Single-player, local co-op multiplayer"
summary   = "**Pulstar** is a fast-paced 2D arcade **twin-stick shooter** in which players pilot a ship through waves of enemies, blending **bullet-hell** action with retro arcade scoring. It supports both solo play and **local co-op**. Released in 2014 by indie developers Concave Studio, Colorful Media and Emagica, it is unrelated to the 1995 SNK **Neo Geo** arcade shoot-'em-up of the same name. The game was **delisted from Steam** in early 2024 after publisher Indietopia Games wound down its publishing operations, though previously-purchased copies remain installable."

