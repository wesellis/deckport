summary   = "**Unreal Tournament** is a 1999 first-person arena shooter built on the original **Unreal Engine**, developed by Epic Games and Digital Extremes. It pioneered fast **deathmatch** and objective game modes such as **Capture the Flag**, Assault, and Domination, and was widely praised as one of the defining multiplayer FPS titles of its era, winning numerous Game of the Year awards.\n\nThe Game of the Year Edition is a 2000 re-release that bundles extra maps, mutators, and bonus content. The Steam release was later **delisted**, leaving the community **OldUnreal patch** project to keep the game running on modern systems."

