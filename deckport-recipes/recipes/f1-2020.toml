protondb_tier = "gold"
caveats       = """
**Supply your own copy.** deckport links nothing.

**Delisting:** Delisted from Steam on 2023-03-15 (FIA/EA licensing expired) — appid `1080110` still resolves for owners.

**Status:** ProtonDB gold and many community reports confirm it running on Linux/Proton, so it should play on Deck, but **this exact recipe hasn't been Deck-confirmed yet** (`needs-test`).

**Display:** Pick the DX11 build (`F1_2020.exe`) for best stability; switch to `F1_2020_dx12.exe` only if you want the extra fps.

**DRM:** Denuvo Anti-Tamper was removed by a 2021 patch; only Steam's standard DRM remains and there's no EA anti-cheat, so it launches under Proton without any bypass.

**Controller:** Native gamepad support is fine on Deck.

**Online:** Online multiplayer/My Team online features may be dead post-delisting; single-player and time-trial are unaffected."""
