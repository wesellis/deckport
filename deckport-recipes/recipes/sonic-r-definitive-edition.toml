caveats       = """
**Supply your own copy:** Community enhancement of the Sonic R PC port. Never sold standalone on Steam, so no `steam_appid`.

**Install:** Launch via `SonicRModManager.exe` after forcing `GE-Proton` (`GE-Proton9-27` confirmed by the community guide); **first Steam launch fails to generate the prefix**.

**Controller:** Gamepad is supported, but by default `L3` (left-stick click) is mapped to `Start` — press it to open Options and rebind controls properly.

**Display:** Set `Windowed Fullscreen` at `1067x800` (4:3) or `1280x800` (16:10) in the mod manager.

**Status:** Test on hardware before marking working. deckport links nothing."""
