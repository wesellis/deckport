caveats       = """
**No ProtonDB tier:** The game was never on Steam, so there is no ProtonDB page or community tier for it. Run as a non-Steam shortcut under Proton; treat compatibility as untested until verified on-device.

**Supply your own copy:** Delisted, retail-only commercial game (never sold on Steam).

**DRM:** Original SafeDisc DRM is broken on modern systems and under Proton; a DRM-free / no-DVD `USM.exe` is **required or the game will not launch**.

**Proton:** Use `GE-Proton`.

**Display:** Strongly recommend ThirteenAG's Widescreen Fix for usable Deck resolution/FOV; it auto-detects resolution and caps at 60 FPS. `FixHUD` trades HUD scaling against the minimap — `1` for clean HUD, `0` for a working minimap.

**Controller:** In-game gamepad support is only partial; add a Steam Input layout to cover the keyboard/mouse gaps.

**Links:** deckport links nothing.
"""
