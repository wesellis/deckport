[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Overview:** 2005 open-world action game (Treyarch; Beenox PC port), retail-only and delisted (never on Steam). Cel-shaded Spider-Man / Venom adventure across Manhattan.

**DRM:** Runs under Proton, but the original retail SafeDisc DRM does **NOT** work on modern systems or under Proton (kernel disc check) — **you must run a DRM-free / no-DVD `USM.exe` in the game folder** (the real game executable is `USM.exe`, ~1.5 MB, installed to `Activision/Ultimate Spider-Man/`).

**Proton:** `GE-Proton` recommended for the SafeDisc-era engine.

**Display:** The game is low-res by default; install ThirteenAG's Ultimate Spider-Man Widescreen Fix (drops into the game folder, loads via the bundled ASI loader) — it auto-adapts to the Deck's native resolution and applies `FPSLimit = 60` and a corrected FOV. It targets `USM.exe` regardless of the fix's `UltimateSpiderMan.WidescreenFix.ini` filename.

**Cosmetic:** `FixHUD` in that ini trades HUD scaling vs the minimap: `FixHUD = 1` scales the HUD correctly but slightly breaks the minimap; `FixHUD = 0` leaves the HUD stretched but keeps the minimap working. Pick whichever bothers you less.

**Controller:** In-game pad support is partial, so add a Steam Input layout (the community profiles cover the keyboard/mouse gaps); the Deck pad is recognized but does not fully map every action natively.
"""

[about]
developer = "Treyarch (Beenox PC port)"
