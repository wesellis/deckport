summary   = "**Ultimate Spider-Man** is a 2005 open-world action-adventure game based on Marvel's **Ultimate** comics line, with story and art by series creators Brian Michael Bendis and Mark Bagley. It renders Manhattan in a striking cel-shaded **\"Comic Inking\"** style and lets players swing through the city as both **Spider-Man** and **Venom** across alternating story missions. Praised for its web-swinging, presentation and comic-book feel, it remains a fan favorite of the era. The PC version was a Beenox port that was **never sold digitally** and is no longer in print."

