caveats       = """
**Prefer Steam:** **Strongly prefer the free Steam version over the itch.io standalone** — it installs and works on Deck with zero configuration.

**itch.io build:** Add the `.exe` as a non-Steam game and force `Proton Experimental`.

**Data files:** No owned data files required.

**Steam tag "Not Supported":** Steam's own Deck status reads "Not Supported," but this is incomplete/strict Valve verification (no Deck button prompts, late-wave perf), not a real blocker — ProtonDB community reports rate it Platinum and it runs out of the box.

**Legal:** Unofficial Hololive fan game — not affiliated with Cover Corp.
"""
