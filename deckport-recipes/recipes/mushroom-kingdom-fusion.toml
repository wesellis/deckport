[game]
title       = "Mushroom Kingdom Fusion"
slug        = "mushroom-kingdom-fusion"
aliases     = ["MKFusion", "MKF"]
type        = "proton"
engine      = "gamemaker"
steam_appid = ""
sgdb_id     = ""

[launch]
binary         = "MKFusion.exe"   # GameMaker exe; matches the MKFusion.ini config it writes
launch_options = "%command%"
requires_files = []

[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**ProtonDB / Deck:** Not on Steam (free fan game), so no ProtonDB rating. The creators state on itch.io that it is **confirmed fully playable in Wine and Proton, including on Steam Deck**. `GE-Proton` is the safest pick for an older GameMaker title; stock `proton_experimental` also works.

**Install method (portable, no installer):** Download from itch.io as `.7z` archives and extract with 7-Zip. You **must grab BOTH** the *"GAME ONLY"* archive and the *"MUSIC ONLY"* archive — extract the Music folder into the game directory or you get no music. Then add the extracted **MKFusion.exe** to Steam as a non-Steam game and force a Proton version.

**Controller:** Native gamepad support (the in-game options menu has controller config). No Steam Input mapping required, though you can add a layout if you want menu navigation on the Deck.

**Note:** The base game name is confirmed via the `MKFusion.ini` settings file it generates; the launcher executable is `MKFusion.exe`.
"""

