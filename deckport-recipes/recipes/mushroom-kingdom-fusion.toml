[about]
developer = "Fusion Fangaming"
publisher = "Fusion Fangaming"
released  = "2008"
genre     = "Platformer"
modes     = "Single-player"
summary   = """
**Mushroom Kingdom Fusion** is a free, non-profit **Mario** fan game that crosses the **Super Mario** formula over with elements from more than 30 other video game franchises, featuring numerous playable characters, hundreds of levels, and a large roster of bosses. Started in 2007 by the developer known as **EddyMRA** (formerly JudgeSpear) and built in **GameMaker** on a heavily modified open-source **Super Mario Bros. 3 'Hello Engine 3'**, it grew into a long-running community project under **Fusion Fangaming**.

The game has had a famously troubled, on-and-off development history but resumed yearly updates, with later builds released through **itch.io**. It is **unofficial and unaffiliated with Nintendo**, and was never sold commercially.
"""

