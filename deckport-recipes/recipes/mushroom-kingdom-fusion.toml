**Free fan game:** by **Fusion Fangaming** (creator **EddyMRA**), distributed on `itch.io` — **unofficial and not affiliated with Nintendo**, never sold commercially.

**Two downloads required:** the *GAME ONLY* archive plus the *MUSIC ONLY* archive (current build V0.93, Rev D hotfix). Missing the music archive = silent game.

**Portable:** No installer — extract the `.7z` and launch `MKFusion.exe`. Add it as a non-Steam game and force `GE-Proton`.
"""
