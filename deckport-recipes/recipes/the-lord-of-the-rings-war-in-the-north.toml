summary   = "**The Lord of the Rings: War in the North** is a 2011 **action role-playing game** by Snowblind Studios, set during the events of the books but following an original trio of heroes fighting Sauron's forces in the largely untold **northern campaign**. It blends hack-and-slash combat with light RPG progression and was built for drop-in **three-player co-op**. Reviews were mixed, praising the visuals and co-op but criticizing the AI and technical rough edges. It was **delisted from Steam in 2019**, most likely because the Tolkien game **license from Middle-earth Enterprises expired**."

