released  = "Standalone 1.0 released 2018; Director's Cut 1.40 (Flathub) ~2021"
genre     = "Survival horror (standalone GZDoom game)"
modes     = "Single-player"
summary   = "**Total Chaos** is a standalone **survival horror** game built on the **GZDoom engine** that ships entirely with its own assets — no copy of Doom or any other commercial game is required. Set on a remote, fog-drenched island (Fort Oasis), it features full **3D models**, a **physical inventory system**, melee and ranged combat, and atmospheric sound design that push GZDoom far beyond its Doom-engine origins. Originally released as a **Doom II total-conversion mod**, a polished standalone version (now the **Director's Cut**) was packaged and published on **Flathub**, making it one of the most accessible GZDoom titles on the **Steam Deck**."

