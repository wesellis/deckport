[game]
title       = "Area 51"
slug        = "area-51"
aliases     = ["Area-51", "Area 51"]
type        = "proton"
engine      = "other"
steam_appid = "1125130"       # the official free Steam re-release
sgdb_id     = ""

[about]
developer = "Midway Studios Austin"
publisher = "Midway"
released  = "2005"
genre     = "First-person shooter"
modes     = "Single-player, multiplayer"
summary   = """
**Area 51** is a 2005 sci-fi **first-person shooter** that loosely remakes Midway's 1995 arcade **light-gun game**. Players control HAZMAT soldier Ethan Cole investigating an alien outbreak at the titular base, gaining **mutant powers** as the story unfolds. The game is notable for its B-movie voice cast, featuring **David Duchovny**, Powers Boothe, and **Marilyn Manson**.

It was later released for free on **Steam** by Midway/Warner Bros., with the original **StarForce DRM** removed from that build."""

[launch]
binary         = "A51.exe"      # confirmed — the launcher exe
launch_options = ""
requires_files = []

[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Game:** 2005 Midway Studios Austin sci-fi FPS (David Duchovny + Marilyn Manson).

**DRM:** This recipe targets the official free Steam re-release (app `1125130`), which already has the old `StarForce` DRM stripped out, so **no DRM workaround is needed**.

**Proton:** DX9 title; launches via `A51.exe`. Force a recent `GE-Proton` (`proton_experimental` also works) for best compatibility.

**Display:** In Video Settings enable `High Detailed Textures`.

**Controller:** The PC port has **no native gamepad support** and is keyboard/mouse only, so on Deck apply a Steam Input gamepad-to-keyboard/mouse layout (an FPS template binds cleanly).

**FOV:** Widescreen is VERT- by default. For a HOR+ field of view, either apply the community "Area 51 HOR+ FOV fix" patch, or hex-edit `A51.exe` at offset `338C20`, changing `92 0A 86 3F` to your desired FOV value.

**Optional mod:** The community **Project Dreamland** mod restores multiplayer, widens FOV, and fixes crashes on modern GPUs, but it adds setup complexity; for a minimal Deck run the stock `A51.exe` plus the FOV fix is enough."""

[[links.guides]]
