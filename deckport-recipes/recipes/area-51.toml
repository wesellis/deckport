[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = ""
caveats       = """
**Supply your own copy:** Use the official free Steam re-release (app `1125130`); `StarForce` DRM is already removed from that build.

**Proton:** Run `A51.exe` under `GE-Proton` and enable `High Detailed Textures`.

**Controller:** **No native controller support** — bind a Steam Input gamepad-to-keyboard/mouse FPS layout on Deck.

**FOV:** Widescreen defaults to VERT- (narrowed FOV on 16:10); optional `A51.exe` hex-edit at offset `338C20` (`92 0A 86 3F`) restores a HOR+ FOV.

**ProtonDB:** Tier not confirmed via an aggregate rating; mark verified after a real Deck run."""
