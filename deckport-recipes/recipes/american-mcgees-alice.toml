winetricks = []
notes      = "On Steam, American McGee's Alice is NOT a standalone app — it ships as the 2011 HD remaster bundled with Alice: Madness Returns (App 19680). The remaster's launcher is Alice1/bin/alice.exe. The recipe's steam_appid points at 19680 because that is the product that delivers the game. Two ways to run the bundled Alice1: (a) launch alice.exe with the -RunningFromAlice2 flag, or (b) install VorpalFix (github.com/Wemino/VorpalFix), which lets alice.exe launch independently and fixes the id Tech 3 widescreen crop, FOV, HUD stretch and FMV warping. VorpalFix is the recommended path on the Deck. For Proton/Linux, add WINEDLLOVERRIDES=\"winmm.dll=n,b\" %command% to the launch options when using VorpalFix's winmm injector. Known quirks running Alice1 standalone: the title screen can appear zoomed/upside-down until you tab through the menu, and some users hit a hang on quit. Xbox controller works via a community Steam Input layout — recommended for this third-person platformer."

[about]
developer = "Rogue Entertainment"
publisher = "Electronic Arts"
released  = "2000"
genre     = "Action-platformer"
modes     = "Single-player"
summary   = "American McGee's Alice is a dark psychological horror action-platformer developed by Rogue Entertainment and published by Electronic Arts in 2000, built on the id Tech 3 (Quake III) engine. The game reimagines Lewis Carroll's Alice in Wonderland as a twisted nightmare, following a traumatized Alice who returns to a corrupted Wonderland to confront the Queen of Hearts and restore her sanity. Featuring imaginative level design, disturbing character redesigns, and fluid platforming combat, it became a cult classic. On Steam there is no standalone listing — the game is delivered as the 2011 HD remaster bundled inside Alice: Madness Returns (App 19680), launched from Alice1/bin/alice.exe."

