caveats       = "Not a standalone Steam app: American McGee's Alice ships as the 2011 HD remaster bundled with Alice: Madness Returns (App 19680), launched from Alice1/bin/alice.exe. To run Alice1 by itself either launch alice.exe with -RunningFromAlice2, or install VorpalFix (github.com/Wemino/VorpalFix) which enables standalone launch and fixes the id Tech 3 widescreen crop/FOV/HUD; VorpalFix is the recommended path. For Proton add WINEDLLOVERRIDES=\"winmm.dll=n,b\" %command% when using VorpalFix. Quirks: title screen can show zoomed/upside-down until you tab through the menu; some users report a hang on quit. Madness Returns itself is Platinum on ProtonDB; tier kept at gold here to reflect the rougher Alice1-standalone experience. Xbox controller works via a community Steam Input layout."
