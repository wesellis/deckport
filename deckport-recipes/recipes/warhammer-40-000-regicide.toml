caveats       = """
**Supply your own copy:** deckport links nothing.

**Delisted:** Delisted from Steam Oct 2022 (no longer for sale). Single-player/offline mode still works, but the **online multiplayer servers are permanently shut down**.

**Proton:** ProtonDB **Gold** — community reports it running on Linux/Proton, so it should play on the Deck, but this specific recipe is **not yet hands-on confirmed** (`needs-test`). Binary is `Regicide.exe`; tested-good Proton is `GE-Proton`.

**Controller:** Cursor-driven UI — if native controller input feels off, use a Steam Input gamepad+trackpad-mouse layout.

**DRM:** No DRM."""
