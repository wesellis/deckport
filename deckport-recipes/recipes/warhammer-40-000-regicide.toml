[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Game:** Delisted Steam game (appid `322910`), turn-based Warhammer 40K chess built in Unity. **Delisted Oct 2022** and the online/multiplayer servers were shut down, but the **single-player/offline mode still works** on existing installs.

**Proton:** ProtonDB **Gold** — runs cleanly under Proton on the Deck. Use `GE-Proton` (or `proton_experimental`). Launch via `Regicide.exe`.

**DRM:** No DRM/GFWL/Denuvo and no `winetricks` needed.

**Controller:** The menus and board are cursor-driven, so if a controller does not feel right, apply a Steam Input gamepad-with-mouse-trackpad layout (right trackpad as mouse, `A` = click) — the Deck trackpads make this play comfortably.

**Online:** Online play is gone; treat it as a single-player title.

**Install:** deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "Hammerfall Publishing"
publisher = "Hammerfall Publishing"
released  = "2015"
genre     = "Turn-based strategy"
modes     = "Single-player, multiplayer"
summary   = """
**Warhammer 40,000: Regicide** is a turn-based strategy game set in Games Workshop's **grimdark sci-fi universe**, blending **chess** with tactical combat between Space Marines and Orks. It offers two modes: **Classic**, which plays as straight chess with 40K-themed pieces, and **Regicide**, which adds an initiative phase where units use ranged attacks and special abilities, with gory, blood-drenched execution animations.

Released in 2015 for Windows, iOS and Android, it was praised for its detailed models and brutal combat presentation, though its single-player campaign was seen as the weakest part. The game was later **delisted from Steam** and its online multiplayer servers were shut down, leaving single-player as the playable mode on existing installs."""

