[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "pending"
caveats       = """
**Supply your own copy:** Delisted commercial game. Mature/AO content.

**No Steam page:** The PC version was never sold on Steam, so there is no Steam appid and no dedicated ProtonDB page; tier is pending community reports.

**Fix:** Install `PluginMH2` in the game root to lift the 30 FPS cap and fix the rough port.

**Display:** Enable `D8VK` (`PROTON_DXVK_D3D8=1`) if textures render black — it is a DirectX 8 game.

**Controller:** No native controller support: bind a Steam Input keyboard/mouse layout.

**Links:** deckport links nothing."""
