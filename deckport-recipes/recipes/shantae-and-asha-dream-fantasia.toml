[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "pending"
caveats       = """
**Free fan game:** Not WayForward/SEGA. No dedicated ProtonDB entry yet (tier pending), but GameMaker exes run well under Proton on Deck.

**Controller:** Don't count on native gamepad detection — multiple players report the pad **isn't recognised at all** in this fan game. Plan on a **Steam Input keyboard layout** as the reliable path (default keys cover everything: arrows/`WASD` move, `Z`/jump, with menu confirm split between `Enter` and `Z`).

**Fix:** If it refuses to launch (a GameMaker Direct3D issue), dropping `dgVoodoo 2` (`D3D8.dll`/`D3DImm.dll`) into the game folder can stabilise it.

**Binary:** `shantae-and-asha.exe` (as stated by the release; the exact GameMaker exe name should be confirmed against your downloaded build before marking working)."""
