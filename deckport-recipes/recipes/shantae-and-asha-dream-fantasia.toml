notes      = """
**Game:** A free fan crossover (XBuster / Wonder x Boy) of Shantae and Monster World IV's Asha, built in **GameMaker Studio** — a 30+ hour open-world 2D action-RPG. Latest build is `v2.1.0` (the older `v2.0.1` is what most mods/guides target).

**Proton:** As a GameMaker Windows `.exe` it runs reliably under Proton on Deck (the official Shantae titles are Gold/Platinum). **Add as a Non-Steam game** pointing at `shantae-and-asha.exe` and force `proton_experimental` (or `GE-Proton` if a menu fails to render).

**Display:** `F4` toggles fullscreen.

**DRM:** No DRM/GFWL — it's a free fan game."""

[about]
developer = "XBuster Zero (Wonder x Boy)"
publisher = "XBuster Zero (Wonder x Boy)"
released  = "2020"
genre     = "Open-world 2D action-platformer / RPG"
modes     = "Single-player"
summary   = """
**Shantae and Asha: Dream Fantasia** is a free fan-made crossover between WayForward's **Shantae** and SEGA's **Monster World IV**, built in **GameMaker Studio** by solo developer XBuster Zero. It is an **open-world 2D action-platformer** with RPG elements, letting players control both **Asha** (a weapons-and-Pepelogoo fighter) and **Shantae** (who relies on magic and transformations) across a large interconnected map.

Set a year after the events of Monster World IV, the two heroines team up to gather ingredients for an elixir. Version 1.0 launched in February 2020 and the project has continued to receive substantial content updates."""

