caveats       = """
**Supply your own copy:** Out of print — supply your own legitimately owned disc/copy;
configuration only, no download links.

**StarForce blocker:** The unpatched retail EXE will not run on Proton — apply the official
Beenox **Patch 1.01** (removes the StarForce disc check) before adding to Steam.

**Binary:** Playable EXE is `game/EvilDead.exe`; `Launcher.exe` in the root is only a config
front-end.

**Controller:** DirectInput-only — map via **Steam Input**.

**Display:** Opens windowed with no widescreen toggle; controls can freeze if no input is
given shortly after launch.
"""

