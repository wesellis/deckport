summary   = "**Hedon Bloodrite** is a commercial 20+ hour old-school **first-person shooter** built on a customised **GZDoom engine fork**, developed and self-published by solo developer **Zan the Bonebreaker**. Set in a dark fantasy world of orcs, demons, and ancient magic, it features **multiple playable characters**, extensive lore, and a gameplay loop that blends arena combat with exploration and RPG elements. Sold on both **itch.io** (DRM-free, includes native Linux build) and Steam, it is one of the most ambitious commercial GZDoom-engine games ever released."

