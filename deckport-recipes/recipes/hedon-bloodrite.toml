notes      = """
**Native on BOTH stores:** Hedon Bloodrite ships a **native Linux binary** — both on `itch.io` (DRM-free) and on Steam (App ID `1072150`, which has a native Linux/SteamOS depot). On Steam Deck it runs **natively, no Proton required**; just install from Steam and launch. If you own the Steam copy, prefer the native build over forcing Proton.

**itch.io install:** Download `Hedon … Linux 64-bit.zip` from `itch.io` (`zanthebonebreaker.itch.io/hedon`), extract, and add the Linux binary as a non-Steam game in Desktop Mode.

**Engine:** The game runs on a `GZDoom` fork bundled with the executable — you do **NOT** need to install `GZDoom` separately; the bundled engine handles everything.

**Controller:** Full controller support is built in.

**Length:** The game is a 20+ hour adventure/FPS with RPG elements.

**Steam version:** The Steam release has a native Linux depot, so it runs without Proton on Deck. Forcing a Proton version is unnecessary and not recommended unless a future update breaks the native build."""

