caveats       = """
**Paid game:** ~$17 on `itch.io`; the Steam release (App ID `1072150`) is often on sale.

**Native Linux on both stores:** Both the Steam and `itch.io` builds include a **native Linux binary**, so the game runs on Steam Deck **without Proton**. The `itch.io` build is additionally DRM-free.

**Engine:** The bundled `GZDoom` fork handles the engine; **no separate GZDoom installation needed**.

**Proton not required:** Because a native Linux depot exists, leave Proton off (Steam default for native titles). Only force a Proton version if a future update ever breaks the native build.

**Controller:** Full controller support built in.

**Length:** 20+ hours of content across the full Bloodrite campaign."""
