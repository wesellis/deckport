**No owned copy needed:** No owned data files required — **fully self-contained free demake**.

**Availability:** Sony filed a copyright claim in 2025 and itch.io **suspended the official download**, so `b0tster.itch.io/bbpsx` no longer serves the files. The recipe covers running a build you already have.

**Install:** Add `BloodbornePSX.exe` from the extracted ZIP as a non-Steam game and force `Proton Experimental`.

**Binary:** Root executable is `BloodbornePSX.exe` (the final release was v1.05).

**Controls:** Native gamepad support; no Steam Input remap needed.

**Note:** Unofficial FromSoftware/Bloodborne fan project by LWMedia, not affiliated with Sony or FromSoftware.
