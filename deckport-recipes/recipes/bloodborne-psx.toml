[proton]
version    = "proton_experimental"
winetricks = []
notes      = """
**Engine:** Windows Unreal Engine 4 build; runs under Proton on Steam Deck.

**Availability:** The creator's official itch.io page is `b0tster.itch.io/bbpsx` (not `/bloodbornepsx`). NOTE: in 2025 Sony filed a copyright claim and itch.io **suspended the download**, so the official page no longer offers the files. If you already have a legitimately-downloaded build, the steps below apply.

**Install:** Extract the ZIP, add `BloodbornePSX.exe` (in the extracted root) as a non-Steam game, and set `Proton Experimental` in `Properties > Compatibility`.

**Proton:** It is a straightforward packaged UE4 game; community reports indicate it runs well under Proton. No verified ProtonDB tier exists (it was never on Steam), so this is `needs-test`.

**Controls:** Native gamepad support (D-pad to move, face buttons for actions); the Steam Deck controller should work without custom Steam Input mappings.

**Data:** No data files from the original Bloodborne are required; this is a **fully original demake** built from scratch.
"""

[about]
developer = "Lilith Walther (b0tster), with Corwyn Prichard"
publisher = "LWMedia (free fan project)"
released  = "2022"
genre     = "Action RPG, Horror, Demake"
modes     = "Single-player"
summary   = "**Bloodborne PSX** is a free fan-made **demake** of FromSoftware's **Bloodborne**, reimagined as if it were a PlayStation 1-era game. Created by solo developer Lilith Walther over 13 months using **Unreal Engine 4**, it captures Bloodborne's gothic Yharnam setting, combat, and atmosphere through a low-polygon, **CRT-filtered** aesthetic. The full version released in January 2022 and was met with strong acclaim for its craftsmanship and fidelity to the source game's tone. It is entirely self-contained with no assets from the original Bloodborne, making it a legal fan work independent of Sony's intellectual property claims."

