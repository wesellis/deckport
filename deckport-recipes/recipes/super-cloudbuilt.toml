verified_on   = ""
contributor   = ""
protondb_tier = "gold"
caveats       = """
**Supply your own copy:** Delisted on Steam (`appid 463700`) since Sept 2021 — **not for sale**. deckport links nothing.

**Proton:** ProtonDB `gold`; community reports it playable under Proton.

**Binary:** Binary name `CloudbuiltSE.exe` is a best guess — **confirm the actual `.exe` in your install's `Binaries` folder**.

**Controller:** Native controller support means Deck controls work without a Steam Input hack.

**Display:** If you see frame-pacing stutter, cap the Deck refresh rate.

**Multiplayer:** Single-player only, so no dead-server concern.

**Status:** Recipe not yet hardware-confirmed on a Deck."""
