genre     = "World War II first-person shooter (standalone GZDoom game)"
modes     = "Single-player"
summary   = "**Wolfenstein: Blade of Agony** is a massive, three-chapter WWII first-person shooter built on the **GZDoom** engine by Tormentor667 and a large community team at realm667.com. It is **completely standalone** — all assets are original, and no copy of Doom, Wolfenstein, or any other commercial game is required. The game spans three full chapters with a linear story told through **in-engine cutscenes**, features original music and artwork, and is considered one of the most ambitious and polished GZDoom **total conversions** ever produced. v3.0 (2021) was the major complete release, with `v3.1` shipping as a later maintenance update (the current Flathub build). Non-commercial fan project, not affiliated with id Software or MachineGames."

