caveats       = """
**Supply your own copy:** Delisted (licensing); configuration only, no links.

**Install:** Prefer the Steam build (`appid 1293830`) over the old Microsoft Store/UWP build for Proton.

**Account:** Requires a one-time online Microsoft account sign-in.

**Proton:** Large download; needs a recent `Proton Experimental` (or `GE-Proton`) — the May 2026 Experimental fixed the SteamOS black-screen-on-boot. Older Proton needs the Desktop-Mode + Windowed-mode workaround.

**Controller:** Native controller support.
"""
