[game]
title       = "Forza Horizon 4"
slug        = "forza-horizon-4"
aliases     = ["Forza Horizon 4", "FH4"]
type        = "proton"
engine      = "other"
steam_appid = "1293830"
sgdb_id     = ""

[launch]
binary         = "ForzaHorizon4.exe"
launch_options = ""
requires_files = []

[proton]
version    = "proton_experimental"
winetricks = []
notes      = """
**Game:** 2018 Playground Games / Microsoft open-world racer.

**DRM:** Delisted in Dec 2024 (expiring car/music licenses) — **bring your own copy**.

**Install:** The Steam build (`appid 1293830`) is the one that behaves under Proton.

**Proton:** As of the May 2026 `Proton Experimental` update, the long-standing SteamOS black-screen-on-boot bug is **FIXED** — use `Proton Experimental` and it should launch straight into Game Mode without Desktop tinkering; it runs ~60fps.

**Fix:** If you hit the black screen on an older Proton: launch once in Desktop Mode, sign into your Microsoft account with an external keyboard/mouse, set the in-game display to Windowed mode, exit, then return to Game Mode. `GE-Proton` or `Proton 7.0-6` also work and are the fallback if multiplayer/login misbehaves.

**Controller:** Native gamepad support — controller works out of the box, no Steam Input layout needed.

**Display:** Initial load can be long, give it time.
"""

