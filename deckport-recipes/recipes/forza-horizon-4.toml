[about]
developer = "Playground Games"
publisher = "Xbox Game Studios"
released  = "2018"
genre     = "Open-world racing"
modes     = "Single-player, online multiplayer"
summary   = "**Forza Horizon 4** is an open-world racing game set in a fictionalised representation of Great Britain, the fourth entry in the **Horizon** spin-off series built on the **ForzaTech** engine. It introduced **dynamic, shared seasons** that change the map and driving conditions, and was widely praised for its scale, visuals and progression. The Steam release in 2018 followed an initial Windows Store launch, and the game was **delisted** from digital stores in December 2024 over **expiring car and music licences**, though existing owners retain offline, online and multiplayer access."

