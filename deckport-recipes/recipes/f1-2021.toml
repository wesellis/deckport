[game]
title       = "F1 2021"
slug        = "f1-2021"
aliases     = []
type        = "proton"
engine      = "other"
steam_appid = "1134570"
sgdb_id     = ""

[launch]
binary         = "F1_2021.exe"   # install root; F1_2021_dx12.exe is the second exe (both render DX12)
launch_options = ""
requires_files = []

[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Delisted:** Delisted Steam game (appid `1134570`, removed from Steam 2023-05-04). ProtonDB tier: silver.

**Proton:** Runs on Proton — `GE-Proton` or `proton_experimental` both work; pick `GE-Proton` if you hit shader/DX12 hitching.

**Binary:** Real binary is `F1_2021.exe` in the install root. There are two exes — `F1_2021.exe` and `F1_2021_dx12.exe` — but the game is DX12-native (there's no true DX11 mode), so both render under DX12; either will launch it.

**DRM:** F1 2021 ships with **Denuvo Anti-Tamper** (unlike F1 2020, it was never removed). Denuvo runs fine under Proton for single-player, so it isn't a blocker, but expect it to be present.

**Controller:** Full native controller + wheel support, so no Steam Input layout is needed.

**Anti-cheat:** **EA's anti-cheat does NOT support Linux/Proton** — online/multiplayer modes will be blocked, but single-player (Career, My Team, Braking Point, Time Trial) plays fine offline. If the anti-cheat splash blocks launch, **run the game in offline mode**.

**Install:** deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "Codemasters"
publisher = "EA Sports"
released  = "2021"
genre     = "Racing simulation"
modes     = "Single-player, online multiplayer"
summary   = "**F1 2021** is the official video game of the 2021 Formula One World Championship and the fourteenth entry in Codemasters' **F1 series**. It was the first F1 title published by EA Sports following Electronic Arts' acquisition of Codemasters, and introduced the cinematic story mode **Braking Point** alongside the returning Career and My Team modes. Built on Codemasters' **EGO engine**, it was well received for its handling and presentation. The game was **delisted from Steam in 2023** when it was superseded by newer F1 titles, and is no longer sold."

