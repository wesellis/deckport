caveats       = """
**Supply your own copy:** deckport links nothing. Delisted from Steam 2023-05-04; not for sale.

**Status:** ProtonDB silver — community reports confirm single-player runs on Linux/Proton on the Deck, so this is needs-test (recipe not yet confirmed end-to-end on a Deck).

**Proton:** Use `GE-Proton` (or `proton_experimental`).

**Binary:** `F1_2021.exe` (a second exe, `F1_2021_dx12.exe`, also exists; the game is DX12-native so both render DX12).

**DRM:** Ships with Denuvo Anti-Tamper — fine under Proton for single-player, just be aware it's present.

**Controller:** Native controller/wheel support — no Steam Input layout required.

**Anti-cheat:** EA anti-cheat is unsupported on Linux, so **online multiplayer is blocked**; play single-player offline."""
