protondb_tier = "platinum"
caveats       = """
**Supply your own copy:** Binary is `windows/Godus.exe` (inside the `windows/` subfolder, not the install root). deckport links nothing.

**Delisted:** Delisted Dec 2023 (servers retired); **owners can still install/play single-player**.

**Proton:** ProtonDB platinum (only a handful of reports / low confidence) — community reports it running cleanly on Linux/Proton, no DRM/winetricks.

**Controller:** Mouse-driven god game with no native gamepad support: needs a Steam Input layout (right trackpad as mouse + buttons for click/zoom) to be playable on Deck.

**Online:** Online/God-Wars multiplayer is dead."""
