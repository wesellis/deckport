[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Delisted:** Delisted Steam game (appid `232810`; pulled Dec 2023 by 22cans after AWS content servers shut down — **existing owners can still install and play**).

**Proton:** Unity god game; main executable is `Godus.exe`, which lives in the `windows/` subfolder of the install dir (`steamapps/common/Godus/windows/Godus.exe`), not the install root. ProtonDB tier platinum (small sample, ~5 reports / low confidence) — community reports it **running out of the box under recent Proton**, no GFWL/SecuROM/DRM and no winetricks needed; `GE-Proton` is a safe default, stock `proton_experimental` also works.

**Controller:** This is a point-and-click, mouse-driven game with no real native gamepad support, so on Deck use a Steam Input layout that maps the right trackpad to the mouse (mouse-region or trackpad-as-mouse) plus a few buttons for left-click/zoom — that controller layout is the intended way to play it handheld.

**Online:** The online/multiplayer ('God Wars') features depend on the retired servers and no longer work; **treat it as single-player only**.

**Install:** deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "22cans"
publisher = "DeNA"
released  = "2013"
genre     = "God game / simulation"
modes     = "Single-player (former online God-Wars multiplayer now defunct)"
summary   = "**Godus** is a god game designed by Peter Molyneux as a spiritual successor to his classic **Populous**, developed by 22cans after a successful 2012 **Kickstarter** (over 17,000 backers, ~£526k raised). Players sculpt the landscape and shepherd a tribe of followers in a **Unity**-built sandbox. Released into Steam Early Access in 2013, it became infamous for unmet Kickstarter promises and was effectively left **unfinished** when 22cans moved on by 2015. Both Godus and Godus Wars were removed from Steam in December 2023 after 22cans declined to update their AWS content servers, though existing owners retain access."

