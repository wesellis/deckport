contributor   = ""
protondb_tier = "silver"
caveats       = """
**Supply your own copy.** deckport links nothing.

**DRM:** Delisted from Steam 2025-01-31; the leftover reseller key listings are not the live Steam store. Single-player game, so no dead-server concern.

**Hard blocker:** On Deck, Games for Windows - LIVE means you **MUST** apply the `xlive.dll` no-GFWL bypass (PCGamingWiki) or the game won't start. Binary is `Republic Heroes.exe`.

**Controller:** Supported natively, so no Steam Input layout is required.

**ProtonDB:** Silver — playable but not flawless (occasional cutscene/menu glitches; install the `xact` winetricks verb if audio drops).

**Needs-test:** ProtonDB confirms it runs, but this exact recipe hasn't been verified on a physical Deck."""
