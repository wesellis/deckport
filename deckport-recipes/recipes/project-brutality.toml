[game]
title       = "Project Brutality"
slug        = "project-brutality"
aliases     = ["PB", "Project Brutality 0.4", "Brutal Doom fork PB"]
type        = "native"        # native Linux via GZDoom Flatpak — no Proton needed
engine      = "gzdoom"
steam_appid = ""
sgdb_id     = ""

[launch]
binary         = "flatpak"
launch_options = "run org.zdoom.GZDoom -iwad doom2.wad -file Project_Brutality.pk3"
requires_files = [
  "Project Brutality archive from GitHub releases or ModDB — GZDoom loads the .zip directly, or rename it to .pk3",
  "Doom II WAD (or Freedoom Phase 2 as a free substitute — freedoom.github.io)",
]

[proton]
version    = ""
winetricks = []
notes      = """
**Install:** GZDoom is installed via Flatpak: `flatpak install flathub org.zdoom.GZDoom`.

**Files:** Download the latest Project Brutality archive from the [GitHub releases](https://github.com/pa1nki113r/Project_Brutality/releases) (source zip) or ModDB. GZDoom loads the `.zip` directly with `-file`, or you can rename it to `.pk3`. Drop it plus your `DOOM2.WAD` (or `freedoom2.wad`) into `~/.var/app/org.zdoom.GZDoom/`.

**Engine:** Project Brutality 0.3.0+ uses ZScript and requires a recent **GZDoom** — it does **not** run on Zandronum. (Older fan-made "PB 3.0" Zandronum ports exist but are unofficial and unrelated to the current project.)

**Controller:** GZDeck is a controller-friendly launcher for GZDoom mods in Steam Game Mode (handy for managing multiple mod+WAD combos on Deck). It is no longer actively developed but still works; add it as a non-Steam game with the `--no-sandbox` launch argument."""

[about]
developer = "PsychoPhobiA and the Project Brutality team"
publisher = "Independently released (free mod)"
released  = "2015 (first release); 10-year anniversary 0.3.0 Alpha June 2025; latest 0.4.1 (2026)"
genre     = "First-person shooter (Doom mod)"
modes     = "Single-player (co-op possible via GZDoom netplay; not Zandronum-compatible)"
summary   = "A fork of **Brutal Doom** that grew into its own distinct project. **Project Brutality** expands significantly beyond its origins with a greatly enlarged **weapon roster**, multiple variants for nearly every monster type, **randomized enemy loadouts** that change each run, and deeper combat mechanics. Received a major **10-year anniversary update** in June 2025 adding substantial new content. Separate from Brutal Doom — the two projects have diverged considerably since the fork and are each worth playing on their own merits."

