[about]
developer = "EA Black Box"
publisher = "Electronic Arts"
released  = "2011"
genre     = "Arcade racing"
modes     = "Single-player, multiplayer"
summary   = "**Need for Speed: The Run** is a 2011 arcade racing game and the eighteenth main installment in the **Need for Speed** series, built on the **Frostbite 2** engine. It frames its campaign around 'The Run', an illegal coast-to-coast street race from San Francisco to New York, and introduced on-foot **quick-time event** sequences alongside the driving. It was **EA Black Box**'s final Need for Speed title before the studio closed in 2013, and reviews were mixed, criticizing the short story mode while praising the presentation and Autolog-driven competition. The PC version was **delisted from Steam in May 2021**."

