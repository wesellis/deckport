caveats       = "Supply your own legally obtained copy of the game. This is NOT the 2019 Bloober Team Blair Witch game (Steam App 1149640). This is Volume III of the 2000 PC anthology trilogy, developed by Ritual Entertainment. Cinematic third-person survival horror built on Terminal Reality's Nocturne engine (the same engine family as Volume I, not a separate isometric engine). It expects keyboard + mouse, so configure Steam Input on Deck; not on Steam, so add the executable as a non-Steam game."
