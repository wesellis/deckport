winetricks = []
notes      = "Add bw3.exe as a non-Steam game (default install path: C:/Program Files (x86)/Ritual Entertainment/Blair Witch Volume Three - Elly Kedward) and set Proton version to GE-Proton. Built on Terminal Reality's Nocturne engine (an enhanced version), the same engine family used for Blair Witch Volume I — it is NOT a separate isometric engine. Developed by Ritual Entertainment (SiN, Quake mission packs), not Black Isle. This is a 3dfx/Voodoo-era DirectX 7 title, so it needs a dgVoodoo wrapper for the legacy renderer and runs at a fixed low internal resolution; see the community Windows-modern fix below. Cinematic third-person survival horror with fixed/dynamic camera angles, so map the right stick/trackpad for camera and use Steam Input for the keyboard+mouse controls this 2000-era title expects. Note: this is the 2000 PC game, NOT the 2019 Bloober Team game (Steam App 1149640)."

[about]
developer = "Ritual Entertainment"
publisher = "Gathering of Developers"
released  = "2000"
genre     = "Action survival horror"
modes     = "Single-player"
summary   = "Blair Witch Volume III: The Elly Kedward Tale is an action survival horror game developed by Ritual Entertainment and published by Gathering of Developers (Take-Two in Europe) in 2000. Set in 1785, it tells the origin story of Elly Kedward, the woman who would become the Blair Witch, following Jonathan Prye, a former priest turned witch-hunter who investigates supernatural events in the early Blair township. It is the third and final entry in the 2000 Blair Witch anthology trilogy and, like Volume I, is built on Terminal Reality's Nocturne engine (here in an enhanced form with real-time dynamic lighting and shadows), played from a cinematic third-person perspective. Combat leans heavily on spell-based magic alongside period weapons such as a flintlock pistol."

