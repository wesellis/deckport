[launch]
binary         = "UnrealEngine3/Binaries/MOHA.exe"
launch_options = "PROTON_USE_D9VK=1 %command%"
requires_files = []

[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Status:** Delisted Steam game (appid `24840`). ProtonDB platinum, runs well single-player on the Deck.

**Proton:** Use `GE-Proton` (community reports `GE-Proton7-20` specifically fixes the General Protection Fault that default/experimental Proton throws on launch).

**Fix:** Real game exe is `UnrealEngine3/Binaries/MOHA.exe`; the `moha_setup.exe` launcher in that same folder **hangs under Proton**, so **rename it** (e.g. `moha_setup.exe` -> `moha_setup.bak`) or point Steam straight at `MOHA.exe`.

**Launch:** `PROTON_USE_D9VK=1 %command%` gives a solid 60fps.

**Display:** Because `moha_setup` is bypassed you can't use the in-game settings UI; edit graphics/resolution in the `.ini` files under `Documents/EA Games/Medal of Honor Airborne(tm)/Config` instead (inside the Proton prefix's emulated Documents folder).

**PhysX:** PhysX-driver fixes you'll see for Windows do **NOT** apply under Proton.
"""

