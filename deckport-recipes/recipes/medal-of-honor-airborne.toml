released  = "2007"
genre     = "First-person shooter"
modes     = "Single-player, multiplayer"
summary   = "**Medal of Honor: Airborne** is a World War II first-person shooter and the eleventh installment in the **Medal of Honor** series, built on a heavily modified **Unreal Engine 3**. Its signature mechanic lets players **parachute** into each of six large open missions and choose their own landing spot, adding flexibility to how each engagement is approached as a paratrooper in the US 82nd Airborne Division. Reviews were generally favorable, praising the airborne insertion gimmick and combat while noting the campaign's short length. The Steam version was **delisted in January 2022**, largely tied to compatibility issues on newer hardware."

[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "platinum"
caveats       = """
**Supply your own copy:** deckport links nothing.

**Single-player:** The draw, and it plays great on Deck (platinum) once configured: `GE-Proton` + rename `moha_setup.exe` + `PROTON_USE_D9VK=1` launch option.

**Display:** The catch is that bypassing `moha_setup` means **no in-game settings menu** — set resolution/graphics by editing the `.ini` files under `Documents/EA Games/Medal of Honor Airborne(tm)/Config` (in the Proton prefix) before first launch.

**Controller:** Native Xbox 360-style controller support is present (the game also shipped on PS3/360), so a gamepad works; bindings live in `Config/MOHAInput.ini` and can be remapped there. If input doesn't bind, fall back to a Steam Input keyboard/mouse layout.

**Multiplayer:** Effectively dead — it required EA Online/GameSpy accounts that are problematic to create and largely defunct, so **treat this as single-player only**.
"""
