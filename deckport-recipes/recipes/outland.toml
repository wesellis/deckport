**Supply your own copy:** deckport links nothing.

**Status:** Delisted Steam game (appid `305050`). ProtonDB **gold**; community reports confirm it runs on Linux/Proton, so it should run on the Deck under `GE-Proton` — **needs a hands-on Deck pass to confirm this exact recipe**.

**Binary:** `Outland.exe` (Windows build).

**Controller:** `DirectInput`-based, so enable **Steam Input** and use a gamepad layout if the in-game controller mapping misbehaves.

**Native:** A native Linux build also exists if you prefer it over Proton."""
