[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Game:** Delisted Steam game (appid `305050`, Housemarque/Ubisoft side-scrolling platformer).

**Proton:** ProtonDB tier **gold** — community reports it running well on Linux/Proton, so it plays on the Deck. Run the Windows build `Outland.exe` under `GE-Proton` (`Proton 8.0+`/Experimental also work).

**DRM:** No `GFWL`, `SecuROM`, or other DRM hurdles.

**Controller:** The game speaks `DirectInput` rather than native `XInput`, so Steam's default gamepad mapping can act flaky — **force a Steam Input gamepad layout for the title** (`Properties > Controller > 'Enable Steam Input'`) and the Deck's built-in controls work fine.

**Native:** A native Linux build also exists (Feb 2015); this recipe configures the Windows-via-Proton path.

**Install:** deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "Housemarque"
publisher = "Ubisoft"
released  = "2014 (PC; originally 2011 on consoles)"
genre     = "Action platformer / Metroidvania"
modes     = "Single-player, online co-op"
summary   = """
**Outland** is a 2D action platformer built around a **polarity-switching** mechanic inspired by the shoot-'em-up **Ikaruga**: the player toggles between blue (light) and red (dark) states to absorb same-colored attacks while damaging opposite-colored enemies, all woven into a **Metroidvania**-style adventure. Developed by Housemarque and published by Ubisoft, it debuted in 2011 on Xbox Live Arcade and PlayStation Network to strong reviews before arriving on PC via Steam in 2014.

The PC release supports a full storyline **online co-op** mode in addition to its single-player campaign. The Steam version was **delisted** in December 2018, briefly relisted in October 2020, and removed from sale again in April 2024."""

