engine      = "other"
steam_appid = "8320"
sgdb_id     = ""

[launch]
binary         = "Bone2v20.exe"   # Telltale Tool engine; main launcher is Bone2v20.exe (Bone1v20.exe is the intro/older build)
launch_options = ""
requires_files = []

[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Game:** Delisted Steam game (appid `8320`), a Telltale Tool point-and-click adventure. **ProtonDB lists platinum, but on low confidence (only a handful of reports)** — treat as promising rather than proven; this is why status is `needs-test`.

**Proton:** Run with `GE-Proton` (`proton_experimental` also works). Binary is `Bone2v20.exe` (the install folder also contains a `Bone2.exe`, but `Bone2v20.exe` is the v2.0 launcher).

**DRM:** The English release ships with **SoftwarePassport/Armadillo** copy protection; that DRM doesn't run on modern Windows/Proton, so a community no-CD/loader fix placed beside the exe is **the usual way to get it launching**. (Some non-English builds, e.g. the Czech/Polish releases, shipped without it.)

**Display:** Native game is 4:3 only — use the **Telltale Custom Resolution Tool** to force a wider mode, otherwise it pillarboxes (fine on the Deck's 16:10 panel).

**Install:** deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "Telltale Games"
publisher = "Telltale Games"
released  = "2006"
genre     = "Point-and-click adventure"
modes     = "Single-player"
summary   = "**Bone: The Great Cow Race** is the second episode in Telltale Games' adventure **series** adapting Jeff Smith's acclaimed **Bone comics**, following the first game, Bone: Out from Boneville (2005). Built on the **Telltale Tool engine**, it adapts the comic's second volume as the Bone cousins get caught up in a rowdy spring-fair cow race. It was one of Telltale's earliest titles before the studio's breakout with **Sam & Max**; the series was never continued because Telltale **lost the Bone license**. The games were delisted from Steam following Telltale's 2018 closure."

