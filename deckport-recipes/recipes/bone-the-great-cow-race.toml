[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "platinum"
caveats       = """
**Supply your own copy.** deckport links nothing.

**Status:** Delisted single-player adventure; **ProtonDB lists platinum but on low confidence (only a few reports)**, so treat it as promising, not proven (status `needs-test` = config confirmed against community evidence, not yet hands-on by us).

**Controller:** This is a mouse-driven point-and-click with **NO native gamepad support** — play it with a Steam Input mouse/trackpad+keyboard layout (right trackpad as mouse, a button mapped to left-click); that covers the whole game.

**DRM:** English build uses **SoftwarePassport/Armadillo** protection, so a no-CD/loader fix next to `Bone2v20.exe` is typically needed before it will launch under Proton.

**Display:** Optional widescreen via the **Telltale Custom Resolution Tool**."""
