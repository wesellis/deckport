caveats       = """
**Supply your own copy:** `deckport` only configures the prefix; supply your own copy. Recipe not yet hardware-verified on a Deck.

**Version:** Delisted original (`appid 61700`) — the still-sold Definitive Edition is a different appid (`2213300`) and is **NOT covered here**.

**Performance:** Community/ProtonDB reports confirm the original runs on Proton/Deck (currently rated **Silver**, with several Gold/Platinum reports); tile-matching puzzle-RPG, so framerate is a non-issue.

**Black screen on save:** Loading a save in **fullscreen** can blank the play field to black-with-gray-vignette while menus still respond. Switch to **windowed mode** (Alt+Enter, or set `SCREEN_WIDTH = 1366` / `SCREEN_HEIGHT = 768` in the game's `userconfig`).

**Controller:** The original PC version has **weak/no native gamepad support** — it's a mouse-and-menu game, so use the Steam Deck's **right trackpad as mouse** (or apply a Steam Input keyboard/mouse-on-controller layout); fully playable that way."""
