[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Version:** Original 2011 PC port (delisted Steam `appid 61700`; the 2023 Definitive Edition / `appid 2213300` is a separate, still-for-sale remaster — **NOT this recipe**). Tile-matching puzzle-RPG.

**DRM:** Steam DRM only — no GFWL/SecuROM.

**Proton:** Runs on Proton; the old 'won't launch' Proton bug (`ValveSoftware/Proton#1515`, 2018) is long resolved on modern `GE-Proton` / `proton_experimental`. Mostly point-and-click/menu-driven, so it plays great on the Deck.

**Install:** If the .exe sits elsewhere in the install, the executable is named `MMClashOfHeroes.exe`.

**Fix (black screen on save load):** The single most common Deck/Proton issue: the game boots and menus respond, but the play field goes **black with a gray vignette when you load a save in fullscreen**. Fix by running in **windowed mode** — toggle with **Alt+Enter**, or edit the `userconfig` file in the game folder to set `SCREEN_WIDTH = 1366` / `SCREEN_HEIGHT = 768`. (Community-confirmed as a fullscreen-rendering mismatch on the Deck's OS.)

**Fix (won't launch):** If it black-screens at boot or refuses to launch, **force `GE-Proton` or `proton_experimental`** and verify the redist deps (`DXSETUP` + `vcredist_x86`) installed into the prefix. The 2018 Proton launch bug (`ValveSoftware/Proton#1515`) no longer reproduces on modern Proton."""

[about]
developer = "Capybara Games"
publisher = "Ubisoft"
released  = "2011"
genre     = "Puzzle role-playing game"
modes     = "Single-player, local and online multiplayer"
summary   = "**Might & Magic: Clash of Heroes** is a **puzzle-RPG** that blends **tile-matching battles** with a story-driven campaign set in the **Might & Magic** universe of Ashan, roughly 40 years before Heroes of Might and Magic V. Originally a 2009 Nintendo DS title by Capybara Games, it was widely acclaimed (including IGN's DS Strategy Game of the Year) and ported to PC, Xbox 360 and PlayStation 3 by Ubisoft in 2011. Players control a roster of heroes across five regions, lining up colored units into formations to launch attacks and defenses against opponents. The original 2011 PC release was later **delisted** from Steam following the 2023 **Definitive Edition** remaster."

