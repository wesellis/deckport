[game]
title       = "Impact Winter"
slug        = "impact-winter"
aliases     = []
type        = "proton"
engine      = "other"
steam_appid = "468000"
sgdb_id     = ""

[launch]
binary         = "Impact Winter.exe"   # Unity build; sits beside "Impact Winter_Data" in the install dir
launch_options = ""
requires_files = []

[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Game:** Delisted Steam game (appid `468000`), Unity survival title by **Mojo Bones** / **Bandai Namco**.

**Proton:** ProtonDB rates it **gold** and it runs well on Deck; `GE-Proton` is the safe pick (stock `Proton Experimental` also works).

**DRM:** **No GFWL/SecuROM/DRM hoops** — it's a plain Unity `.exe`.

**Install:** Launches via `Impact Winter.exe` next to the `Impact Winter_Data` folder.

**Controller:** Support is native (Xbox/DualShock/Logitech `F310`/`F710` all supported per the v2.0 PC controls update), so **no Steam Input keyboard hack needed** — just leave the Deck on the default gamepad layout.

**Note:** deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "Mojo Bones"
publisher = "Bandai Namco Entertainment"
released  = "2017"
genre     = "Survival adventure"
modes     = "Single-player"
summary   = """
**Impact Winter** is a **survival adventure** game set thirty days after a devastating asteroid strike has buried the world in snow. You play as **Jacob Solomon**, leader of a small group sheltering in a ruined church, scavenging the frozen wasteland and managing your companions while a **countdown** ticks toward a possible rescue.

Built in **Unity**, it began as a **Kickstarter** project that was later picked up and published by Bandai Namco. It was **delisted from Steam in December 2020** after the publishing agreement between Mojo Bones and Bandai Namco ended."""

