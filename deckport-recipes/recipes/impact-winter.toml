[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "gold"
caveats       = """
**Supply your own copy.** deckport links nothing.

**Delisted:** Removed from Steam (appid `468000`); ProtonDB **gold**, community reports confirm it runs on Linux/Proton/Deck.

**Online:** Single-player survival game — **no online servers to worry about**.

**Controller:** Native full controller support, so the default Deck gamepad layout is fine.

**Status:** Recipe is config-only and **not yet hand-verified** on a specific Deck (hence `needs-test`).

**Install:** The `Impact Winter.exe` binary name assumes the standard Unity install layout; adjust if your copy differs."""
