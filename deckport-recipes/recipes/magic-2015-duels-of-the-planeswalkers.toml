[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "silver"
caveats       = """
**Supply your own copy:** Delisted Steam game (appid 255420, removed Nov 2020); only previous owners retain it in their library. deckport links nothing.

**Proton:** ProtonDB silver — it runs under Proton but a clean run can take work. Prefer `GE-Proton`, since stock Proton has reports of hanging on the loading screen.

**Controller:** The PC build is menu/mouse-driven (no first-class native PC gamepad support), so apply a **Steam Input gamepad-mouse / keyboard layout** on the Deck for full controller play.

**Multiplayer:** Online multiplayer relied on now-dead servers; only single-player and local/hotseat play is dependable."""
