[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
2004 Reflections / Atari open-world driving-and-shooting game. Delisted, long out of print — **supply your own copy**.

**Proton:** Runs under Proton; `GE-Proton` handles the older codebase most reliably.

**DRM:** The retail release used SafeDisc DRM — disc/no-CD checks can stall under Wine, so **use a clean install and the latest community update before applying mods**.

**Fix:** Strong fix scene: ThirteenAG's Widescreen Fix (drops a `dinput8.dll`-style wrapper next to `driv3r.exe`; requires the game's **Update 2**, which will not install over Update 1 — **reinstall clean, then apply Update 2**) plus an Xbox Particles Fix, texture/skybox fixes, and an optional RTX add-on.

**Display:** After installing the widescreen wrapper, set a Steam launch option that lets Proton load the fix's local proxy DLL — match the override to whatever DLL the release ships (e.g. `WINEDLLOVERRIDES="dinput8=n,b" %command%`).

**Controller:** Native Xbox controller support works out of the box via Steam Input; a controller layout otherwise covers it.
"""

