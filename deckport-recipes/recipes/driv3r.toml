**Supply your own copy:** Delisted / out of print — configuration only, no links.

**DRM:** Retail SafeDisc DRM can hang under Wine — **start from a clean, fully-updated install**.

**Display:** Apply ThirteenAG's Widescreen Fix for modern displays (needs **Update 2**; do not stack on Update 1 — reinstall clean first).

**Launch:** If the widescreen wrapper makes the game refuse to launch, verify the `dinput8` DLL override launch option is set.

**Controller:** Native Xbox gamepad support works via Steam Input.
"""
