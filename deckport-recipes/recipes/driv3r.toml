summary   = "**DRIV3R** is the third installment in the **Driver** series, putting players in the role of undercover FBI agent **John Tanner** as he investigates a car-smuggling ring across recreated versions of Miami, Nice, and Istanbul. It expanded the series with **on-foot sections**, gun combat, and drive-by shooting alongside free-roam and the returning **film-making director mode**. Originally released for consoles in 2004, the PC version followed in March 2005 and reviewed well, though the game is best remembered for the **'Driv3rgate'** review-scoring controversy."

