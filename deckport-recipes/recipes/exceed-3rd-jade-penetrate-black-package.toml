**Supply your own copy:** Delisted Steam shmup (appid `207400`, no longer for sale). deckport links nothing.

**Proton:** Community ProtonDB/Proton-issue reports confirm it runs on Deck/Linux — use `Proton 8.0-2` or `5.13-6`.

**Controller:** **Controller inputs can crash the game on Proton versions after `5.13-6`** — stick to `8.0-2` / `5.13-6` or use a Steam Input keyboard layout if the gamepad path crashes.

**Online:** Single-player offline title, so no server concerns.

**Binary:** Confirm the actual `.exe` name in your install (`eXceed3rd.exe` assumed)."""
