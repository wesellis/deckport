protondb_tier = "bronze"
caveats       = "You must supply your own legally obtained copy of the game — it is not available on Steam or any current storefront. Launch SRALLY.EXE. dgVoodoo2 is required for the game's Direct3D 5 / DirectDraw rendering; place its DLLs (DDraw.dll, D3DImm.dll, D3D8.dll, D3D9.dll) in the game directory before launching. Retail discs use SafeDisc, whose driver does not work under Proton/Wine, so the official v2.1 update or a community no-disc patch is needed to launch without the original disc spinning. The game natively supports legacy gamepads (e.g. Microsoft SideWinder) and steering wheels, but modern controllers are not recognised directly; use Steam Input to map a virtual pad. This is the original 1995/1997 Sega Rally Championship, NOT Sega Rally Revo (Steam App 351920)."
