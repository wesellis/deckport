[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
Use GE-Proton for best compatibility with this 1997 Windows port of the 1995 Sega Model 2 arcade title. The main executable is SRALLY.EXE.

dgVoodoo2 is required to wrap the game's Direct3D 5 / DirectDraw rendering calls — unzip dgVoodoo2 and copy DDraw.dll, D3DImm.dll, D3D8.dll and D3D9.dll (from the MS\\x86 folder) into the game directory, then configure via dgVoodooCpl.exe. Without dgVoodoo2 the game typically crashes or renders incorrectly under modern Proton.

DRM: retail discs use SafeDisc, which relies on a kernel driver that does not function under Proton/Wine (and is also disabled on modern Windows). Applying the official v2.1 update / community no-disc executable patch is the standard legitimate way to launch without the original disc spinning. Apply any patch to a copy you legally own.

This is the original 1995/1997 PC release and is NOT Sega Rally Revo (Steam App 351920), which is a separate, later game.
"""

[about]
developer = "Sega AM3"
publisher = "Sega"
released  = "1997"
genre     = "Arcade Racing"
modes     = "Single-player, Local 2-player"
summary   = "Sega Rally Championship is the PC port of Sega's celebrated 1995 Model 2 arcade rally racer. Players race on classic dirt and tarmac stages including Desert, Forest, Mountain, and Lakeside in a Toyota Celica or Lancia Delta. The game is known for its responsive handling model and iconic soundtrack. This is the original mid-1990s PC release, distinct from the 2007 sequel Sega Rally Revo."

