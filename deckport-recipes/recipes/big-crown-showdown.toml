caveats       = """
**Supply your own copy:** Delisted multiplayer brawler; deckport links nothing.

**Servers:** Online servers are dead (shut down Dec 2022), so online modes are gone — **local-only now**.

**Fix:** To even reach the menu offline you **must** apply the `Assembly-CSharp.dll` hex patch described in the proton notes (offset `128269`, `39 02 -> 00 00`); without it the game can hang on the server check. **Verify the exact byte offset against your build before editing.**

**Once patched:** Gold-tier on Proton with full native 4-pad controller support — great Deck couch game.
"""
