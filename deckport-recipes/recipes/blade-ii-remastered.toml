[game]
title       = "Blade II: Remastered (Fan Made)"
slug        = "blade-ii-remastered"
aliases     = ["Blade 2 Remastered", "Blade II"]
type        = "proton"
engine      = "other"
steam_appid = ""
sgdb_id     = ""

[launch]
binary         = "B2RemasteredSetup.exe"   # installer (from the creator) — run it first; then verify the launched .exe
launch_options = ""
requires_files = []

[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**What it is:** Fan 'remaster' of the 2002 PS2 game Blade II by Mattmatt — the PS2 game running through a bundled portable `PCSX2`, packaged plug-and-play.

**Install:** It installs via `B2RemasteredSetup.exe` (it expects a fixed install path), so **run the installer once before first launch**, then point the recipe at the launched executable.

**Proton:** The Windows wrapper runs under Proton; `GE-Proton` is the most reliable for this kind of bundled-`PCSX2` package.

**Compatibility:** Because it is just `PCSX2` under the hood, the underlying PS2 game itself is highly Deck-compatible (`PCSX2` also runs natively on SteamOS, so an alternative is to skip the wrapper and run the PS2 ISO directly in `PCSX2`).

**Display:** Inside the bundled emulator set the renderer to `Vulkan` and internal resolution to ~2x native (720p) for smooth handheld performance; if the wrapper's GPU renderer struggles under Proton, switch its renderer to `Vulkan` or software."""

[about]
developer = "Mucky Foot Productions"
publisher = "Activision"
released  = "2002"
genre     = "Action beat 'em up"
modes     = "Single-player"
summary   = "**Blade II** is a 2002 **action beat 'em up** based on the Marvel/New Line film, in which the player controls the vampire hunter **Blade** through a story set between the film's events and **Blade: Trinity**. It was the only game produced by UK studio **Mucky Foot Productions** for this license and shipped on **PlayStation 2** and **Xbox**. The game championed a **melee combat system** but was met with largely negative reviews and was a commercial failure, leaving it **long out of print**. This recipe covers a fan-made package that runs the original PS2 release through a bundled portable **PCSX2** emulator."

