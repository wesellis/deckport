[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "pending"
caveats       = """
**Unofficial fan project:** A community remaster by Mattmatt (`@Mattmatt10111`) built on a bundled portable `PCSX2`; install it via `B2RemasteredSetup.exe` before first launch (it expects a fixed install path).

**No ProtonDB entry:** This is a fan package with no Steam app, so there is no real ProtonDB tier — `unrated`. The underlying PS2 Blade II emulates well, but the wrapper itself is untested here; do not assume a rating until someone runs it on Deck.

**Verify binary:** The installer is `B2RemasteredSetup.exe`; the real launched `.exe` after install is **unconfirmed** — verify it and correct `[launch].binary`.

**Controller:** Expected to map the Deck's gamepad to a standard PS2 pad in `PCSX2` with no Steam Input keyboard layout — but this is unverified on Deck; confirm during testing.

**Compatibility:** The underlying PS2 Blade II is well-emulated and Deck-friendly; the wrapper may have an occasional first-launch renderer hiccup, typically fixed by forcing `Vulkan`.

**Fallback:** If the Windows wrapper misbehaves under Proton, run the PS2 ISO directly in native `PCSX2` on SteamOS.

**Note:** deckport describes configuration only."""
