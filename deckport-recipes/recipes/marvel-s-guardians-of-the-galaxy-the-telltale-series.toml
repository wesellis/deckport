[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Delisted:** Delisted Steam game (appid `579950`, retired June 2019 after Telltale's closure). Telltale Tool engine episodic adventure.

**Proton:** ProtonDB rates it **gold** (overall tier; recent reports trend platinum) — it runs well on Linux/Proton with no DRM/GFWL middleware to bypass. Use `GE-Proton` (or `proton_experimental`); no winetricks needed.

**Controller:** Like other late Telltale Tool titles, this game is **picky about gamepad detection** — it only accepts a device the engine sees as a true gamepad (DInput DevType `66069`), so on Windows people often needed x360ce. On Proton this is handled by Proton's built-in Telltale/Yakuza controller-mapping fix, so the Deck pad generally works, but it is **not** effortless native support: if the in-game pad isn't detected, set the controller layout to **Gamepad with Mouse Trackpad** (or a Keyboard/Mouse layout) in Steam Input as a fallback.

**Install:** The launcher .exe is typically `GoG.exe` for this title (Telltale's internal short name for the game), but **confirm the actual executable in your install folder** and adjust if different. No special launch options required.

**DRM:** deckport only configures the prefix; it never bundles or links the game files."""

