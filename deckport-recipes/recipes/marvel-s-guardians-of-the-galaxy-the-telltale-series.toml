caveats       = """
**Supply your own copy:** deckport links nothing.

**Delisted:** Delisted from Steam/GOG/consoles in mid-2019 (Telltale closure) — no longer for sale, single-player so no online dependency.

**Proton:** ProtonDB **gold** — runs well under `Proton`/`GE-Proton` with no DRM or GFWL to work around.

**Controller:** the Telltale Tool engine is **fussy about gamepad detection** (it wants a true DInput gamepad, DevType `66069`). Proton ships a Telltale/Yakuza controller-detection fix so the Deck pad usually works, but it is **not** flawless native support — if the pad isn't picked up in-game, fall back to a **Gamepad with Mouse Trackpad** / Keyboard-Mouse Steam Input layout.

**Install:** Binary listed as `GoG.exe` (Telltale Tool launcher) — confirm against your install.

**NEEDS-TEST:** not yet confirmed on a Deck for this specific recipe."""
