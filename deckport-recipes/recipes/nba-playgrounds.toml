[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Delisted:** Steam game (appid `545270`), removed from Steam October 2018.

**Engine:** Unreal Engine 4 title; real executable is `NBAPlaygrounds\\Binaries\\Win64\\NBAPlaygrounds-Win64-Shipping.exe`.

**Proton:** ProtonDB rates it gold (small sample — ~11 reports, low confidence) and the engine is UE4, so it should run well on the Deck — `GE-Proton` or `proton_experimental` both work.

**DRM:** No GFWL/SecuROM DRM to bypass.

**Controller:** native Xbox/XInput support; the game shows Xbox prompts in-game. On Deck the built-in Steam Input gamepad mapping drives it fine — if a pad isn't detected, set the controller layout to **Gamepad** with the Deck's default template (this replaces the old desktop `x360ce` workaround).

**Install:** deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "Saber Interactive"
publisher = "Mad Dog Games"
released  = "2017"
genre     = "Arcade basketball / sports"
modes     = "Single-player, local multiplayer, online multiplayer"
summary   = "**NBA Playgrounds** is an officially NBA-licensed **arcade basketball** game in the spirit of **NBA Jam** and **NBA Street**, built on **Unreal Engine 4**. Matches are fast-paced **2-on-2** contests that emphasize exaggerated dunks, blocks, and alley-oops, with players unlocking a roster of NBA stars through **card packs** earned in tournaments and exhibition games. It launched in 2017 to a mixed-to-positive reception, praised for its multiplayer but criticized for a slow single-player grind. The game was quietly **delisted** from storefronts in October 2018 after the franchise moved to a new publisher for its sequel."

