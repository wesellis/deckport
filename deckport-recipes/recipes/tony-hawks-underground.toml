caveats       = """
**Supply your own copy:** Out of print, never on Steam digitally (no appid); configuration only, no links.

**PARTYMOD is required:** Run `partypatcher.exe` once to make `THUGPM.exe`, then launch that under `GE-Proton`.

**Controller:** PARTYMOD's SDL2 input layer provides controller support (PS2/Xbox/Gamecube glyphs), so the gamepad works without a special hack (default Gamepad Steam Input layout as fallback).

**Config:** Set controls/resolution in `partyconfig.exe` before first launch.

**Status:** Community confirms THUG1/THUG2 run on Deck via this route, but **not yet hands-on verified** for this recipe."""
