[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "gold"
caveats       = """
**Supply your own copy.** deckport links nothing.

**DRM:** Retail game is dead solo — Ubisoft shut the always-online servers on March 31, 2024 with no official offline mode. Only playable via the fan-made `The Crew Unlimited` (TCU) offline server emulator (Sept 2025).

**Install:** The community confirms it works on the Deck after a fiddly setup: install the game's latest version, install `dotnet 8.0` into the prefix for the TCU launcher, and allow the local server on port `443`.

**Controller:** This is a console racer, so gamepad is native. Community tip is to remove the arrow-key bindings from accelerate/decelerate so the Deck's left stick doesn't double-register Up/Down as throttle; a few users had to disable Steam Input to get the pad working, results vary.

**NEEDS-TEST:** confirm this exact `GE-Proton` + TCU setup on a Deck."""
