[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**DRM:** Delisted always-online Steam game (appid `241560`). Ubisoft killed the servers on March 31, 2024, so the retail game alone is **dead** — there is no offline mode and it will not connect. **Without the emulator this game cannot be launched at all.**

**Fix:** It is only playable again through the fan-made `The Crew Unlimited` (TCU) server emulator (offline mode, released Sept 2025), which runs the game against a local server. With TCU the game runs on the Deck (ProtonDB gold).

**Proton:** Use `GE-Proton`. The TCU launcher needs `dotnet 8.0` in the prefix (`winetricks dotnet8` / `dotnetdesktop8`), and the game/local server communicate over port `443` on `localhost`.

**Install:** deckport only configures the prefix; it never bundles or links the game files."""

