released  = "2014"
genre     = "Open-world racing"
modes     = "Originally always-online single-player and multiplayer; offline single-player restored via the fan-made The Crew Unlimited"
summary   = "**The Crew** is a 2014 **open-world racing** game set in a scaled-down recreation of the **continental United States**, letting players drive freely coast to coast with **RPG-style car progression**. It was built as an **always-online** title with persistent shared-world multiplayer. Ubisoft delisted it in December 2023 and shut down its servers on March 31, 2024, which made the retail game unplayable because it had no offline mode. A community preservation project, **The Crew Unlimited**, restored offline single-player access in September 2025."

