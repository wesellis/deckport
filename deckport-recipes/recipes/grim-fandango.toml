[proton]
version    = "native"
winetricks = []
notes      = "RECOMMENDED PATH: Purchase Grim Fandango Remastered (App 316790) on Steam. It ships a NATIVE Linux build (32-bit ELF binary 'GrimFandango'), which Steam selects automatically on Deck — leave compatibility (Proton) OFF. Double Fine's own Steam Deck guidance lists it as 'Optimal using Linux (Proton version crashes on launch)', so do NOT force Proton/GE-Proton on this title; the native build is the correct and stable path. Proton 10.0-3 improved the Windows build on AMD/Intel GPUs, but native remains recommended. For the original 1998 release with your own data files: install ScummVM via Flatpak (org.scummvm.ScummVM) and use its GrimE engine (formerly ResidualVM) via 'Add Game' pointing to the original data files. The steam_appid above references the Remastered for library linking purposes."

[about]
developer = "LucasArts / Double Fine Productions"
publisher = "LucasArts / Double Fine Productions"
released  = "1998"
genre     = "Point-and-click adventure"
modes     = "Single-player"
summary   = "Grim Fandango is a landmark 1998 adventure game directed by Tim Schafer at LucasArts, blending film noir and Mexican folklore in the Land of the Dead. Players control travel agent Manny Calavera as he uncovers a conspiracy spanning four years of the afterlife journey. The 2015 Remastered edition by Double Fine adds high-resolution backgrounds, reorchestrated music, and tank-free controls. The Remastered version is the recommended way to play and ships a native Linux build that runs directly on the Steam Deck."

