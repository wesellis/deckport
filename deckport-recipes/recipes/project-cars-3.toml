caveats       = """
**Supply your own copy.** deckport links nothing.

**Status:** **ProtonDB platinum** + **Steam Deck Verified**; binary is `pCARS3.exe`.

**Performance:** Some users report the Verified rating is optimistic on performance: expect to drop to Medium/High settings and cap the framerate for a stable 30-40fps on Deck.

**Proton:** Use `proton_experimental` or `GE-Proton`; the older input-loss-after-Alt+Tab issue is fixed in current Proton.

**Controller:** Native gamepad support — no custom Steam Input layout required.

**Online:** Online multiplayer was shut down Feb 24 2026 — single-player career, free play and time trials still work offline."""
