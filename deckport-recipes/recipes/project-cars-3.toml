version    = "proton_experimental"
winetricks = []
notes      = """
**Game:** Delisted Steam game (appid `958400`), removed from sale Aug 24 2025. Main binary is `pCARS3.exe` (Slightly Mad Studios). **ProtonDB platinum** and **Steam Deck Verified**.

**Proton:** Use `proton_experimental` (the Oct 2021+ build fixed the bug where the game ignored controller/keyboard input after Alt+Tab) or current `GE-Proton`.

**DRM:** No DRM/GFWL hoops — **runs cleanly out of the box**. No special launch options or `winetricks` needed.

**Controller:** Native gamepad support, so the Steam Deck's built-in controls work without a custom layout.

**Online:** Online services shut down Feb 24 2026, but the full single-player career, free-play and time-trial modes **remain playable offline**.

**Install:** deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "Slightly Mad Studios"
publisher = "Bandai Namco Entertainment"
released  = "2020"
genre     = "Racing / sim-cade"
modes     = "Single-player career, free play, time trial; online multiplayer (servers retired)"
summary   = "**Project CARS 3** is the third installment in the **Project CARS** racing series from Slightly Mad Studios, published by Bandai Namco. Unlike its sim-focused predecessors, it pivoted toward a more accessible, arcade-leaning **'sim-cade'** style with a structured single-player career, car upgrades and progression. The shift drew a mixed critical reception from fans of the earlier games' realism. It was **removed from sale** on Steam and other digital storefronts in August 2025, and its online services were retired, though the single-player content remains playable offline."

