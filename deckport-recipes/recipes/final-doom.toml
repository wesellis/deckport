[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "gold"
caveats       = """
**Supply your own copy:** deckport links nothing.

**DRM:** Delisted standalone (bundled into Doom II in Aug 2022); **not for sale on its own**. ProtonDB **gold**.

**Proton:** Steam build is the DOS originals under DOSBox — runs through Proton with no special `winetricks`.

**Campaign:** Choose via `-iwad TNT.WAD` or `-iwad PLUTONIA.WAD`.

**Controller:** Default DOSBox build has no native gamepad — either bind a Steam Input keyboard/mouse layout, or use the source-port route (`GZDoom` on the IWADs in `base/`) which has native controller support and better Deck scaling.

**Cosmetic:** Steam's DOS TNT: Evilution ships with a known text-string bug (uses Plutonia's strings) — cosmetic only."""
