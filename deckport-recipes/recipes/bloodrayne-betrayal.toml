engine      = "other"
steam_appid = "281220"
sgdb_id     = ""

[launch]
binary         = "bloodrayne.exe"   # in the game's root install folder (steamapps/common/Blood Rayne Betrayal)
launch_options = ""
requires_files = []

[proton]
version    = "proton_experimental"
winetricks = []
notes      = """
**DRM:** appid `281220`, now shown as `BloodRayne: Betrayal (Legacy)` after the 2021 **Fresh Bites** re-release shipped as a separate product (appid `1373530`). The Legacy Steam page still exists; the Steam release is published by **Ziggurat** (the original 2011 console version was by **Majesco**). No invasive DRM blocker reported.

**Binary:** The real executable is `bloodrayne.exe` in the **root** of the install folder (`steamapps/common/Blood Rayne Betrayal`) — not a `bin/` subfolder, and not `game.exe`.

**Proton:** ProtonDB tier is **platinum** (13 reports, trending and best both platinum, score ~0.72). Note: Valve's March 2023 Proton Experimental BloodRayne fix targeted **Terminal Cut / BloodRayne 2: Terminal Cut**, not this Legacy title — Betrayal Legacy simply runs well on its own under recent Proton. Use `proton_experimental` or `GE-Proton`.

**Controller:** Native Xbox 360 controller support works through `Steam Input`, so the Deck gamepad is detected out of the box with no extra layout needed.

**Display:** Known quirk — selecting **exclusive fullscreen can make the window vanish** (audio keeps playing, screen blanks). Fix: edit `engine.ini` under `drive_c/users/steamuser/AppData/Roaming/Wayforward Technologies/BloodRayne/` in the prefix, set `WindowOption=0`, and set `X`/`Y` to the Deck's resolution (e.g. `X=1280`, `Y=800`). Or just launch in windowed/borderless.

**Install:** deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "WayForward Technologies (original); Abstraction Games (Steam port)"
publisher = "Ziggurat (Steam); Majesco Entertainment (original 2011 console release)"
released  = "2014 (PC/Steam; originally 2011 on Xbox 360 and PlayStation 3)"
genre     = "Action, hack-and-slash, 2D side-scrolling platformer"
modes     = "Single-player"
summary   = "**BloodRayne: Betrayal** is a 2D side-scrolling action platformer in the **BloodRayne** series, a sharp departure from the earlier 3D hack-and-slash entries. Developed by WayForward Technologies and published by Majesco, it follows the **dhampir Rayne** through hand-drawn, **cel-shaded** levels combining brutal melee combat, gunplay, and platforming, and is known for its striking art style and **punishing difficulty**. The original 2011 console release reached PC via Steam in 2014. The standalone Legacy version was superseded in 2021 by the enhanced re-release **BloodRayne Betrayal: Fresh Bites** and is no longer sold."

