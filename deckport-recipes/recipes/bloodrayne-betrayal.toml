contributor   = ""
protondb_tier = "platinum"
caveats       = """
**Supply your own copy.** deckport links nothing.

**DRM:** Legacy edition (appid `281220`) still has a Steam page; the 2021 **Fresh Bites** remaster is a separate product. No invasive DRM blocker reported. Steam release published by Ziggurat.

**Proton:** ProtonDB **platinum** (13 reports). Run under `proton_experimental` or `GE-Proton`. (The 2023 Proton Experimental BloodRayne fix was for the *Terminal Cut* games, not this title.)

**Controller:** Native Xbox 360 controller support is recognized via `Steam Input` on the Deck. Single-player only, no online component to worry about.

**Display:** Watch the fullscreen bug — **exclusive fullscreen can make the window disappear**. Fix: set `WindowOption=0` (and `X`/`Y` to the Deck resolution) in `engine.ini` under `AppData/Roaming/Wayforward Technologies/BloodRayne/` in the prefix, or just use windowed/borderless.

**Binary:** `bloodrayne.exe` in the game's root folder (not `bin/`).

**Status:** Recipe still needs a real Deck confirmation."""
