contributor   = ""
protondb_tier = "gold"
caveats       = """
**Supply your own copy:** deckport links nothing. The launcher is `RealLive.exe` (Key's RealLive engine); double-check the filename against your install before first run.

**Delisted:** Delisted 2022-12-01 (original non-HD release; the HD remaster — appid `623080` — and the newer 'Snow Globe' edition remain on sale, but THIS appid does not).

**Proton:** Community Proton reports are positive (Gold overall, trending Platinum on ProtonDB); not yet confirmed on a Deck by this recipe.

**Controller:** Pure mouse/keyboard kinetic VN — bind a Steam Input layout (mouse-region + click) for full couch play; there is no native gamepad support, only that input mapping is needed.

**Quirks:** RealLive renders at a fixed 4:3 800x600, so scale/pillarbox via Steam's display settings rather than forcing a widescreen resolution. If text glyphs go missing, rely on Proton `corefonts`.

**Offline:** Single-player offline, so no dead-server concern."""
