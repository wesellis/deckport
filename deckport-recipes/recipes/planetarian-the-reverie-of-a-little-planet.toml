[game]
title       = "planetarian ~the reverie of a little planet~"
slug        = "planetarian-the-reverie-of-a-little-planet"
aliases     = []
type        = "proton"
engine      = "other"
steam_appid = "316720"
sgdb_id     = ""

[about]
developer = "Key (Visual Arts)"
publisher = "Sekai Project"
released  = "2014 (Steam English release; original Japanese Windows release 2004)"
genre     = "Visual novel (kinetic novel)"
modes     = "Single-player"
summary   = """
**planetarian** is a post-apocalyptic **kinetic novel** by **Key**, the studio known for **Clannad**, **Kanon** and **Air**. In a ruined, rain-soaked city a scavenger known as 'the junker' shelters in an abandoned planetarium and meets **Yumemi Hoshino**, a still-functioning robot greeter who keeps waiting for customers who will never come.

As a kinetic novel it is purely linear with no player choices and a single ending, told entirely through narration, art and music. It was Key's first title released under the **'KineticNovel'** label and is widely praised for its melancholic yet hopeful tone, and it later spawned an anime series and sequels."""

[launch]
binary         = "RealLive.exe"   # original (non-HD) Steam release runs on Key's RealLive engine; confirm against your install
launch_options = "%command%"
requires_files = []

[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Delisted:** Delisted Steam game (appid `316720`) — the original (non-HD) release of Key's kinetic visual novel, pulled from sale on 2022-12-01 in favour of the HD remaster (separate appid `623080`).

**Engine:** This release runs on Key's **RealLive** engine (the same engine family as the Steam editions of CLANNAD, Kanon and Air), so the launcher in the install folder is `RealLive.exe`, not a `planetarian.exe`. RealLive titles render at a fixed **4:3 800x600**, so leave launch options empty and pillarbox/scale from Steam's per-game display settings rather than forcing a widescreen resolution.

**Proton:** It runs well under Proton on the Deck; `GE-Proton` is the safest choice (latest Proton Experimental also works). RealLive Key games are a long-standing, well-behaved case under Proton.

**Controller:** This is a linear kinetic novel driven entirely by mouse/keyboard, so **use a Steam Input gamepad layout** (mouse-region + click bound to `A`) for couch play; no native controller support is needed.

**Fonts:** If text glyphs go missing, install `corefonts` via Proton's automatic font handling (RealLive games occasionally need a Western/gothic font present in the prefix).

**Install:** deckport only configures the prefix; it never bundles or links the game files."""

