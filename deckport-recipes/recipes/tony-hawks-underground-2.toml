caveats       = """
**No Steam appid:** THUG2 was never on Steam (appid `207210` is the unrelated Tony Hawk's Pro Skater HD), so there is no official ProtonDB rating — tier is `unknown`. It runs as a non-Steam game under Proton.

**Supply your own copy:** 2004 CD-only commercial game — supply your own copy.

**DRM:** Disc release uses **SafeDisc**, which won't run on Win10/11 or Proton without a patched exe; PARTYMOD's `THUG2PM.exe` resolves this.

**Controller:** Stock game needs manual gamepad config. Use **PARTYMOD** for a modern controller-input system (or build a Steam Input gamepad layout as a fallback).

**Display:** Base game is 4:3; PARTYMOD (or ClownJob'd THUG2) adds widescreen at `1280x800`.

**Install:** CD-key prompt on Deck OSK can be finicky — a USB keyboard helps during install.

**Binary:** `THUG2.exe` for the stock game; becomes **`THUG2PM.exe`** after installing PARTYMOD (recommended).

**Status:** Community guides (SteamDeckHQ Classics on Deck) report it runs on Deck under Proton 9.0-4. Not yet independently verified for this recipe."""
