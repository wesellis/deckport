[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Proton:** Neversoft's 2004 skater. It was **never sold on Steam** — the 2004 PC release shipped on CD only, so there's no Steam appid (`207210` is actually Tony Hawk's Pro Skater HD, a different game). Add the installed `THUG2.exe` as a non-Steam game. Community guides report success forcing **Proton 9.0-4**; `GE-Proton` also works.

**Controller:** The stock game needs manual gamepad config and has weak controller support under Proton. Install **PARTYMOD** (partymod-thug2 by PARTYMANX) for a modern SDL2-based input system with proper controller support and configurable button glyphs. After running PARTYMOD's `partypatcher.exe` the game launches from the new **`THUG2PM.exe`**, so point your shortcut/binary at that exe once PARTYMOD is installed.

**Display:** PARTYMOD also adds custom-resolution / widescreen handling (set the Deck's `1280x800`); ClownJob'd THUG2 is an alternative widescreen patch. The base game is 4:3 only.

**DRM:** The disc release uses **SafeDisc**, which does not run on Windows 10/11 (and therefore not under Proton) without a patched executable. PARTYMOD's patched `THUG2PM.exe` resolves this; no GFWL or always-online DRM is involved.

**Install:** If installing from original CDs, the Deck on-screen keyboard can misbehave at the CD-key prompt — a USB keyboard helps."""

[about]
developer = "Neversoft"
publisher = "Activision"
released  = "2004"
genre     = "Skateboarding / sports"
modes     = "Single-player, local and online multiplayer"
summary   = "**Tony Hawk's Underground 2** (subtitled World Destruction Tour) is the sixth entry in Activision's **Tony Hawk's series**, developed by Neversoft on its **in-house engine**. The story mode follows a custom skater who joins Team Hawk or Team Bam on a globe-trotting, prank-filled competition across levels like New Jersey, Berlin, and Sydney. It expanded the first Underground's create-a-skater and goal-driven gameplay with the new **Focus mode** and Sticker Slap, and earned generally favorable reviews. The 2004 PC version shipped on CD and was never released on Steam, so you supply your own disc/copy."

