contributor   = ""
protondb_tier = "gold"
caveats       = """
**Supply your own copy:** deckport links nothing.

**DRM:** Single-player steampunk JRPG (**RPG Maker VX Ace**), delisted from Steam in March 2016 so no longer for sale.

**Proton:** RPG Maker VX Ace games run well under Proton (engine is ProtonDB Gold), but this specific recipe **has not been confirmed on a Deck yet** — `Game.exe` is the standard engine binary, verify it matches your install folder.

**Audio:** If any background track is silent, it was a MIDI file — Proton can't play RGSS3 MIDI; convert the `.mid` tracks in `Audio/BGM` to `.ogg`.

**Controller:** Native keyboard input only, so add a Steam Input gamepad layout (`d-pad` + `A`/`B` mapped to `arrows`/`Z`/`X`) for handheld play."""
