[game]
title       = "WWE 2K22"
slug        = "wwe-2k22"
aliases     = ["WWE 2K22", "WWE2K22"]
type        = "proton"
engine      = "other"
steam_appid = "1255630"
sgdb_id     = ""

[launch]
binary         = "WWE2K22_x64.exe"
launch_options = "RADV_PERFTEST=gpl %command%"
requires_files = []

[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Game:** 2022 Visual Concepts / 2K wrestling game (appid `1255630`). Binary is `WWE2K22_x64.exe` (64-bit; requires an AVX-capable CPU, which the Deck has).

**DRM:** Ships with **Denuvo Anti-Tamper**. This matters on Deck: Denuvo counts each Proton-version change as a new machine activation and will **lock you out for ~24h if you swap Proton builds too often** — so pick ONE Proton and stay on it. (Online servers also went offline Jan 2024 and 2K delisted it from Steam days later — owners keep library access but it's no longer for sale.)

**Proton:** Community reports are genuinely mixed (crash/black-screen-on-launch is common). Pick a single recent build — **Proton Experimental or a `GE-Proton` build** both have working reports (e.g. `GE-Proton7-24`/`7-50` era) — and **do not keep switching** (see Denuvo note above). Verify game files if it crashes on first launch.

**Fix:** Add launch option `RADV_PERFTEST=gpl %command%` to cut shader-compile stutter.

**Install:** Large install (~50 GB).

**Controller:** Native Xbox-style controller support, no Steam Input layout required."""

[about]
developer = "Visual Concepts"
publisher = "2K"
released  = "2022"
genre     = "Professional wrestling / sports"
modes     = "Single-player, local and online multiplayer"
summary   = """
**WWE 2K22** is the entry in the long-running **WWE 2K** wrestling series, built on a **rebuilt engine** after the franchise skipped a year following the poorly received WWE 2K20. It was widely seen as a successful recovery for the series, praised for smoother controls, a large roster, and the return of fan-favorite modes including **MyGM** (General Manager), MyRISE (career), MyFACTION, Showcase, and Universe Mode.

Online and MyFACTION servers were shut down in early 2024 and 2K **delisted** the title from Steam shortly after, leaving existing owners with the offline single-player experience."""

