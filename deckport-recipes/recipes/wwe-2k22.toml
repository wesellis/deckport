[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "silver"
caveats       = """
**Denuvo:** Game uses Denuvo Anti-Tamper. **Don't repeatedly change Proton versions** — Denuvo treats each swap as a new activation and can lock you out for ~24h. Pick one Proton and stick with it.

**Delisted:** Removed from Steam Jan 2024 (servers offline first); existing owners only, no longer for sale.

**Proton:** ProtonDB reports are genuinely mixed (crash/black-screen-on-launch is common) — use a single recent Proton (Experimental or a `GE-Proton` build), verify files, and avoid stock-Proton black-screens.

**Online:** Online/MyFACTION modes are dead (servers gone) so treat as offline single-player.

**Install:** ~50 GB install.

**Display:** For best Deck framerate drop to `1280x720`, Texture/Model quality `Standard`, VSync off, `FSR1` upscaling.

**Licensing:** Wrestler-likeness licensing makes it rights-heavy even as documentation."""
