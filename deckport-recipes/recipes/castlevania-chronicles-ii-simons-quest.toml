caveats       = """
**Supply your own copy:** Free fan remake built in `Clickteam Fusion 2.5` (no Konami game files).

**Licensing:** As an unlicensed fan game on Konami IP it **can be pulled at the rightsholder's request**.

**No Steam appid:** Never sold on Steam, so there is no `steam_appid`.

**Controller:** Native Xbox-controller support means the Deck pad works without a Steam Input layout.

**ProtonDB:** No community ProtonDB entry (it is not a Steam app); compatibility is inferred from its Lutris/Linux listing and the generally Proton-friendly Clickteam Fusion runtime, so **confirm a clean run on your own Deck**.

**Scope:** deckport describes configuration only."""
