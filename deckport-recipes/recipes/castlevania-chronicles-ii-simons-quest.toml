[proton]
version    = "GE-Proton"   # Clickteam Fusion title; lightweight 2D, undemanding
winetricks = []
notes      = """
**Game:** Freeware fan remake of Konami's Castlevania II: Simon's Quest (BMC WarMachine / WarMachine Studios, 2023) — a from-scratch build in `Clickteam Fusion 2.5`, **not Konami's code**.

**Install:** Ships as a single Windows `.exe` with no DRM/GFWL, so **add it as a non-Steam shortcut**, force a Proton runtime, and launch.

**Proton:** `GE-Proton` recommended; `proton_experimental` also works.

**Compatibility:** Clickteam Fusion runtimes are well-behaved under Wine/Proton and this game is lightweight 2D, so it runs out of the box with no `winetricks`. Listed on Lutris as a Linux-runnable title.

**Controller:** Native Xbox-style controller support, so the Deck gamepad works directly — no Steam Input keyboard layout needed (set the controller layout to `Gamepad` if input isn't detected)."""

[about]
developer = "BMC WarMachine (also credited as WarMachine Studios)"
publisher = "BMC WarMachine"
released  = "2023"
genre     = "Action-platformer / Metroidvania"
modes     = "Single-player"
summary   = "A free, from-scratch fan remake of Konami's 1987 NES title **Castlevania II: Simon's Quest**, built in **Clickteam Fusion 2.5** by a solo developer working under the WarMachine Studios name and released in January 2023. It rebuilds the original's open-ended, RPG-flavored quest with overhauled graphics, unique **mansions** with dedicated boss fights, a **gold-based economy**, a slide move, and a remixed metal-and-orchestra soundtrack. Often cited as the kind of modern remake Konami never made for one of the series' most divisive entries, it was well received by **Castlevania** fans and covered by outlets like GamesRadar and Kotaku. As an unlicensed fan project on Konami IP, it is distributed for free and could be pulled at the rightsholder's request."

