[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "pending"
caveats       = """
**Supply your own copy:** A free community mod that needs the base Tony Hawk's American Wasteland — the 2006 Aspyr PC port, which was never on Steam and is out of print — supply your own copy; configuration only, no links.

**Launch:** Launch via the `reTHAWed.exe` custom launcher (set the Lutris/Proton launch target to it, **not the original THAW exe**).

**Controller:** The mod adds flexible controller handling, so a gamepad works out of the box; if inputs misbehave, set the Steam Input layout to `Gamepad with trackpad joystick` to force an Xbox-style mapping.

**Install:** Easiest install route on Deck is a Lutris wine prefix under `GE-Proton` — keep the game outside `Program Files` (e.g. a plain `Tony Hawk's American Wasteland` folder).

**protondb tier:** Marked `unknown` on purpose. THAW isn't on Steam (the 207210 appid is *Tony Hawk's Pro Skater HD*, a different game), and the mod runs via Lutris/non-Steam shortcut, so there is no real ProtonDB rating to cite. Community reports nonetheless describe it running well on Deck under `GE-Proton`/Lutris.
"""
