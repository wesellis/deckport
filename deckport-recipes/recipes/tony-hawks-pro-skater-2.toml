[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Title:** Neversoft's 2000 skater (original PC release), never sold on Steam; the `2395210` Steam listing is the separate **2020 remaster**. The original .exe is `THawk2.exe`.

**Fix:** **Install DCxDemo's community Cumulative Patch** (replaces `THawk2.exe` and hooks via `dinput.dll`) for native widescreen at 32-bit color, uncapped FPS, **XInput controller support**, custom-soundtrack support and the restored rail balance bar.

**Install:** After patching, launch `th2patchlauncher.exe` to set resolution/options, or point the binary at the patched `THawk2.exe`. On Deck the established Pat Hartl guide pairs the patch with **dgVoodoo2** (the original DirectDraw renderer often needs it to display) and recommends **Proton 7.0-4**; `GE-Proton`/`proton_experimental` are also worth trying.

**Alternative fix:** **PARTYMOD (partymanx)** is a newer rewrite (Vulkan renderer + SDL input) with strong modern-controller support, if the Cumulative Patch gives graphics trouble.

**DRM:** No GFWL/SecuROM concerns on this title."""

[about]
developer = "Neversoft"
publisher = "Activision"
released  = "2000"
genre     = "Skateboarding / Sports"
modes     = "Single-player, local multiplayer"
summary   = "**Tony Hawk's Pro Skater 2** is the second entry in Neversoft's landmark **skateboarding series**, with the PC version ported by **LTI Gray Matter** and featuring sharper textures and higher resolution than the PlayStation original. It introduced the **manual**, cash rewards, and the **Create-a-Skater** and **Park Editor** tools, and remains one of the most critically acclaimed games ever made. This recipe covers the **original 2000 PC release**, which is distinct from the separate 2020 **Pro Skater 1 + 2 remaster**."

