caveats       = """
**No ProtonDB rating:** This is the original 2000 PC release, which was never on Steam (`steam_appid` intentionally blank), so it has **no ProtonDB tier** of its own — ProtonDB only covers Steam appids (the `2395210` listing is the separate 2020 remaster). Tier marked `n/a`; treat playability as community-reported via the guides below.

**Supply your own copy:** Original 2000 PC release. The exe is `THawk2.exe`.

**Controller:** The stock build runs **4:3 only with no XInput**. The DCxDemo Cumulative Patch adds XInput, but on Deck most community setups (e.g. the Pat Hartl guide) still drive it via a **Steam Input keyboard layout** plus **dgVoodoo2** for the renderer rather than relying on raw XInput. PARTYMOD instead provides a native modern-controller path.

**Fix:** DCxDemo's Cumulative Patch gives widescreen, uncapped FPS and XInput; pair with dgVoodoo2 on Deck if graphics fail to render. PARTYMOD is the Vulkan-based alternative.

**DRM:** No GFWL or DRM on this release."""
