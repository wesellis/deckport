**Supply your own copy:** Prism Launcher itself is free and open source; **Minecraft Java Edition requires a paid Microsoft/Mojang account** (~$30 one-time purchase).

**Install:** install Prism via Discover/Flathub (`org.prismlauncher.PrismLauncher`). After first launch, add your Microsoft account, create an instance, then install the `Controlify` mod for controller support.

**Performance:** `Fabric + Sodium` recommended for best Deck performance.

**Mods:** full modpack support available."""
