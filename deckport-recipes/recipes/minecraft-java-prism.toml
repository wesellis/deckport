summary   = """
**Prism Launcher** is a free open-source **Minecraft Java Edition** launcher with an official Steam Deck download page at prismlauncher.org/download/steam-deck/. Install via Discover (Flathub: `org.prismlauncher.PrismLauncher`), add your Microsoft/Mojang account, create a Minecraft instance, and install the **Controlify** mod for Steam Deck controller support.

Supports all **mod loaders** (Fabric, Forge, Quilt, NeoForge) and the full range of modpacks. The official Deck download page covers install/artwork; controller setup is documented on the separate **Controller Support** wiki page (Controlify is recommended on Fabric/Quilt for Minecraft 1.19.4+). **Fabric + Sodium** gives the best performance on Deck hardware."""

