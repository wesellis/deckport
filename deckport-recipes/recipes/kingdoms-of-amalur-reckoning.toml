**Supply your own copy:** deckport links nothing.

**DRM:** Original Reckoning (`appid 102500`) was delisted in July 2020 ahead of the Re-Reckoning remake — **no longer for sale**. ProtonDB Platinum / Deck-Verified Playable.

**Proton:** Pin Proton to `6.3-8` — `Proton 7.0+` has a mouse-steering bug during conversations and indoors.

**Controller:** Native Xinput controller support — no Steam Input layout hack required.

**Display:** Optional external `Widescreen Fixer` for FOV, but not needed at the Deck's native 16:10.

**Server:** Single-player only, so no server concerns.
