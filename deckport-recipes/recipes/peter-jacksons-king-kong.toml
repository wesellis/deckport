caveats       = """
**Supply your own copy:** Delisted (film license, `appid 209910`) — configuration only.

**DRM:** The **StarForce 3 DRM** on the Signature/Standard Edition will **NOT** launch under Proton until you apply **WIFIDarthMaul's Signature Edition Fix** (it removes the StarForce dependency and fixes the directory-detection error).

**Install:** Add the bundled `King Kong.bat` as a non-Steam game and force `GE-Proton`.

**Display:** Add **ThirteenAG's Widescreen Fix** and use its built-in frame-limiter to avoid the high-framerate speed-up bug.

**Controller:** Native gamepad handling is unreliable (black-screen reports with some Xbox pads, and no in-game Jack/Kong control-swap). Apply the fix author's Steam Input **Community Layout** instead of relying on native input.

**Unverified:** ProtonDB tier inferred from community reports, not yet Deck-verified — confirm on hardware."""
