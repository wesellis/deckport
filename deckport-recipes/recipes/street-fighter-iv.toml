verified_on   = ""
contributor   = ""
protondb_tier = "gold"
caveats       = """
**Supply your own copy.** deckport links nothing.

**DRM:** Delisted GFWL edition (`appid 21660`). ProtonDB gold, community reports it running on Linux/Proton.

**Proton:** Use `GE-Proton` — vanilla `Proton`/`Experimental` can choke on the GFWL sign-in.

**GFWL:** Needs the offline-profile / `Escape`-past-key-prompt workaround for single player. **Online ranked matchmaking is long dead**, so treat this as a local/offline + couch-versus title.

**Controller:** Works out of the box (built for gamepads); if the in-game pad mapping is awkward, apply a Steam Input layout.

**Status:** Binary `StreetFighterIV.exe` not Deck-confirmed in this exact recipe — needs a hands-on test."""
