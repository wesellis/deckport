[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Title:** Delisted Steam game (`appid 21660`) — the original Games for Windows LIVE (**GFWL**) edition, removed from sale. The later **Ultra Street Fighter IV** (`appid 45760`) is a separate title.

**Proton:** Use `GE-Proton`: it bundles the GFWL components and handles this title far better than vanilla `Proton`/`Experimental` (older vanilla Proton has been reported black-screening at the GFWL launcher). ProtonDB's current aggregate tier is **gold** (some recent reports trend platinum, but gold is the honest baseline). Main binary is `StreetFighterIV.exe`.

**GFWL:** At launch the GFWL overlay will try to connect and fail. **Create a LOCAL profile (offline sign-in)** or, if it demands a serial key, dismiss the prompt with `Escape` to reach the game — single-player works fully offline. A more permanent community fix is to neutralize the bundled GFWL DLL with a no-op stub so the overlay never blocks startup.

**Install:** No download links here; **supply your own copy**."""

[about]
developer = "Capcom, Dimps"
publisher = "Capcom"
released  = "2009"
genre     = "Fighting"
modes     = "Single-player, local versus, online multiplayer"
summary   = "**Street Fighter IV** is a 2D fighting game developed by Capcom and Dimps, marking the mainline **series'** return after a long hiatus. It renders fighters with **3D models** while keeping the traditional 2D plane and competitive mechanics, and introduced systems like **Focus Attacks** and **Ultra Combos**. The game was a critical and commercial success, earning universal acclaim and revitalizing the fighting-game genre. This original **Games for Windows LIVE** PC edition was delisted from Steam in 2021 due to its **outdated GFWL backend** and has not returned to sale."

