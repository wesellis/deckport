summary   = "**Transformers: Revenge of the Fallen** is a 2009 **third-person action** game based on the second live-action film, developed by **Luxoflux** and ported to PC by **Beenox**. Players fight through separate **Autobot and Decepticon campaigns**, switching between robot and vehicle forms in fast, arcade-style combat. The PC version shipped only on retail disc (never on Steam) and uses **SecuROM** DRM. Its online multiplayer ran on an Activision master server that was retired in April 2020, leaving the single-player campaigns as the draw. It is remembered as a serviceable but rough movie tie-in."

