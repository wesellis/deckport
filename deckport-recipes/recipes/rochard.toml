summary   = "**Rochard** is a 2D side-scrolling puzzle-platformer set in three-dimensional sci-fi environments, built in the **Unity engine**. You play as John Rochard, an unlucky asteroid miner who uncovers a mysterious alien artifact, and solve physics-based puzzles and light combat using the **G-Lifter**, a gravity gun that lifts heavy objects and lets you manipulate gravity to reach new heights. It was well received for its inventive gravity mechanics and humor, and was notable as one of the first **PlayStation 3** games to use the Unity engine. It was later **delisted** from storefronts following developer Recoil Games' closure."

