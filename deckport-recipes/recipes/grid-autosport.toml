[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "gold"
caveats       = """
**Supply your own copy:** Delisted from Steam July 2020 (appid `255220`) — no longer for sale, but owners can still install and play. deckport links nothing.

**Compatibility:** Steam Deck **Verified** and ProtonDB **gold** — native gamepad support, so no controller remap needed.

**Don't use the native Linux build on Deck:** The Feral native port is Nvidia-GPU only and won't run on the Deck's AMD APU. Run the Windows build through Proton instead (recipe `type = "proton"`).

**Proton:** Some users hit Proton 9 startup crashes. The `PROTON_DISABLE_NVAPI=1 %command%` launch option (set in this recipe) is the reliable fix; otherwise drop to `Proton 8.0-5`.

**Fix:** Logo-stuck startup is also fixable with `LANG=C %command%`.

**Binary:** `GRIDAutosport.exe` (Codemasters), confirmed; an AVX variant `GRIDAutosport_avx.exe` also exists."""
