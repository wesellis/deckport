[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "gold"
caveats       = """
**Supply your own copy.** deckport links nothing.

**Delisted:** Delisted (`appid 2700`, removed May 2018); the Complete Edition re-release is a separate product.

**Proton:** ProtonDB **gold** — community reports it runs on Linux/Proton, so it should play on the Deck (needs a hands-on Deck pass to confirm).

**Controller:** No native controller support: it is a mouse+keyboard park sim, so set up a **Steam Input** gamepad layout (trackpad-as-mouse + on-screen/keyboard binds) — fully playable on Deck that way, just not plug-and-play.

**Fix:** If Shift-to-elevate placement misbehaves, add `PROTON_USE_WINED3D=1`.

**Display:** Pick a Deck-friendly resolution via `Options.txt`; CoasterCam is locked 5:4 and stretches in widescreen."""
