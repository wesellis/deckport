caveats       = """
**Supply your own copy:** Windows binary is `F13.exe` per Steam's launch config; confirm it in your install. deckport links nothing.

**Compatibility:** Delisted (licensing) but ProtonDB **gold** — community reports confirm it runs on Linux/Proton, so it should be smooth on the Deck.

**Controller:** Native gamepad support (the game even has a hidden Jason unlocked via a gamepad button sequence), so it's fully playable with Deck controls out of the box; no Steam Input layout needed.

**Offline:** Single-player puzzle game — no online servers to worry about."""
