[launch]
binary         = "Sonic the Hedgehog.exe"
launch_options = ""
requires_files = []

[proton]
version    = "GE-Proton8-3"
winetricks = []
notes      = """
**Proton:** Windows-only Unity build; runs well on Deck via `GE-Proton`. **`GE-Proton8-3` (or newer GE builds) is strongly recommended** — vanilla Proton omits the media codecs needed for the animated main-menu background, causing a checkerboard pattern.

**Install:** In Desktop Mode, download the latest release ZIP from ChaosX's official link (posted in the **Sonic the Hedgehog P-06** Steam group / ChaosX's social channels — distribution is via Google Drive, there is no official itch.io page). Extract to a flat folder, then right-click `Sonic the Hedgehog.exe` and Add to Steam.

**Fix:** Force `GE-Proton` via the game's Compatibility settings in Steam.

**Display:** Performance on Deck targets a stable **40 FPS**; some open-world stages may dip."""

[about]
developer = "ChaosX"
publisher = "Independently released (free fan game)"
released  = "2019 (ongoing updates)"
genre     = "Action platformer"
modes     = "Single-player"
summary   = """
**Sonic P-06** is a complete fan remake of the infamously rushed **Sonic the Hedgehog (2006)** built from scratch in **Unity** by solo developer **ChaosX** over several years. Where the original 2006 title was shipped unfinished with severe performance and collision problems, P-06 rebuilds every character, stage, and mechanic with tight controls, stable framerates, and numerous quality-of-life improvements.

Released in **episodic character-focused drops** (Sonic, Shadow, Silver), it has earned wide praise from the **Sonic** community as a redemption arc for one of the franchise's most controversial entries. The project requires no files from the original game and is entirely **self-contained**."""

