[game]
title       = "Dirt Rally"
slug        = "dirt-rally"
aliases     = []
type        = "proton"
engine      = "other"
steam_appid = "310560"
sgdb_id     = ""

[launch]
binary         = "drt.exe"   # Windows build executable (root of the install dir). Native Linux binary is bin/DirtRally
launch_options = "%command%"
requires_files = []

[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**DRM:** Delisted Steam game (appid `310560`), delisted Nov 9 2022 by Codemasters. Steam ownership still installs and plays normally.

**Native Linux:** This title has an official native Linux/SteamOS port by **Feral Interactive** (released March 2 2017). If you own it on Steam the native build is the smoothest path on Deck — the binary is `bin/DirtRally`. Many systems run it out of the box, but if it fails to launch with a missing-library error (e.g. `libSDL2`), opt into the **`feraldirtsupport`** beta branch under the game's Steam *Properties → Betas* so it finds its bundled libraries.

**Proton (Windows build):** If you instead run the Windows copy under Proton, **launch the root `drt.exe` (NOT the launcher)** with `GE-Proton` or `Proton Experimental` — both are reported to launch with no extra tinkering.

**Fixes:** Community ProtonDB rates it **gold / playable on Deck**. If it stalls on launch, **disable the in-game Steam overlay**. One reported CPU-related crash was resolved by limiting cores with `WINE_CPU_TOPOLOGY=8 %command%`.

**Install:** deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "Codemasters"
publisher = "Codemasters"
released  = "2015"
genre     = "Rally racing simulation"
modes     = "Single-player, online multiplayer"
summary   = "**DiRT Rally** is a rally and rallycross racing simulation from **Codemasters**, the studio behind the long-running **Colin McRae** and **DiRT series**. It launched into Steam Early Access in April 2015 and saw a full release on December 7, 2015, earning praise for its demanding, **simulation-focused handling model** and detailed stage and weather systems. It was followed by DiRT Rally 2.0 in 2019. The game was **delisted from digital storefronts** on November 9, 2022."

