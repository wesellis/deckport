[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "gold"
caveats       = """
**Supply your own copy:** Delisted Nov 9 2022 (Codemasters); deckport links nothing. Existing Steam owners can still install and play.

**Two ways to run on Deck:** (1) **native Linux build** (Feral Interactive port, binary `bin/DirtRally`) needs no Proton and is usually the smoothest path — if it fails to start with a missing-library error, opt into the `feraldirtsupport` Steam beta branch (Properties → Betas) so it finds its bundled libraries; (2) **Windows build** under `GE-Proton` / `Proton Experimental`, launching the root `drt.exe` (not the launcher).

**Controller:** Native gamepad support — works out of the box, no custom Steam Input layout needed.

**Fixes:** Community ProtonDB reports it gold/playable on Deck. If it hangs on launch, **turn off the in-game Steam overlay**. A reported CPU crash was fixed with `WINE_CPU_TOPOLOGY=8 %command%`.

**NEEDS-TEST:** Confirmed running by the community, but this exact recipe is unverified on a Deck."""
