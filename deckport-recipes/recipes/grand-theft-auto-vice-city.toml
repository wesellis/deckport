genre     = "Action-adventure, open world"
modes     = "Single-player"
summary   = "**Grand Theft Auto: Vice City** is an open-world action-adventure game and the sixth title in the **Grand Theft Auto** series, built on the **RenderWare** engine. Set in a 1986 Miami-inspired city, it follows mob enforcer **Tommy Vercetti** as he builds a criminal empire across a neon-soaked, 80s-themed map. A critical and commercial landmark, it was widely praised for its setting, **soundtrack**, and voice cast. The original classic release was delisted from Steam after Rockstar replaced it with the separately listed **Definitive Edition** remaster."

[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "gold"
caveats       = """
**Supply your own copy.** deckport links nothing.

**DRM:** Original classic GTA: Vice City (delisted appid `12110`; the in-store Definitive Edition is a different game).

**Display:** ProtonDB gold; community reports it running on Deck at ~60fps (try 720p + FSR upscale to 1080p docked).

**Frame-rate quirk:** An FPS cap of 30/60 breaks mouse aiming — **set FPS to unlimited and enable vsync.**

**Controller:** Works (XInput; GInput for proper prompts, or a Steam Input layout).

**Fix:** Needs the `d3d8` launch override above for the widescreen fix wrapper.
"""
