caveats       = "Not a Steam title, so there is no official ProtonDB rating; these simple DirectX card games generally run under GE-Proton but should be treated as untested. Three separate installs/executables: Yugi_Pc.exe (Yugi the Destiny), Kaiba_Pc.exe (Kaiba the Revenge), Joey_Pc.exe (Joey the Passion) — set the binary to whichever you are launching. Mouse-only: no native gamepad, use the right trackpad as a mouse and a desktop/mouse controller layout. Original retail discs used CD copy protection that does not work under Proton, so the install must already be disc-check-free. For a combined card pool, the community Power of Chaos Trilogy AiO mod (ModDB) is a separate modded client, not a patch to the retail games."
