contributor   = ""
protondb_tier = "silver"
caveats       = """
**Supply your own copy:** deckport links nothing.

**Verification:** ProtonDB silver; community reports confirm it runs on Linux/Proton/Deck, but this specific recipe is **not yet hands-on Deck-verified**.

**Controller:** No native controller support — map the right trackpad/gyro to mouse + a click button via Steam Input (works because it's an idle/clicker, not a precision game).

**Offline:** Largely offline/single-player idle game, so server shutdown is not a concern.
"""
