[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Game:** Human Head's 2006 `id Tech 4` shooter (the original **Prey**, not the 2017 Arkane game), Steam appid `3970`, delisted 2009-12-28.

**Proton:** `id Tech 4` titles run well under Proton; community reports it **runs out of the box on Deck** and supports the `1280x800` panel natively. `GE-Proton` recommended; `proton_experimental` also works.

**Display:** To force a resolution edit `preyconfig.cfg` in the install's `base/` folder: `seta r_customWidth "1280"`, `seta r_customHeight "800"`, `seta r_mode "-1"`.

**DRM:** No `GFWL`/`SecuROM` concerns reported on the Steam build."""

[about]
developer = "Human Head Studios"
publisher = "2K Games"
released  = "2006"
genre     = "First-person shooter"
modes     = "Single-player, multiplayer"
summary   = "**Prey** is a first-person shooter developed by Human Head Studios (under contract for 3D Realms) and published by 2K Games in 2006. Built on a heavily modified **id Tech 4** engine, it is best known for its inventive use of **portals** and variable/walkable-wall **gravity** to build disorienting alien environments. The player follows Cherokee garage mechanic Tommy aboard a living spacecraft called the Sphere. The game was well received (Metacritic 83 on PC) and won PC Gamer US 2006 awards, though its multiplayer was criticized for offering only two modes."

