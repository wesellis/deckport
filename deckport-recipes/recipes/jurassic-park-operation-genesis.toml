[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = ""
caveats       = """
- Launcher is SimJP.exe (not "JPOG.exe") under .../Blue Tongue Software/Jurassic Park
  Operation Genesis/JPOG/.
- Supply your own copy — disc or personal disc image only; no legal digital storefront exists
  (not on Steam or GOG).
- SafeDisc DRM: the disc check fails under Wine/Proton (and on Windows 10+), so a PCGamingWiki
  disc-check fix (replacement SimJP.exe) is required for disc-free operation. Use only methods
  documented on PCGamingWiki.
- SteamDeckHQ's verified path is Lutris with Wine-GE 8-26 and DXVK pinned to 2.3.1; newer DXVK
  builds did not work. There is no Steam/ProtonDB entry, so protondb_tier is left blank.
- No native controller support — mouse + keyboard only; map a virtual mouse via Steam Input.
- Resolution MUST be set via Options.ini before first launch — the in-game picker will not
  list 1280x800 and will default to 800x600.
- Minor camera stutter when panning quickly over large dino-populated areas is an engine limit,
  not a Proton bug — cannot be fixed by tweaking settings.
- Intro logo video may not play under Proton; press Escape or Space to skip past it.
- Crash-to-desktop on certain visitor feedback pop-ups is a known original game bug (reproducible
  on Windows); save frequently.
"""
