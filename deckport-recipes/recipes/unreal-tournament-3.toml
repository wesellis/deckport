[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "gold"
caveats       = """
**Supply your own copy:** Delisted commercial game.

**Controller:** No usable native gamepad support on this build — apply the Steam Input `Keyboard (WASD) + Mouse` template for menus and aiming, then lower the look sensitivity to help with aim.

**Fix:** Do the resolution + V-Sync set-then-relaunch step on first boot to clear the foliage-texture and frame-pacing glitch.

**Crashes:** Rare random crashes (alt-tab / launch) are reported on some configs.

**Black screen on first start:** If the first launch shows only a black screen, run once with `-windowed`, pick the native resolution, then relaunch without `-windowed`."""
