caveats       = """
**Supply your own copy.** deckport links nothing.

**Fix:** Requires `GE-Proton` — stock Valve Proton fails on this game's Easy Anti-Cheat. Force `GE-Proton` in the game's compatibility settings.

**Online:** Permanently dead (servers shut down 2022-08-24); only single-player and LAN remain.

**Controller:** Native gamepad support, no controller hack needed.

**Status:** Recipe reflects community Deck reports but has **not been confirmed on a Deck** by this project."""
