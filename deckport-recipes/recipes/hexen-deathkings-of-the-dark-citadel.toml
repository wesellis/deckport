[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Game:** Delisted Steam game (appid `2370`), the only official expansion for **Hexen: Beyond Heretic**.

**Proton:** The stock Steam build is the DOS game wrapped in bundled DOSBox (`DOSBox.exe`) — Raven never shipped a native Windows port. It runs under **Proton**/`GE-Proton` on the Deck and is community-rated **ProtonDB Gold** (appid `2370`). Note: the official **Steam Deck Verified** badge applies to the 2025 Nightdive *Heretic + Hexen* re-release, not this delisted DOSBox standalone.

**Recommended:** Modern path — drop a `GZDoom` build into the install folder, rename the bundled `dosbox` folder to `dosboxold` and the `GZDoom` folder/exe to `dosbox` so the Steam entry boots `GZDoom` instead — gives mouselook, widescreen and a built-in Xbox-style gamepad layout.

**WADs:** `GZDoom` needs `HEXDD.WAD` (the expansion) alongside the base `HEXEN.WAD`.

**Install:** deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "Raven Software"
publisher = "id Software"
released  = "1996"
genre     = "First-person shooter"
modes     = "Single-player, multiplayer co-op and deathmatch (up to 8 players)"
summary   = "**Deathkings of the Dark Citadel** is the only official expansion pack for **Hexen: Beyond Heretic**, the 1995 dark-fantasy FPS that Raven Software built on a heavily modified **Doom engine** and the second entry in the **Serpent Riders** trilogy. It adds 20 new single-player levels across three hubs plus six deathmatch maps, retaining the three playable classes (Fighter, Cleric, Mage) and the non-linear **hub-based progression** Hexen helped popularize. The base game was well received for its level design and class variety. This standalone Steam release (appid 2370) is **delisted**, ships the DOS version wrapped in DOSBox, and is superseded for new buyers by a 2025 Nightdive remaster bundle."

