[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "gold"
caveats       = """
**Supply your own copy:** deckport links nothing.

**Status:** Delisted Steam game (appid `2370`); community **ProtonDB Gold** reports confirm it runs on Deck. (The official **Steam Deck Verified** badge belongs to the 2025 Nightdive *Heretic + Hexen* re-release, not this old DOSBox standalone.)

**Controller:** Stock build = DOS game in bundled DOSBox under Proton; works but the DOS controls are keyboard-centric — for proper Deck input either bind a Steam Input keyboard/mouse layout to the DOSBox build, or switch to the `GZDoom` path (rename `dosbox` -> `dosboxold`, `GZDoom` -> `dosbox`) which has a native Xbox-style controller layout, mouselook and widescreen.

**WADs:** Launch the expansion with `-iwad HEXDD.WAD`; the base `HEXEN.WAD` assets must also be present (Deathkings is an expansion to the base game).

**Music note:** The Steam build ships the v1.0 `HEXDD.WAD`, which lacks the music-track links — expansion levels play silently. Communities note a v1.1 update fixes this; applying it is the common remedy.

**DRM:** No DRM/GFWL (DOS-era game).

**Note:** A 2025 Nightdive 'definitive' Heretic+Hexen re-release exists with modern controller support built in."""
