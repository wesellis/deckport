[about]
developer = "FuturLab"
publisher = "Curve Digital"
released  = "2020"
genre     = "Puzzle / Strategy"
modes     = "Single-player"
summary   = "**Peaky Blinders: Mastermind** is a puzzle-strategy game based on the **Peaky Blinders** TV series, set just before the events of Series 1. The player controls members of the Shelby crime family and solves levels using a **time-manipulation mechanic**: actions performed by one character are recorded on a timeline that can be rewound and replayed, then layered with the actions of other characters to execute coordinated heists.\n\nBuilt in **Unreal Engine 4** by **FuturLab**, it received mixed reviews praising the clever tactical loop but criticizing its short campaign. It was delisted in 2024 after the show's **TV licence** expired."

