**Game:** Unreal Engine 4 puzzle/stealth game by FuturLab.

**Proton:** ProtonDB rates it **platinum**: runs out of the box on Linux/Proton with no `DRM`, `GFWL`, or `SecuROM` to bypass. Use `GE-Proton` (or stock `proton_experimental` / `Proton 7.0+`); **no launch options or winetricks needed**.

**Install:** The shipping exe is `PeakyBlinders.exe` inside `<install>\\Binaries\\Retail\\` — **point Steam at that, not any outer launcher stub**.

**Controller:** Full native controller support, so the Deck gamepad works without a Steam Input remap. Valve also rates the title **Steam Deck Verified**.

**Supply your own copy:** deckport only configures the prefix; it never bundles or links the game files.
"""

