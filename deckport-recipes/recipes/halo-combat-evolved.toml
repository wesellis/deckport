summary   = "**Halo: Combat Evolved** is the first entry in the **Halo** series and the launch title that defined the original Xbox, built by **Bungie** on the **Halo engine** and widely credited with popularizing **console FPS** design. **Gearbox Software** produced the standalone Windows port in 2003, which added **LAN/online multiplayer** and higher-resolution graphics. It is critically acclaimed as one of the most influential shooters ever made. The standalone PC version was effectively superseded by the **Master Chief Collection** rerelease, and its original **GameSpy**-based multiplayer servers are long defunct."

