[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "gold"
caveats       = """
**Supply your own copy** — delisted commercial game.

**GFWL:** the Steam build got a **May 2025 update removing `GFWL`**, so update to the latest version first. Legacy / non-Steam copies still need community `GFWL` workarounds.

**Display:** run from **Desktop Mode** (Gaming Mode mangles resolution) and turn **Fullscreen off** in graphics options to dodge the black-screen issue.

**Controller:** native gamepad works, but some Proton versions don't detect external pads — switch Proton version (`GE-Proton` recommended) if the gamepad doesn't appear.

**Cosmetic:** a few arcade cutscenes render a broken texture then skip themselves. deckport links nothing.
"""
