summary   = "**F1 2017** is the official game of the 2017 FIA Formula One World Championship and the tenth Formula One title developed by **Codemasters** on its **EGO engine**. It features all twenty drivers, ten teams and twenty circuits of the season alongside twelve **classic cars** from teams such as Ferrari, McLaren, Williams, Red Bull and Renault. The game is best known for its deep, expanded **career mode** with a research-and-development tree and for the return of historic machinery, earning generally favorable reviews. It was later **delisted** from sale when the Formula One licensing window closed and was succeeded by newer entries in the series."

[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "platinum"
caveats       = """
**Supply your own copy.** deckport links nothing. Delisted Codemasters racing title (license expired).

**Status:** Community reports confirm it runs on Linux/Proton, so it should play on the Deck — but this specific recipe hasn't been hardware-verified yet.

**Fix:** Main gotcha: a **'stuck on Loading'** hang affects some users on stock Proton; `GE-Proton` (or `proton_experimental`, with `DXVK_ASYNC=1` as a fallback) fixes it.

**Binary:** `F1_2017.exe`.

**Controller:** Native controller support — set the in-game controller profile to match (PS/Xbox); no Steam Input layout needed.

**Online:** Online multiplayer relies on services that may no longer be live, but single-player (career / Grand Prix / time trial) is fully playable offline."""
