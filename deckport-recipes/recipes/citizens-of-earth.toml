caveats       = """
**Supply your own copy:** deckport links nothing.

**Online:** Single-player turn-based RPG, so no servers to worry about.

**Controller:** Controller support is in-game and works best with an Xbox 360 / `XInput`-style pad — on the Deck, set the Steam Input config to a standard gamepad layout and it plays fine on the sticks/buttons. Note the game's pre-launch settings window does **not** take controller input, so if it appears you'll need to click *Play* with the trackpad/mouse before the pad takes over. Menus and combat are also fully keyboard/mouse navigable as a fallback.

**Install:** Confirm the exact `.exe` name from your install if `Citizens of Earth.exe` doesn't match (Unity ships one game `.exe`)."""
