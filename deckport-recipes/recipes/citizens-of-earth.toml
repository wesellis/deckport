[about]
developer = "Eden Industries"
publisher = "Atlus"
released  = "2015"
genre     = "Turn-based role-playing game"
modes     = "Single-player"
summary   = """
**Citizens of Earth** is a turn-based RPG built in **Unity** in which you play the newly elected Vice President of the World and recruit ordinary townspeople as your party members, each with abilities tied to their everyday jobs. Drawing clear inspiration from **Mother/EarthBound**, it pairs a quirky comedic tone with a deep roster of over **40 recruitable citizens**.

It launched in January 2015 to a mixed-to-positive reception, praised for its humor and creativity but criticized for early balance and bug issues. It was pulled from Steam in July 2023 when the **publishing agreement between Sega and developer Eden Industries** ended."""

