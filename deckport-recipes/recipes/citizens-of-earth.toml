notes      = """
**Delisted:** Delisted Steam game (appid `258910`), pulled `2023-07-14` when the Sega/Eden Industries publishing terms ended.

**Proton:** Turn-based Unity RPG; ProtonDB rates it gold and Unity titles of this era run clean under Proton (`GE-Proton` or `Proton 7.0+`/`Experimental` all work).

**DRM:** **No `GFWL`/`SecuROM`/DRM to bypass** and no widescreen hack needed.

**Launch:** Launch via the prefix, **no special launch options required**.

**Install:** deckport only configures the prefix; it never bundles or links the game files."""

