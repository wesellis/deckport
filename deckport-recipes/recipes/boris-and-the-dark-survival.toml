[game]
title       = "Boris and the Dark Survival"
slug        = "boris-and-the-dark-survival"
aliases     = []
type        = "proton"
engine      = "other"
steam_appid = "1236990"
sgdb_id     = ""

[launch]
binary         = "Boris.exe"   # Unreal Engine launcher; the real shipping binary is Boris/Binaries/Win64/Boris-Win64-Shipping.exe — confirm from your install
launch_options = ""
requires_files = []

[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Proton:** Stock Proton works — this title is **Steam Deck Verified** and ProtonDB Platinum. If you hit any FMV cutscene rendering glitch (a common Proton issue on Unreal Engine titles, though not consistently reported for this game), try a recent `GE-Proton` build.

**Performance:** Unreal Engine 4 title, ProtonDB Platinum (small sample, ~5 reports) and reported running 40-60 FPS on the Deck.

**Exit:** On exit the process can hang; **use Steam's 'Stop' button** if it doesn't close.

**DRM:** Delisted Steam game (appid 1236990; removed from Steam early-mid Aug 2025 ahead of Bendy: Lone Wolf — existing owners keep it, no longer for sale). deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "Joey Drew Studios Inc."
publisher = "Joey Drew Studios Inc."
released  = "2020"
genre     = "Survival horror with roguelike elements"
modes     = "Single-player"
summary   = "**Boris and the Dark Survival** is a free standalone spin-off in the **Bendy** franchise, serving as a side prequel to Bendy and the Ink Machine. Players control Boris the Wolf as he scavenges a **randomly generated studio** for items while evading the Ink Demon, blending survival horror with roguelike runs. Built in **Unreal Engine 4**, it released in February 2020 on the third anniversary of Bendy and the Ink Machine. It was **removed from Steam in August 2025** ahead of its replacement, Bendy: Lone Wolf; existing owners keep access to it."

