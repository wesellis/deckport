[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "platinum"
caveats       = """
**Supply your own copy.** deckport links nothing.

**DRM:** Delisted from Steam Aug 2025 (no longer for sale; existing owners retain it).

**Performance:** ProtonDB Platinum (small sample) and Steam Deck Verified, with Deck reports around 40-60 FPS.

**Controller:** Full native controller support (Steam lists "Full controller support") — no Steam Input hack needed.

**Known issues:** Process can hang on exit (use Steam's 'Stop' button). If FMV cutscenes glitch, switch to a recent `GE-Proton` build; this is not consistently reported for this game and stock Proton is generally fine.

**Binary:** `Boris.exe` / `Boris-Win64-Shipping.exe` is the standard UE4 layout but should be confirmed against an actual install."""
