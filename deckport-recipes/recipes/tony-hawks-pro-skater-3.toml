caveats       = """
**Supply your own copy:** Delisted commercial game (original Neversoft PC port).

**Binaries:** Base binary is `Skate3.exe`; PARTYMOD's `partypatcher.exe` creates a patched `THPS3.exe` you can launch instead.

**Controller:** Stock port has spotty gamepad detection. **PARTYMOD is strongly recommended** — it ships control fixes, multi-device stick support and corrected 60Hz frame pacing; pair with Steam Input if the in-game pad handling is still flaky on Deck.

**Note:** Distinct from the 2023 'Tony Hawk's Pro Skater 3 + 4' remake, which is still for sale (do not confuse the two)."""
