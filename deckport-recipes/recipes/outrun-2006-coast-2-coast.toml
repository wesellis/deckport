[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "platinum"
caveats       = """
**Supply your own copy:** Delisted commercial game.

**Controller:** The game has native gamepad support, but if accelerate/brake don't respond, open the Steam overlay and **disable Steam controller support** (or apply a Steam Input gamepad layout) so the game's built-in input takes over.

**Rumble:** The `OutRun2006Tweaks` INI can restore XInput rumble (off by default since 0.4.2 due to Bluetooth lag).

**Install:** Apply `OutRun2006Tweaks` into the install dir and keep the `WINEDLLOVERRIDES` launch option so the wrapper loads.

**Test on hardware before marking working.**
"""
