[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "gold"
caveats       = """
**Supply your own copy:** deckport links nothing.

**Delisted:** Removed from Steam `2019-07-31` (overseas version, by developer request) — owners keep library access; no longer for sale on Steam.

**Proton:** ProtonDB **gold**; community reports it running fine on Linux/Proton, and as a simple offline 2D shmup it should play well on the Deck.

**Controller:** Native XInput support (Steam tags it Partial Controller Support — menus may need touch/trackpad in spots).

**Config:** Binary is `gundrec.exe`; tweak `gundrec.ini` for unmappable keys.

**Note:** Single-player only, so no server-shutdown concern. **Not yet confirmed on a physical Deck.**"""
