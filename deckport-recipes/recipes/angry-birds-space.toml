[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Status:** Delisted Steam game (appid `210550`). ProtonDB rates it **gold** and community reports confirm it runs on Linux/Proton.

**Proton:** `GE-Proton` (or `proton_experimental`) launches cleanly, with no DRM/GFWL middleware to bypass.

**Controller:** The slingshot gameplay is pure point-and-click mouse, so it has **NO native controller support**. On the Deck, add a Steam Input layout that drives the cursor with the right trackpad (or gyro) and binds left-click to a trigger; aiming the slingshot then works fine.

**Install:** deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "Rovio Entertainment"
publisher = "Rovio Entertainment"
released  = "2012"
genre     = "Physics-based puzzle"
modes     = "Single-player"
summary   = "**Angry Birds Space** is a 2012 physics-based puzzle game and the fifth main entry in Rovio's **Angry Birds** series, notable as the first to move the slingshot gameplay into **outer space** where varied planetary **gravity fields** bend each bird's trajectory. It launched in a partnership with **NASA** and was a major commercial hit, passing 50 million downloads within weeks of release. Like the rest of the classic Angry Birds catalog, it was later **delisted** and is no longer sold, leaving the PC/Mac version unsupported."

