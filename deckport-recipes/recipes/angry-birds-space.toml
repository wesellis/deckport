caveats       = """
**Supply your own copy.** deckport links nothing.

**Compatibility:** ProtonDB **gold**; runs on Linux/Proton per community reports (delisted, no longer purchasable on Steam).

**Controller:** No native gamepad support — the slingshot is mouse-only, so on the Deck you **MUST** set up a Steam Input layout using the right trackpad/gyro as the mouse with a trigger bound to left-click; without that the game is unplayable on a controller.

**Online:** Single-player/offline, so no server-shutdown risk.

**Needs-test:** Binary (`AngryBirdsSpace.exe`) and Steam Input layout still need a hands-on Deck pass to confirm."""
