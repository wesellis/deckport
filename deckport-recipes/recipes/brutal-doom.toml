[game]
title       = "Brutal Doom"
slug        = "brutal-doom"
aliases     = ["Brutal Doom v21", "BrutalDoom", "Brutal Doom v22"]
type        = "native"        # native Linux via GZDoom Flatpak — no Proton needed
engine      = "gzdoom"
steam_appid = ""
sgdb_id     = ""

[launch]
binary         = "flatpak"
launch_options = "run org.zdoom.GZDoom -file brutalv22.pk3 -iwad doom2.wad"
requires_files = [
  "Brutal Doom PK3 from ModDB (brutalv22.pk3 or similar)",
  "Doom II WAD file (DOOM2.WAD — from Steam, GOG, or any legally-owned copy) OR Freedoom Phase 2 (free substitute from freedoom.github.io)",
]

[proton]
version    = ""
winetricks = []
notes      = """
**Install:** GZDoom is installed via Flatpak: `flatpak install flathub org.zdoom.GZDoom`.

**Files:** Drop `brutalv22.pk3` and your `DOOM2.WAD` (or `freedoom2.wad`) into the GZDoom config folder: `~/.var/app/org.zdoom.GZDoom/.config/gzdoom/`. This is the directory GZDoom searches for IWADs and PWADs by default — files placed in the bare `~/.var/app/org.zdoom.GZDoom/` will NOT be found.

**Heads-up:** The GZDoom Flathub package still runs fine but is no longer actively maintained; the ZDoom team now points to **UZDoom** (AppImage) as the successor port. The Flatpak remains the simplest Game-Mode-friendly option on Deck for now.

**Controller:** GZDeck is a controller-friendly launcher for all GZDoom mods in Steam Game Mode — **highly recommended** for managing WAD+mod combos on Deck."""

[about]
developer = "SGtMarkIV (Sergeant_Mark_IV)"
publisher = "Independently released (free mod)"
released  = "2010 (first release); v21 stable; v22 Beta ongoing 2025–2026"
genre     = "First-person shooter (Doom mod)"
modes     = "Single-player, co-op (with Zandronum)"
summary   = "The most downloaded **Doom** mod of all time with over 10 million downloads. **Brutal Doom** dramatically overhauls **Doom II**'s gameplay with brutal **kill animations**, new weapons, enhanced enemy behaviors, and completely reworked combat mechanics. Active since 2010 and still receiving updates — v22 Beta is ongoing as of 2025–2026. Works as a **gameplay mod** layered on top of any Doom II-compatible IWAD or mapset, and pairs especially well with large megawads like **Eviternity II**."

