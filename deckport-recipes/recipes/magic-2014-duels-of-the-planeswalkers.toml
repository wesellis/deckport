contributor   = ""
protondb_tier = "platinum"
caveats       = """
**Supply your own copy.** deckport links nothing — it only configures the prefix.

**Delisted:** Delisted Nov 2020 (WotC request); not for sale, but prior owners keep Steam library access.

**Proton:** ProtonDB platinum with multiple reports of it running like the Windows build under Proton. Use `GE-Proton` (or `proton_experimental`).

**DRM:** No GFWL/SecuROM — plain Steam DRM only.

**Controller:** Native controller support, so Deck gamepad works without a Steam Input layout.

**Binary:** Binary is `DotP_D14.exe` (the series uses the "D14" = Duels 2014 short tag, not the full year), in `steamapps/common/Magic 2014/`.

**Online:** Single-player and pass-and-play are fully offline; any online multiplayer is dead."""
