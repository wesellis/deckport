summary    = """
**Jurassic Park: The Game** is an episodic graphic adventure developed and published by **Telltale Games**, set during the events of the 1993 film and built on the **Telltale Tool** engine. Gameplay is cinematic and story-driven, relying heavily on **quick-time events** and dialogue rather than traditional point-and-click puzzles.

It was released across four episodes in November 2011 and met a mixed critical reception, with praise for its setting and atmosphere but criticism of its restrictive QTE-focused design. The game was delisted from digital storefronts following the **closure of Telltale Games in 2018**."""

