[proton]
version    = "proton_experimental"
winetricks = []
notes      = """
**Game:** Telltale's 2011 episodic **Jurassic Park** adventure (all episodes) — a cinematic, QTE-driven game on the **Telltale Tool** engine.

**Binary:** The real launcher lives in the `GameData` subfolder of the install directory as **`JurassicPark101.exe`** (the patched build). Older/unpatched copies use `JurassicPark100.exe` in the same folder — point the recipe at whichever exists.

**Controller:** Native gamepad support (the whole game is QTE/button-prompt driven) — Steam Input not required. If the game refuses to start, unplug extra controllers and leave only one active.

**Known fix — missing cursor / QTE icons:** A Telltale Tool bug can hide the mouse cursor and on-screen QTE prompts. Workaround: pause (Spacebar/Esc) → **Load** → reload the latest checkpoint to make the icons reappear.

**Install method:** Normal Steam install. As a Telltale Tool title it runs well under Proton; do **not** let it install its bundled DirectX (Proton/DXVK handles that).

**Display:** Playable on Deck (`~800p`, `30-60fps`)."""

