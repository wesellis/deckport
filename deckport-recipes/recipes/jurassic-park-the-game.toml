caveats       = """
**Supply your own copy:** Delisted commercial game — Telltale's catalogue was pulled from storefronts after the studio's 2018 closure, so it can no longer be purchased. Run it from a copy you already own in your Steam library.

**Binary:** Launcher is `GameData/JurassicPark101.exe` (patched) — or `JurassicPark100.exe` on unpatched copies. Confirm which file your install actually contains.

**Controller:** Native gamepad support; the whole game is button-prompt/QTE based."""
