[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "silver"
caveats       = """
**Supply your own copy.** deckport links nothing.

**DRM:** Delisted from Steam 2019-01-01 (no longer for sale; owners keep library access).

**Stability:** ProtonDB silver — playable but not flawless. Known XAudio2-driven instability: stock Proton builds can throw memory-alloc errors (`7.0-6`), hang at the loading screen (`8.0.5`), or randomly crash with `DXVK` (`9.0.4` / `Experimental`) per Proton issue #8465.

**Mitigations:** `GE-Proton` + `xact` winetricks (or `xaudio2_7.dll` `native,builtin` in `winecfg`), the `DXVK_FRAME_RATE=60` launch wrapper, and as a last resort disabling `DXVK`.

**Binary:** Main executable is `KFP.exe` in the install root (`steamapps/common/Kung Fu Panda Showdown of Legendary Legends/KFP.exe`). Set the binary if your install differs.

**Controller:** Controller support is solid (native Xbox 360 / PS4 pads) and keyboard-only play is not really supported, so use the Deck gamepad.

**Multiplayer:** Online multiplayer servers may be dead post-delisting; local 4-player still works.

**Status:** Needs hands-on Deck confirmation."""
