[game]
title       = "Kung Fu Panda: Showdown of Legendary Legends"
slug        = "kung-fu-panda-showdown-of-legendary-legends"
aliases     = []
type        = "proton"
engine      = "other"
steam_appid = "369230"
sgdb_id     = ""

[launch]
binary         = "KFP.exe"   # main game executable in the install root
launch_options = "DXVK_FRAME_RATE=60 %command%"
requires_files = []

[proton]
version    = "GE-Proton"
winetricks = ["xact"]
notes      = """
**Game:** Delisted Steam game (appid `369230`, license ended, pulled from Steam 2019-01-01). 2.5D platform fighter (Smash-style brawler). ProtonDB tier silver.

**Compatibility:** Compatibility is finicky. The upstream Proton issue (#8465) reports stock builds misbehaving — `7.0-6` throws a memory-allocation error, `8.0.5` hangs on the loading screen, and `9.0.4`/`Experimental` randomly crash with `DXVK` loaded. **Root cause is the XAudio2 audio subsystem.**

**Fix:** Use `GE-Proton` and install the `xact` winetricks verb so XAudio2 is provided (some users instead set `xaudio2_7.dll` to `native,builtin` in `winecfg`).

**Display:** The `DXVK_FRAME_RATE=60` launch wrapper is a workaround for frame-rate-related instability. If crashes persist, try toggling `DXVK` off.

**Controller:** Controller-first game (native Xbox 360 / PS4 gamepad support), so it plays well with the Deck's built-in controls.

**Install:** deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "Vicious Cycle Software"
publisher = "Little Orbit"
released  = "2015"
genre     = "Platform fighter / brawler"
modes     = "Single-player, local multiplayer (up to 4 players)"
summary   = """
**Kung Fu Panda: Showdown of Legendary Legends** is a **2.5D platform fighter** in the **Super Smash Bros.** mould, built around the DreamWorks **Kung Fu Panda** film franchise. Players brawl as Po, the Furious Five, Tai Lung, Shen and other series characters across themed stages, using combos and special moves to knock opponents off the screen.

Developed by Vicious Cycle Software and published by Little Orbit as a tie-in to **Kung Fu Panda 3**, it launched in late 2015 on PC and consoles to mixed-to-mediocre reception. The Steam version was later **delisted when the licensing arrangement ended**."""
hero  = "auto"
logo  = "auto"
icon  = "auto"

