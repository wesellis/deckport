[game]
title       = "Blair Witch Volume II: The Legend of Coffin Rock"
slug        = "blair-witch-volume-2"
aliases     = ["Blair Witch Vol 2", "Blair Witch Coffin Rock", "Blair Witch Volume 2"]
type        = "proton"
engine      = "other"
