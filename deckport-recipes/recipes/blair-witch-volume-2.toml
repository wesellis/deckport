caveats       = "Supply your own legally obtained copy of the game. This is NOT the 2019 Bloober Team Blair Witch game (Steam App 1149640). This is Volume II of the 2000 PC anthology trilogy. Developed by Human Head Studios but built on Terminal Reality's Nocturne engine - the SAME engine as Volume I (not a Quake 2 derivative). It is third-person fixed-camera survival horror, not first-person. Being a 3dfx/Glide-era title, it needs modern-system work (dgVoodoo2 wrapper, DirectPlay, XP-era compatibility, nocturne.ini); intro videos use the legacy Indeo codec and may not play. Steam Input works well for the fixed-camera controls; bronze tier is an estimate given the wrapper requirement, not measured."
