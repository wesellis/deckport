caveats       = """
**Free, open-source game** — no purchase needed.

**Install:** Use the Airshipper Flatpak (`net.veloren.airshipper`, Flathub) for the easiest Deck install.

**Display:** The UI is small at Deck's native resolution — consider increasing UI scale in settings.

**Keyboard:** No built-in virtual keyboard: use a Bluetooth keyboard or Steam's on-screen keyboard for initial character/account setup.

**Controller:** No full native gamepad support — Veloren is keyboard/mouse-first, so expect to use the Deck trackpads/mouse emulation (right d-pad toggles mouse control). The Flathub Airshipper Flatpak has a known controller-input permission limitation; if controller behavior is poor, use the manual Airshipper download from veloren.net instead."""
