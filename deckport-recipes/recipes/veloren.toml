developer = "Veloren Contributors (open-source community)"
publisher = "Veloren Contributors (free, open-source)"
released  = "2019 (first public alpha); ongoing weekly/nightly releases"
genre     = "Multiplayer voxel RPG, action-adventure"
modes     = "Single-player, Online multiplayer"
summary   = "**Veloren** is a free, open-source **multiplayer voxel RPG** written entirely in **Rust** and inspired by games like Cube World, Minecraft, and The Legend of Zelda: Breath of the Wild. Development began in 2018 with the first public release in 2019, and the project continues with weekly releases driven by a large volunteer contributor community. Players explore a **procedurally generated open world**, combat creatures, craft gear, and adventure together on community-run servers. The **Airshipper** launcher keeps the client up to date and displays live server player counts. Performance on Steam Deck is generally good at medium settings."

