notes      = """
**Native Linux.** No Proton needed.

**Install:** The recommended Deck install is the Airshipper launcher Flatpak (`net.veloren.airshipper`), available on Flathub and installable via Discover in Desktop Mode. Airshipper handles downloading and updating the game client (`veloren-voxygen`) automatically.

**Alternative:** Download Airshipper directly from veloren.net and run it as a non-Steam game pointing to the `airshipper` binary.

**Controller:** Veloren is keyboard/mouse-first and has **no full native gamepad UI** — you'll primarily use the Deck's trackpads/mouse emulation (the right d-pad toggles mouse control). Note the Flathub Airshipper Flatpak has a known controller-input permission limitation; the manual Airshipper download from veloren.net is the workaround for better controller behavior. See the official Deck notes for current quirks.

**Display:** The in-game UI is small at Deck resolution and there is no Steam Input virtual keyboard, so **pairing a Bluetooth keyboard for initial account setup is helpful**."""

