protondb_tier = "silver"
caveats       = """
**Supply your own copy:** deckport links nothing. Delisted from Steam 2024-02-29 (license expired) and never re-released elsewhere, so it is no longer for sale.

**Install:** Normal Steam install. Binary is set to `Game/RayGigant.exe` (the `RayGigant` executable inside the `Game` subfolder, per community install instructions). If your copy's exe sits at the install root, change `[launch].binary` to `RayGigant.exe`.

**Proton:** Pick `GE-Proton` or `Proton Experimental` if the default complains. ProtonDB silver — community confirms it runs on Linux/Proton; not yet confirmed on this exact recipe, so status is **needs-test**.

**Controller:** Fully offline single-player JRPG with native controller support (Vita port), so input works on the Deck with no Steam Input layout."""
