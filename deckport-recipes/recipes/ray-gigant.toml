[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Proton:** ProtonDB **silver** (best reported **platinum**, 6 reports / low confidence). Use `GE-Proton` (or `Proton Experimental`) and it boots into the JRPG menus; reports note it generally runs once a working Proton build is selected.

**Controller:** Single-player dungeon-crawler JRPG (originally PS Vita), so it ships with full native gamepad support — the Deck controls work out of the box, no Steam Input keyboard layout needed.

**DRM:** Steam DRM only — no GFWL/SecuROM/online DRM and no multiplayer servers. **Fully offline** once installed.

**Install:** Normal Steam install. The community install layout is `steamapps/common/Ray Gigant/Game/RayGigant.exe` — the game launches the `RayGigant` executable inside the `Game` subfolder. If your install puts the exe at the install root instead, set `[launch].binary = "RayGigant.exe"`.

**Delisting:** Delisted Steam game (appid `421600`), removed from sale 2024-02-29 when the license expired, so it no longer appears in the store. You must already own it. deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "Experience Inc."
publisher = "Bandai Namco Entertainment (Japan); Acttil (North America/Europe)"
released  = "2016"
genre     = "Dungeon-crawler JRPG"
modes     = "Single-player"
summary   = "**Ray Gigant** is a **dungeon-crawler JRPG** that blends first-person dungeon exploration with **visual-novel storytelling**, originally released on the PlayStation Vita in 2015 before coming to PC in 2016. Its three branching tales follow Ichiya, Kyle, and Nil, and it forgoes random encounters in favor of a narrative focus and a distinctive **three-distance battle system** against towering 'Gigant' enemies, with rhythm-based **'Slash Beat Mode'** segments. It was developed by **Experience Inc.**, a studio known for dungeon RPGs, and progression uses an **'Evolve Tree'** skill system. The Steam version was delisted in 2024 when its **publishing license expired** and was never re-released elsewhere."

