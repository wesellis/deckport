[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "platinum"
caveats       = """
**Supply your own copy:** deckport links nothing.

**Status:** ProtonDB **platinum** (`appid 553210`); community reports confirm it runs on Linux/Proton, so it should be solid on the Deck — flagged `needs-test` because no one has run this exact recipe end-to-end yet.

**Binary:** `SpaceWolf.exe` is the standard Unity name; double-check it in your install folder.

**Controller:** No native controller support — point-and-click only, so set up a Steam Input trackpad-as-mouse layout before launching (genre plays fine that way).

**Multiplayer:** The PvP multiplayer relied on HeroCraft servers that may be offline post-delist; treat **single-player campaign** as the supported mode.
"""
