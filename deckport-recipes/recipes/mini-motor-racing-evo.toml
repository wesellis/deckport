caveats       = """
**Supply your own copy:** Delisted from Steam `2019-12-10` (`appid 209520`); base EVO is no longer for sale. deckport links nothing.

**Proton:** ProtonDB **platinum** — runs cleanly under Proton (`GE-Proton` or experimental), no DRM/GFWL, no winetricks.

**Controller:** Native controller support with full in-game gamepad remapping, works with Deck controls out of the box.

**Unverified:** **NOT yet hands-on verified on a Deck.** Launcher exe is `Mini Motor Evo.exe`; confirm it in your install folder.

**Note:** Mini Motor Racing X is a separate, still-for-sale game; this recipe is only the delisted EVO."""
