protondb_tier = "bronze"
caveats       = "This original 2000 release never shipped on Steam, so there is no Steam appid and no ProtonDB rating — the tier here reflects the WineHQ AppDB community reports, which note keyboard input not functioning normally under Wine. For a game whose entire mechanic is typing, that is a potential showstopper and must be confirmed on current Proton before trusting it. You must supply your own legally obtained copy; the retail version uses a CD/serial key and expects the disc in the drive, so install from your own media first. The installed Western executable is Tod_e.exe (todus.exe from the wizard install); run setup.bat once if your copy needs it to unpack audio. A physical USB keyboard is required — the Steam Deck on-screen keyboard is far too slow for the core typing mechanic — so dock the Deck and use a full keyboard. The game is locked to 640x480 with no graphics options. This is the original Typing of the Dead (2000), NOT Typing of the Dead: Overkill (Steam App 246580), which is a separate modern game on Steam."
