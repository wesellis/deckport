summary   = "**SoulWorker** is a free-to-play **anime-styled action MMORPG** known for its fast **hack-and-slash combat**, **cel-shaded visuals**, and a cast of teenage 'Soulworkers' fighting in a post-apocalyptic world. The series originally launched in Japan in 2016. The earlier Western release via Gameforge's EU/NA servers shut down on April 30, 2021, but this appid (`1377580`) is the separate **global VALOFE/G·O·P release that is still live and free-to-play on Steam** (released October 2, 2020)."

