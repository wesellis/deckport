protondb_tier = "gold"
caveats       = """
**Supply your own copy.** deckport links nothing.

**Which game:** This recipe is the **original 2003** Beyond Good & Evil (appid `15130`), not the console-only HD remaster and not the 20th Anniversary Edition (appid `2556990`). The original was delisted from Steam around the 20th Anniversary launch (2024).

**Status:** ProtonDB **gold** (strong confidence); community reports confirm it runs on the Deck under `proton_experimental` / recent `GE-Proton`, so this is **needs-test** rather than verified — nobody has signed off on this exact recipe yet.

**Display:** The bundled `SettingsApplication.exe` is unreliable under Proton (can't change language or resolution from it; may launch at the wrong resolution). Apply the PCGamingWiki/GameBanana widescreen fix next to `BGE.exe` (+`NoBands` registry entry) or pre-set resolution on Windows. The GOG build is pre-patched and easier if you own it.

**Audio:** Defaults to French and stock Proton has cutscene audio desync; experimental/GE help, and some reporters also replace `dsound.dll` and set the CPU governor to `performance`.

**Controller:** Works but binding is fiddly (prompts don't update) — use a **Steam Input community layout** for clean console-style controls.

**Binary:** `BGE.exe` in `.../steamapps/common/Beyond Good and Evil/`; confirm against your install."""
