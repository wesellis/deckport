winetricks = []
notes      = """
**Which game:** This is the **original 2003 Beyond Good & Evil** (Steam appid `15130`) — *not* the console-only "HD" remaster (2011) and *not* the separate **20th Anniversary Edition** (appid `2556990`). The original was delisted from Steam around the 20th Anniversary launch (2024). Main executable is `BGE.exe` in `.../steamapps/common/Beyond Good and Evil/`.

**Proton:** Use `proton_experimental` (or a recent `GE-Proton`, e.g. `GE-Proton7-39+`). ProtonDB rates the title **gold** (strong confidence). Experimental/GE help with the cutscene audio desync and audio drop-outs that plague stock Proton; some reporters still replace `dsound.dll` and pin the CPU governor to `performance` to fully fix cutscene audio sync.

**Display / settings app:** The bundled `SettingsApplication.exe` is unreliable under Wine/Proton (it crashes with several D3D paths), so you often **cannot change language or resolution from it** — the game tends to start at a non-native resolution. Workarounds: set resolution/HW Vertex Processing via the settings app on a Windows box, or apply the **PCGamingWiki/GameBanana widescreen fix** (drop the `d3d9` injector next to `BGE.exe` and edit `d3d9.ini`) plus a `NoBands` registry entry to remove black bars. The GOG build ships pre-patched with an in-game language option and is the easier source if you own it.

**Controller:** The Steam build exposes gamepad support, but mapping is rough and on-screen prompts don't update; the easiest path on Deck is a **Steam Input community layout** that remaps run and camera — that gives full console-style controls even if native binding is fiddly."""

