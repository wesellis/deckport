[proton]
version    = "GE-Proton"
winetricks = []
notes      = "Add SorR.exe as a non-Steam game and run with Proton/GE-Proton. XInput controls are enabled by default in v5.2, so Xbox-style pads work without extra setup; if a controller isn't detected, use Steam Input. Supports 2-player local co-op. 16:9 widescreen support. All assets are original fan-made work; no Sega ROM files required. This is a different project from Streets of Rage X and the official Streets of Rage 4."

[about]
developer = "Bomber Games"
publisher = "Bomber Games"
released  = "2011"
genre     = "Beat-em-up / Brawler"
modes     = "Single-player, Local co-op (2 players)"
summary   = "Streets of Rage Remake (SoRR) v5.2 is a fan game by Bomber Games that recreates the original Streets of Rage trilogy in a single unified engine with fully original fan-made assets. It features 19 playable characters, multiple game modes (story, Survival, Boss Rush, Events, Volleyball), and 2-player local co-op, and is widely regarded as one of the greatest fan projects ever made. The v5 release dates to 2011, with v5.2 released in November 2020. Completely standalone — all assets are original fan creations, no Sega files required. This is a separate project from Streets of Rage X and the official Streets of Rage 4."

