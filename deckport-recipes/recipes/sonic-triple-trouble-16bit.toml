notes      = """\
Run with GE-Proton (standard Proton also works per community reports). Free standalone GameMaker game — no base game required. \
Built-in gamepad support: Xbox/XInput controllers work out of the box (controls are remappable in Settings). \
Download the Windows 64-bit build from the official Game Jolt page (https://gamejolt.com/games/sonictripletrouble16bit/322794), unzip it, and add the .exe as a non-Steam game, then force a Proton version. \
The default Windows-64 executable folder name varies by version; confirm the .exe name after unzipping and update [launch].binary if it differs."""

[about]
developer = "Noah Copeland"
publisher = "Noah Copeland"
released  = "2022"
genre     = "2D Platformer"
modes     = "Single-player"
summary   = "Sonic Triple Trouble 16-Bit is a 2022 free fan remake of the 1994 Sega Game Gear title Sonic Triple Trouble, rebuilt from scratch as a full 16-bit Mega Drive/Genesis-style game by solo developer Noah Copeland over several years. The remake expands and reimagines the original game with overhauled level design, new zones, updated visuals, and a full soundtrack while preserving the spirit of the source material. It is widely considered one of the highest-quality Sonic fan games ever made and is completely free. Released for Windows in August 2022, with macOS and Android builds following in May 2023."

