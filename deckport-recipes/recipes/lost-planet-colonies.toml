[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "silver"
caveats       = """
**Supply your own copy:** Delisted Nov 2021 — configuration only, no links.

**Install:** Pick the DX9 exe; `LostPlanetColoniesDX10.exe` is crash-prone under Proton.

**Proton:** Use `GE-Proton` (older Proton 5.x crashes on startup).

**GFWL:** original/unpatched build needs a GFWL bypass/emulator for saves; the **May 29, 2025** Steam update dropped GFWL on the current default build (local saves) but also removed online multiplayer and wiped old GFWL saves. Downgrade to an older depot if you want the GFWL/online build back.

**Controller:** Native controller support — playable with the Deck gamepad.

**Status:** ProtonDB trends Silver/Gold on recent Proton (old Proton 5.x reports showed startup crashes), but treat as needs-test until confirmed on your build.
"""
