slug        = "viva-pinata-trouble-recomp"
aliases     = ["VP TiP Recomp", "Viva Pinata TiP PC", "VPTiPRecomp", "ReTiP"]
type        = "proton"        # Xbox 360 static recompilation via ReXGlue — currently a Windows build, run via Proton on Deck
