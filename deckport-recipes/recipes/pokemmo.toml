summary   = "**PokeMMO** is a free-to-play **Pokemon MMORPG** with hundreds of thousands of active players across multiple regions derived from the official mainline games. It runs as a **Java application** with a native Linux build; the official **Flatpak** (`com.pokemmo.PokeMMO` via Flathub) is the cleanest install path on Steam Deck. Official Steam Deck support documentation is available at `support.pokemmo.com`. ROM files for each region you wish to play must be supplied by the user from their own legally-owned copies of the corresponding games."

