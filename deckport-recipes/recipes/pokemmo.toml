[game]
title       = "PokeMMO"
slug        = "pokemmo"
aliases     = ["PokeMMO", "Pokemon MMO", "Pokemon Online MMO"]
type        = "native"
engine      = "other"
steam_appid = ""
sgdb_id     = ""

[launch]
binary         = "flatpak run com.pokemmo.PokeMMO"   # Java application; official Flatpak is the easiest Deck path: com.pokemmo.PokeMMO (Flathub) or via the official installer from pokemmo.com
launch_options = ""
requires_files = [
  "ROM files for each Pokemon region game you want to play (FireRed for Kanto, HeartGold/SoulSilver for Johto, Black/White for Unova, Platinum for Sinnoh, Emerald for Hoenn)"
]

[proton]
version    = ""
winetricks = []
notes      = """
**Install:** The official Flatpak is the easiest Deck path: `com.pokemmo.PokeMMO` via Flathub (install through the Discover app), or use the official installer from `pokemmo.com`. PokeMMO runs as a Java application with a native Linux build, so **no Proton is required**. Launch it once in Desktop Mode first so it downloads its client files.

**Display:** Use **Borderless Windowed** mode on Deck — Wayland has issues.

**Controller:** No official controller profile ships; a community **Steam Input** profile can be selected under Controller Settings > Community Profiles. **You must launch PokeMMO through Steam** (add the Flatpak as a non-Steam game) for the controller config to apply — controllers do not work if launched from the Desktop applications menu.

**ROMs:** ROM files for each region you want to play must be supplied from your own legally-owned copies (FireRed for Kanto, HeartGold/SoulSilver for Johto, Black/White for Unova, Platinum for Sinnoh, Emerald for Hoenn).

**Docs:** Official Steam Deck setup guide at `support.pokemmo.com`.
"""

