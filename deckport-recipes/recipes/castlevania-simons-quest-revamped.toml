[proton]
version    = "GE-Proton"
winetricks = []
notes      = "GameMaker Studio fan game (ships an exe + data.win, e.g. from the v2.3.5 'Simons Quest Revamped_2_3_5.zip'). Exact exe name varies by release — confirm it against the extracted folder and point [launch].binary at the actual GameMaker runner exe. GameMaker titles run well under Proton/GE-Proton; use Steam Input for the gamepad if buttons aren't picked up natively. Free standalone release — no original NES files required. This is a separate fan project from Castlevania Chronicles II: Simon's Quest."

[about]
developer = "Fan Development Team"
publisher = "Fan Development Team"
released  = "2020"
genre     = "Platformer 2D / Action-Adventure"
modes     = "Single-player"
summary   = "Castlevania II: Simon's Quest - Revamped is a free fan remake of the notoriously cryptic NES Castlevania II that addresses the original's major pain points. It fixes the infamous bad hints and broken day/night cycle, while adding enhanced graphics and quality-of-life improvements. Completely standalone — no Konami files required. This is a different project from Castlevania Chronicles II: Simon's Quest, developed by a separate fan team."

