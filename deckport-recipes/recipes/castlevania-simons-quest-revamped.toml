caveats       = "Not on Steam, so there is no ProtonDB tier — it's a free standalone GameMaker fan game (latest v2.3.5). As a GameMaker title it generally runs well under Proton/GE-Proton, but verify on-device. No Konami/NES files needed. Different from the Castlevania Chronicles II project (separate fan team). Fixes original Simon's Quest's cryptic hints and broken day/night cycle. Binary name varies by release — set [launch].binary to the actual exe in the extracted folder."
