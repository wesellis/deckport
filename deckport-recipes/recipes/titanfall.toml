caveats       = """
**Supply your own copy.** deckport links nothing.

**Online-only:** this is an online-multiplayer-only game with no offline/campaign mode — **playability depends entirely on the official servers being up**, and they have historically suffered DDoS/cheater outages, so the experience can be hit-or-miss.

**DRM:** Delisted Dec 2021 (no longer for sale).

**Proton:** ProtonDB gold; community reports confirm it runs on Deck/Proton via `GE-Proton`.

**Login:** goes through the EA App/Origin layer; `GE-Proton` handles the overlay/launcher handshake that stock Proton can stumble on.

**Controller:** Full native gamepad support, no Steam Input layout required.
"""
