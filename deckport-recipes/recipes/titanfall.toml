[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**DRM:** Delisted Steam game (`appid 1454890`), removed from sale in Dec 2021 — passes the not-for-sale rule.

**Online-only:** Original Titanfall is online-multiplayer-only; EA/Respawn kept the official servers online for existing owners.

**Proton:** ProtonDB rates it gold and community reports confirm it runs on Linux/Proton/Deck. **Use `GE-Proton`** — it smooths over the EA App/Origin launcher and in-game overlay handshake that can otherwise block boot or login on stock Proton.

**Binary:** The binary is `Titanfall.exe` in the install's root.

**Controller:** Native controller support (console-origin FPS, full gamepad), so no Steam Input hack is needed.

**Install:** deckport only configures the prefix; it never bundles or links the game files.
"""

[about]
developer = "Respawn Entertainment"
publisher = "Electronic Arts"
released  = "2014"
genre     = "First-person shooter (mecha / arena multiplayer)"
modes     = "Online multiplayer only"
summary   = "**Titanfall** is the debut title from Respawn Entertainment, the studio founded by the creators of the original Call of Duty. Built on a heavily modified **Source engine**, it pairs fast **wall-running** pilot combat with summonable mech-like **Titans** across team-based online matches. Critically acclaimed at its 2014 launch, it had no single-player campaign and was online-multiplayer-only. EA and Respawn **delisted** it from storefronts in December 2021 after persistent DDoS and cheating problems, but kept the official servers running for existing owners."

