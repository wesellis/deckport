caveats       = """
**Supply your own copy.** deckport links nothing.

**Delisted:** Delisted Steam game (`appid 204760`, removed Nov 2022); ProtonDB gold. Binary is `DeepBlack.exe`.

**GFWL:** Needs the GFWL workaround: block `DeepBlack.exe` outbound in the firewall (most reliable), and optionally comment out the `NetFileURL` / `NetFileSkipIfNoConnection` lines in `globals/settings.lua` (add a leading `--`), **otherwise it crashes on the dead online check (`biart7.com`)**. `GE-Proton` recommended.

**Controller:** Native Xbox 360 controller support, so the Deck pad works without a custom layout.

**Offline:** The campaign is single-player and fully playable offline once GFWL is bypassed; any online/multiplayer features are dead.

**Status:** Not independently verified on a Deck yet.
"""
