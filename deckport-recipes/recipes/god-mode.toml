caveats       = """
**Supply your own copy:** deckport links nothing.

**Compatibility:** ProtonDB **platinum**, **no DRM/GFWL** — runs out of the box under `GE-Proton` / `proton_experimental` with full controller support, so it should be Deck-friendly.

**Status:** Not yet verified on a physical Deck (`needs-test`).

**Online:** Online and LAN co-op servers appear to be gone; play it solo/offline.

**FPS cap:** Locked to 45 FPS by default; uncap via `bin/game.cfg` (`LockFps = 0` under `Video = {`).

**Binary:** `bin/Godmode.exe` (confirm against your install's folder)."""
