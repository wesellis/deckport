summary   = "Yume Nikki is a 2004 freeware exploration game created in RPG Maker 2003 by the anonymous developer Kikiyama. Players navigate the surreal dreamworld of a hikikomori girl named Madotsuki, collecting 24 'effects' hidden across interconnected dream realms with no traditional combat or dialogue. The game is celebrated for its atmospheric, unsettling visual design and has inspired a large community of fan games and tributes. It is published free on Steam (App 650700) by PLAYISM."

