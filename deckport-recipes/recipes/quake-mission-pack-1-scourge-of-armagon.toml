[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "platinum"
caveats       = """
**Supply your own copy.** deckport links nothing.

**Add-on, not standalone:** It requires a Quake install and the `-hipnotic` launch arg, and binary points at the Quake launcher (swap to `QuakeSpasm`/`vkQuake` for best results and to fix the badly-ripped Steam soundtrack via a `music/` folder).

**Delisted:** Delisted standalone (appid `9040`) — superseded by **Quake Enhanced/Remastered**, which already includes this mission pack and is Deck Verified; this recipe targets the classic standalone build.

**Status:** ProtonDB **platinum** for classic Quake; the standalone Scourge entry has thin direct reports, so status is `needs-test` until confirmed on a Deck.

**DRM:** No GFWL/DRM.

**Controller:** The original bundled `WinQuake.exe` has no native controller support — use a Steam Input keyboard/mouse layout (works well on Deck). Modern ports (QuakeSpasm SDL2 build, vkQuake) add native XInput gamepad support if you swap the binary.

**Multiplayer:** Single-player, so no server concerns."""
