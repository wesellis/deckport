[game]
title       = "Ship of Harkinian"
slug        = "ship-of-harkinian"
aliases     = ["SoH", "Zelda OoT PC Port", "Ocarina of Time PC Port", "soh"]
type        = "native"
engine      = "other"
steam_appid = ""
sgdb_id     = "5335518"

[launch]
binary         = "soh.appimage"
launch_options = ""
requires_files = ["oot.otr"]

[proton]
version    = ""
winetricks = []
notes      = """
**Native:** Fully native Linux via AppImage — **no Proton needed**.

**Install:** Download the Linux Performance or Linux Compatibility zip from GitHub Releases (`HarbourMasters/Shipwright`). Extract it; the AppImage is named `soh.appimage`.

**OTR:** On first launch, use the built-in OTR generation tool to produce `oot.otr` from your legally dumped OoT ROM (any supported region). The `.otr` file **must sit in the same directory as the AppImage**.

**Executable:** Mark the AppImage executable (`chmod +x` or Properties > Permissions) before adding to Steam.

**Controller:** Full controller support out of the box.
"""

[about]
developer = "HarbourMasters (community developers)"
publisher = "Independently released (free, open source)"
released  = "2022"
genre     = "Action-adventure"
modes     = "Single-player"
summary   = "**Ship of Harkinian** is a native PC port of **The Legend of Zelda: Ocarina of Time**, built by the community group HarbourMasters on top of the Zelda Reverse Engineering Team's **decompilation**, which reached completion in November 2021. First released for Windows in March 2022 and expanded to Linux, macOS, Wii U, and Nintendo Switch shortly after, it adds widescreen support, **unlocked framerates** (up to 60 FPS and beyond), a randomizer, cosmetic mods, and dozens of quality-of-life improvements not present in any official release. The project name is a pun on the Ship of Theseus philosophical paradox and King Harkinian from the infamous CD-i Zelda games. A sister project, **2 Ship 2 Harkinian**, extends the same approach to Majora's Mask."

