[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**DRM:** Delisted Steam game (appid `50820`), pulled after Microsoft acquired developer Press Play. Small 2D physics drawing-platformer; **no `SecuROM`/`GFWL` DRM reported**, so it runs cleanly under Proton.

**Proton:** Use `GE-Proton` (or `proton_experimental` as a fallback).

**Install:** Main exe is `Max.exe`; if the install has a `GPlrLanc.exe` launcher, **point the binary at `Max.exe` directly** to skip it.

**Controller:** Drawing is mouse-driven. On the Deck, use a Steam Input layout that maps the **RIGHT TRACKPAD to mouse** (as a trackpad in mouse mode) for drawing the marker line, plus the left stick / d-pad for movement and a face button for jump. That trackpad-as-mouse layout makes it fully playable on Deck.

deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "Press Play"
publisher = "The Games Company"
released  = "2010"
genre     = "2D physics puzzle-platformer"
modes     = "Single-player"
summary   = "**Max & the Magic Marker** is a physics-based **2D puzzle-platformer** from Danish studio **Press Play**, in which the boy Max uses a magic marker to freehand-draw objects that become real, interactive physics elements used to solve puzzles and traverse levels. An early example of the **'draw-to-solve' mechanic**, the player sketches platforms, bridges, weights and shields with a limited supply of ink to help Max chase a monster he accidentally created. It debuted on WiiWare in 2010 to generally favorable reviews (around **76 on Metacritic**), praised for its inventive drawing gameplay and charming art style while criticized for imprecise controls and short length. The Steam (Windows) version was later delisted **after Microsoft acquired Press Play**, and the WiiWare and Desura releases have since shut down."

