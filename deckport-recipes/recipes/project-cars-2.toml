[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = "platinum"
caveats       = """
**Supply your own copy.** deckport links nothing.

**Delisted:** Removed from Steam `2022-09-21` (publisher retired it over expired licensing — no longer for sale).

**Status:** Community ProtonDB reports rate it Platinum (156+ reports, strong confidence) and confirm it runs on Linux/Proton; **not yet verified on a Deck for this exact recipe**.

**Proton:** Requires `proton_experimental`; other Proton versions have been reported to fail to launch (spinning Steam logo, no window).

**Controller:** Native XInput controller + wheel support, so the Deck gamepad works for driving without a custom Steam Input layout (paddle/touchpad bindings are limited).

**Online:** Multiplayer/leaderboards may be degraded post-delisting; single-player and career are unaffected."""
