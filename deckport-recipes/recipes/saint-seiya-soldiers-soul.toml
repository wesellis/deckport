summary   = "**Saint Seiya: Soldiers' Soul** is a **3D arena fighting game** based on Masami Kurumada's **Saint Seiya** (Knights of the Zodiac) manga and anime. Developed by Dimps and published by Bandai Namco, it is an expanded successor to Saint Seiya: Brave Soldiers, adapting the Sanctuary, Asgard, Poseidon and Hades sagas with a roster of **more than 70 fighters** across numerous costumes and stages. The PC version arrived in late 2015 and was later **delisted from Steam**, leaving it unavailable for new purchase."

