notes      = """
**Game:** Delisted Steam game (appid `348710`), a 3D arena fighter. **ProtonDB silver** — community reports it running on Linux/Proton, and it became playable on the Deck via a Proton update.

**Proton:** Use `Proton 7.0-6` (stable); `GE-Proton` also works. Real executable is `SSSS.exe` in `steamapps/common/SSSS/`.

**DRM:** No GFWL/SecuROM DRM to bypass.

**Controller:** Native controller handling is flaky on raw Windows (people resort to `x360ce`/`JoyToKey`), but on the Deck Steam Input presents the built-in gamepad as a standard controller, so a **Gamepad/Gamepad-with-Joystick-Trackpad layout** maps it cleanly without those hacks.

**Known issue:** A few arenas/stages can render incorrectly under Proton (Valve/Proton #3128).

**Install:** deckport only configures the prefix; it never bundles or links the game files."""

