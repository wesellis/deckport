caveats       = """
**Supply your own copy.** Delisted Steam game (appid `348710`); deckport links nothing.

**Proton:** ProtonDB silver, confirmed running on Deck under `Proton 7`. Binary is `SSSS.exe` (`steamapps/common/SSSS/`).

**Controller:** On Deck, use a Steam Input **Gamepad layout** — native controller support is unreliable on Windows, but Steam Input handles it cleanly, so no `x360ce`/`JoyToKey` needed.

**Known issues:** A few arenas may render incorrectly under Proton (Valve/Proton #3128); rare black-screen-on-launch reports exist, usually resolved by switching Proton version.

**Status:** Recipe config not yet hands-on tested on a specific Deck."""
