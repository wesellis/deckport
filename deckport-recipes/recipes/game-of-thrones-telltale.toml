[about]
developer = "Telltale Games"
publisher = "Telltale Games"
released  = "2014"
genre     = "Episodic graphic adventure"
modes     = "Single-player"
summary   = "**Game of Thrones: A Telltale Games Series** is a choice-driven **episodic adventure** set in the world of HBO's Game of Thrones, told across six episodes. Players control members of **House Forrester**, a noble family loyal to the Starks, as their decisions ripple across multiple characters and storylines following the Red Wedding. Built on the **Telltale Tool** engine, it features the studio's signature **branching-dialogue** and quick-time-event gameplay. It was delisted from storefronts following Telltale's 2018 closure and the lapse of the HBO licensing agreement."

