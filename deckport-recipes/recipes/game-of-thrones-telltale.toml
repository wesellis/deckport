caveats       = """
**Delisted:** Telltale closure / HBO license — previous owners still have library access, but **it can't be bought new**.

**Deck status:** Steam Deck Verified status is **Unsupported** (Valve never validated it), but ProtonDB community reports it as **Platinum** / fully playable.

**Display:** Set resolution from the in-game Settings menu, which **only appears once an episode is running**.

**Install:** Executable confirmed as `Thrones.exe`."""
