verified_on   = ""
contributor   = ""
protondb_tier = "silver"
caveats       = """
**Supply your own copy.** deckport links nothing.

**Delisted:** Removed 2023-12-01 (expired car/likeness licensing); not currently for sale.

**Proton:** ProtonDB silver — community reports confirm it launches and plays on Proton/Deck, but this specific recipe still **needs an on-Deck confirmation**.

**Controller:** Support is native (built as a console-derived racing game with full gamepad support), so no Steam Input hack needed.

**Display:** DX12-only renderer (`Grid_dx12.exe`) — no DX11 path, but `DXVK`/`VKD3D` handle it fine.

**Graphics presets:** Known Proton quirk — the game can **crash when you change a graphics preset and click Apply** (ValveSoftware/Proton #4280; reported since Proton 5.13). Resolution changes are fine. Workaround: leave the preset on its default, or set quality manually by editing `hardware_settings_config.xml` in the game's config directory rather than using the in-game preset buttons.

**Online:** Multiplayer services were shut down by the publisher — career/single-player and local play are unaffected."""
