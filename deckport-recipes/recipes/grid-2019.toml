engine      = "other"
steam_appid = "703860"
sgdb_id     = ""

[launch]
binary         = "Grid.exe"   # launcher; the DX12 renderer is Grid_dx12.exe (the game is DX12-only)
launch_options = ""
requires_files = []

[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Status:** Delisted Steam game (appid `703860`, removed 2023-12-01 over expired car/likeness licensing).

**Proton:** ProtonDB tier silver — community reports it running **out of the box** on Proton. Boiling Steam confirmed it working as far back as `Proton 5.13`, and `Proton Experimental`/`GE-Proton` handle it on Deck.

**Display:** The game is **DX12-only** (no DX11 fallback exists), which is fine on the Deck's `RADV`/Vulkan path.

**Install:** Main executable is `Grid.exe` (launcher), which hands off to `Grid_dx12.exe`.

**DRM:** No GFWL/SecuROM DRM steps required.

**Known quirk:** Under Proton the game can **crash when you change a graphics preset and hit Apply** (see ValveSoftware/Proton #4280). The game itself runs fine — just avoid switching presets in-game, or edit `hardware_settings_config.xml` directly. See caveats.

deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "Codemasters"
publisher = "Codemasters"
released  = "2019"
genre     = "Racing"
modes     = "Single-player, multiplayer"
summary   = "**GRID** is a 2019 racing game and the fourth entry in Codemasters' **GRID series**, a reboot of the 2008 original. It blends **arcade handling** with sim-style touches across circuit, street, touring, and stock car events, and features a **'nemesis' AI system** where rival drivers react to aggressive play. Reviews were generally positive and it won **Best Racing Game at Gamescom 2019**. It was delisted in November 2023 over **expired real-world car and likeness licensing**; online services were retired in December 2025, but the career and offline modes remain fully playable."

