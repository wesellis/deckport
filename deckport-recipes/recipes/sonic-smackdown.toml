[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = ""
caveats       = """
**Supply your own copy:** Free fan game (not SEGA), never sold on Steam — runs as a non-Steam shortcut under `GE-Proton`.

**Controller:** Native XInput gamepad support; add to Steam so Steam Input handles controller detection (DirectInput-only pads like DS4 need Steam's mapping). Keyboard/mouse selectable in settings.

**Binary:** Launcher is `SonicSmackdown_x64.exe`, found in the extracted `SonicSmackdown_x64.zip` (Definitive Edition) from ArcForged's itch.io page. Portable — no installer.

**Warning:** The **'Ultimate Sonic Smackdown'** sequel is a different game and is reported not to work on Deck.
"""
