[game]
title       = "Betrayer"
slug        = "betrayer"
aliases     = []
type        = "proton"
engine      = "other"
steam_appid = "243120"
sgdb_id     = ""

[launch]
binary         = "Betrayer.exe"   # UDK/Unreal Engine 3 launcher; the actual engine binary lives under Binaries\Win32\ (GOG free build mirrors the old Steam layout)
launch_options = ""
requires_files = []

[proton]
version    = "GE-Proton"
winetricks = []
notes      = """
**Install:** Delisted from Steam (`appid 243120`, removed May 2021), but the original devs (Blackpowder Games) re-released it **FREE on GOG** in July 2023 — **that official free build is the one to use**.

**Engine:** First-person action-adventure on `Unreal Engine 3` / `UDK`.

**Proton:** Runs well on Linux/Proton; community reports it playing cleanly under `Wine-GE` / `GE-Proton` (`proton_experimental` also works).

**DRM:** No `GFWL`/`SecuROM` DRM to bypass.

**Controller:** the game ships built-in `XInput` gamepad support, but it's only **partial** — community reports note it shows keyboard prompts even on a pad, has no aim assist, awkward menu navigation, and an unmapped/hard-to-bind jump. Plan on a `Steam Input` layout on the Deck (map jump and add keyboard fallbacks for any unbound menu actions) rather than expecting flawless out-of-the-box pad support.

**Note:** deckport only configures the prefix; it never bundles or links the game files."""

[about]
developer = "Blackpowder Games"
publisher = "Blackpowder Games"
released  = "2014"
genre     = "First-person action-adventure / stealth"
modes     = "Single-player"
summary   = "**Betrayer** is a first-person action-adventure with **stealth** elements, set in a haunted early-colonial Virginia in the 17th century. It was made by **Blackpowder Games**, a studio formed largely by **Monolith Productions** veterans who had worked on **F.E.A.R.** and **No One Lives Forever**. The game is known for its striking **near-monochrome black-and-white art direction** and eerie, mysterious tone, built on **Unreal Engine 3**. It drew positive notice for its atmosphere, though some reviewers found the combat clumsy; it was later **delisted from Steam** and re-released for free by the developers."

