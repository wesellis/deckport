protondb_tier = "silver"
caveats       = """
**Supply your own copy:** Commercial game that never came to Steam — supply your own copy (no appid).

**Hard requirement:** `StarForce` DRM blocks launch under Proton, so a no-CD/no-DVD exe is **mandatory**.

**Cutscenes:** FMV cutscenes can stutter/skip even on `GE-Proton` (community reports them borked on stock Proton).

**Controller:** Only crude built-in DirectInput pad support (no rebind menu, keyboard prompts shown, right stick mis-mapped on some pads) — use a gamepad-with-mouse-trackpad Steam Input layout for a usable input path.

**Display:** Apply ThirteenAG's Widescreen Fix and set the Deck's `1280x800` in `TheMatrixPathOfNeo.WidescreenFix.ini` or you'll get a 4:3 stretch.

**Links:** see the Widescreen Fix release and PCGamingWiki guides for the display fix and DRM/controller details.
"""
