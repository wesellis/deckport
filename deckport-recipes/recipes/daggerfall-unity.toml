[game]
title       = "Daggerfall Unity"
slug        = "daggerfall-unity"
aliases     = ["Daggerfall Unity", "DaggerfallUnity", "The Elder Scrolls II: Daggerfall Unity"]
type        = "native"
engine      = "unity"
steam_appid = "1812390"
sgdb_id     = "5335938"

[launch]
binary         = "DaggerfallUnity.x86_64"
launch_options = ""
requires_files = ["ARENA2"]

[proton]
version    = ""
winetricks = []
notes      = """
**Proton:** Not needed — a **native Linux build** is available. Use the native Linux build.

**Install:** Download the Linux 64-bit zip from the `Interkarma/daggerfall-unity` releases — the binary inside is `DaggerfallUnity.x86_64`. Extract the zip into your Daggerfall Steam data directory (`steamapps/common/The Elder Scrolls Daggerfall/`).

**Launch:** In Steam, set the launch options for the Daggerfall entry to: `"/path/to/DaggerfallUnity.x86_64" %command%` — this wraps it in Steam for overlay and playtime tracking.

**Data:** On first launch, the settings screen asks you to point at the Daggerfall game data (the `ARENA2` folder). Since Daggerfall is free on Steam (app `1812390`), the data files are freely available — **just install the Steam game first**.

**Luxtorpeda:** `Luxtorpeda` also supports Daggerfall Unity and can automate the installation and data wiring.

**Wayland note:** On a pure Wayland session the native build can fail to start; if that happens, launch with `SDL_VIDEODRIVER=x11` (e.g. `SDL_VIDEODRIVER=x11 "/path/to/DaggerfallUnity.x86_64" %command%`). Game Mode on Steam Deck is unaffected.
"""

[about]
developer = "Gavin Clayton (Interkarma) and contributors"
publisher = "Independently released (free, open source)"
released  = "2022 (v1.0); ongoing development"
genre     = "Open-source engine, RPG"
modes     = "Single-player"
summary   = "**Daggerfall Unity** is an open-source reimplementation of **The Elder Scrolls II: Daggerfall** (1996) built in the **Unity engine** by Gavin Clayton (Interkarma). Work began around 2009 and reached version 1.0 in 2022. Bethesda made the original Daggerfall **free on Steam**, so the required data files cost nothing to acquire legally. The project dramatically improves the original's stability, adds modern resolutions and rendering options, and supports a rich **modding** ecosystem through DFMods. It is now the standard way to experience Daggerfall on modern systems."

