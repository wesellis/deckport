winetricks = []
notes      = """
**Delisted:** Delisted Steam game (`appid 293520`, pulled 2023-01-31 when it was replaced by the Unity-based 'Carnivores: Dinosaur Hunt', which existing owners got free).

**Engine:** The original Reborn build is a Windows DirectX title; it installs to the `CarnivoresReborn` folder. The launcher is most likely `Reborn.exe` — confirm the exact name against your own install (see caveats).

**Proton:** ProtonDB tier is gold and **it runs cleanly under Proton** — `GE-Proton` is the safe pick; stock `proton_experimental` also works.

**DRM:** No GFWL/SecuROM/DRM gymnastics needed.

**Controller:** The game ships with **FULL controller support** (Steam records confirm), so it plays on the Deck gamepad out of the box; force a Steam Input layout only if the in-game pad mapping feels off.

**Install:** deckport only configures the prefix; it never bundles or links the game files.
"""

[about]
developer = "Digital Dreams Entertainment, Tatem Games"
publisher = "Digital Dreams Entertainment"
released  = "2015"
genre     = "First-person hunting simulator / shooter"
modes     = "Single-player"
summary   = """
**Carnivores: Dinosaur Hunter Reborn** is a **first-person dinosaur-hunting simulator** released on Steam in 2015, a PC revamp of the mobile Carnivores HD built on the long-running **Carnivores series**. Players travel to an alien planet and stalk prehistoric creatures across open islands, managing **scent, cover and weapon choice** before summoning a dropship to evacuate.

It earned a **Very Positive** reception for its realistic creatures, atmospheric environments and nostalgic ties to the classic late-1990s Carnivores games. It was pulled from Steam on 2023-01-31 when it was effectively **superseded by the newer Unity-based Carnivores: Dinosaur Hunt**, which existing owners received for free.
"""

