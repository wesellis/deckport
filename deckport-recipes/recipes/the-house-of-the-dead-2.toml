caveats       = "Supply your own copy of the 1998/2001 PC port; launch Hod2.exe (not HotD2.exe). Use the right trackpad or gyro as a mouse for aiming — no native gamepad support; build a Steam Input layout. Fixed 640x480 resolution. Game may ignore mouse/keyboard if an Xbox-style controller is detected — tame the Steam Input controller emulation if input goes dead. The 2025 House of the Dead 2 Remake on Steam/GOG is the recommended modern alternative."
