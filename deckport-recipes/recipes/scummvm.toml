[meta]
status        = "needs-test"
verified_on   = ""
contributor   = ""
protondb_tier = ""
caveats       = """
**Supply your own copy:** For commercial games (Monkey Island, Day of the Tentacle, Full Throttle, etc.) you need the original data files from GOG or your own discs.

**Freeware:** The **11 freeware games** (Beneath a Steel Sky, Lure of the Temptress, Flight of the Amazon Queen, Dráscula, DreamWeb, etc.) work with zero purchases — download the ZIP from scummvm.org/games, extract it, and add the folder via **Add Game** (there is no in-launcher downloader). Note: Simon the Sorcerer is *commercial*, not freeware.

**Install:** Install via Flathub for the easiest Deck experience.

**Controller:** ScummVM's **virtual joystick mode** (thumbstick = cursor, face buttons = mouse buttons) makes most games playable with the gamepad; check `scummvm.org/compatibility/` for per-game controller notes.
"""
